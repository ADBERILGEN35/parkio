# Spring Cloud release train (imported as a BOM by the convention plugin).
springCloudVersion=2025.1.4

# Jackson 2 (com.fasterxml.jackson): 2.21.7 fixes five HIGH jackson-core/jackson-databind CVEs.
# Spring Boot 4.1.2 manages the same version through jackson-2-bom; the convention plugin and
# the platform module keep it pinned. Jackson 3 (tools.jackson) comes from the Spring Boot BOM.
jacksonBomVersion=2.21.7

# Gradle build performance.
org.gradle.parallel=true
org.gradle.caching=true
# CycloneDX Gradle tasks are still not configuration-cache compatible in this build.
# Keep the configuration cache off so the documented `./gradlew clean build` gate
# exits on actual compile/test results instead of failing after successful tasks.
org.gradle.configuration-cache=false
