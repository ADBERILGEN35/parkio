# Spring Cloud release train (imported as a BOM by the convention plugin).
springCloudVersion=2025.0.3

# Security patch overrides for dependencies still pinned by Spring Boot 3.5.15's BOM.
# Stay on the Boot 3.5 Tomcat 10.1 and Netty 4.1 lines. Apache's 10.1.58 release
# candidate did not pass its vote, so 10.1.59 is the released fix for
# CVE-2026-65182, CVE-2026-65905, and CVE-2026-68525. Netty 4.1.137.Final fixes
# CVE-2026-75595 without moving to 4.2.
tomcatVersion=10.1.59
nettyVersion=4.1.137.Final

# Gradle build performance.
org.gradle.parallel=true
org.gradle.caching=true
# CycloneDX Gradle tasks are still not configuration-cache compatible in this build.
# Keep the configuration cache off so the documented `./gradlew clean build` gate
# exits on actual compile/test results instead of failing after successful tasks.
org.gradle.configuration-cache=false
