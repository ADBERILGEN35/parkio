# Spring Cloud release train (imported as a BOM by the convention plugin).
springCloudVersion=2025.1.4

# Jackson 2 (com.fasterxml.jackson): 2.21.7 fixes five HIGH jackson-core/jackson-databind CVEs.
# Spring Boot 4.1.2 manages the same version through jackson-2-bom; the convention plugin and
# the platform module keep it pinned. Jackson 3 (tools.jackson) comes from the Spring Boot BOM.
jacksonBomVersion=2.21.7

# Gradle build performance. Spring Boot 4's modular classpaths outgrew the default 512 MiB daemon heap:
# the restore-replay harness (nine modules' compileTestJava in parallel) died with "garbage collector is
# thrashing" (#515).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
# CycloneDX Gradle tasks are still not configuration-cache compatible in this build.
# Keep the configuration cache off so the documented `./gradlew clean build` gate
# exits on actual compile/test results instead of failing after successful tasks.
org.gradle.configuration-cache=false

# Dependency download retries (#608). Gradle retries a download that gets HTTP 429, a 5xx answer or a
# dropped connection. By default it makes 3 attempts with waits of 1 s and 2 s. That is too short for
# the 429 bursts that Maven Central sends GitHub runners. 8 attempts, with waits doubling from 1 s,
# keep retrying for about 2 minutes (1+2+...+64 s) before the download fails. A missing artifact
# (404, "Could not find") and a 403 are never retried and still fail at once. This applies to every
# build of this repository, including the image builds, which copy this file.
# scripts/ci/test_gradle_dependency_retry.py checks it.
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=1000
