[versions]
# Plugin versions consumed by buildSrc (the convention plugin).
springBoot = "4.1.2"
springDependencyManagement = "1.1.7"
# JJWT is not part of the Spring Boot BOM, so it needs an explicit version.
jjwt = "0.12.6"
# MinIO client is not part of the Spring Boot BOM, so it needs an explicit version.
minio = "8.6.0"
# Google Cloud Storage client (auth-service GCS Object Retention Lock adapter; default-off).
# 2.60.0+ pulls grpc-netty-shaded ≥1.76 (CVE-2025-55163 fixed in 1.75.0).
googleCloudStorage = "2.60.0"
grpcNettyShaded = "1.76.0"
# Bouncy Castle arrives transitively (MinIO → media; spring-cloud-starter → gateway).
# Pin floor to ≥1.85 for CVE-2026-8763 (Name Constraints bypass; fixed in BC Java 1.85+).
# Also supersedes the prior 1.81.1 floor for CVE-2025-14813. See Keyfactor/BC 1.85 notes.
bouncycastle = "1.85"
# springdoc-openapi (OpenAPI 3 + Swagger UI for Spring MVC). Not in the Spring Boot BOM.
springdoc = "3.2.0"
# Resilience4j (circuit breaker / bulkhead / rate limiter). Not in the Spring Boot BOM,
# so it needs an explicit version; resilience4j-spring-boot4 2.4.0 targets the Spring Boot 4 line.
resilience4j = "2.4.0"
# The same version Spring Boot 4.1.2 manages; tools/dlt-redrive has no BOM.
kafkaClients = "4.2.2"
# CycloneDX Gradle plugin — generates a per-service CycloneDX SBOM (build/reports/bom.json).
# Applied by the convention plugin; consumed by buildSrc. Not part of any BOM. Spring Boot 4
# requires 3.0.0 or later.
cyclonedx = "3.5.1"
commonsCsv = "1.11.0"
# LocationTech JTS — OGC-faithful prepared geometry for municipal district coverage (DATA-WP-19).
jts = "1.20.0"

[libraries]
# Spring Boot starters. Concrete versions are supplied by the Spring Boot BOM,
# applied through the io.spring.dependency-management plugin in the convention plugin.
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Spring Boot 4 splits auto-configuration into modules: Flyway and Kafka need their own starter, and
# each tested technology has a test starter.
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
# The auto-configured RestClient.Builder and WebClient.Builder beans moved to their own modules.
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-webclient = { module = "org.springframework.boot:spring-boot-starter-webclient" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-jdbc-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-kafka-test = { module = "org.springframework.boot:spring-boot-starter-kafka-test" }
spring-boot-starter-flyway-test = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
spring-boot-starter-actuator-test = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
spring-boot-starter-data-redis-test = { module = "org.springframework.boot:spring-boot-starter-data-redis-test" }
spring-boot-starter-restclient-test = { module = "org.springframework.boot:spring-boot-starter-restclient-test" }
spring-boot-micrometer-metrics-test = { module = "org.springframework.boot:spring-boot-micrometer-metrics-test" }
# Jackson 2 for the application's com.fasterxml.jackson code and the HTTP layer (spring.jackson2.*,
# preferred-json-mapper=jackson2). Deprecated in Spring Boot 4; moving to Jackson 3 is a follow-up.
spring-boot-jackson2 = { module = "org.springframework.boot:spring-boot-jackson2" }
# Micrometer Tracing with the OpenTelemetry bridge (Spring Boot 4 moved the auto-configuration here).
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }
spring-boot-opentelemetry = { module = "org.springframework.boot:spring-boot-opentelemetry" }

# Spring Cloud. Version is supplied by the Spring Cloud BOM (see springCloudVersion
# in gradle.properties, imported by the convention plugin).
spring-cloud-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }

# Reactive Redis — backs the gateway's RequestRateLimiter token bucket. Added to
# gateway-service only (the edge owns rate limiting; ai-context/07). Version from
# the Spring Boot BOM.
spring-boot-starter-data-redis-reactive = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive" }

# Kafka (asynchronous event transport). Version is supplied by the Spring Boot BOM.
# Added per-service to publishers/consumers only — gateway-service does not use it.
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafkaClients" }

# Prometheus metrics export (actuator /actuator/prometheus). Version from the
# Spring Boot BOM. Added to every service that has the actuator starter.
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Distributed tracing (OpenTelemetry via Micrometer Observation). Versions come from the
# Spring Boot BOM (micrometer-tracing-bom + opentelemetry-bom) — no explicit pinning, so
# there is a single, BOM-aligned tracing stack (no duplicate tracer). The bridge turns the
# Observations Spring already records into OpenTelemetry spans; the OTLP exporter ships them
# to Tempo. Added to every actuator-enabled service.
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }

# OpenAPI 3 docs + Swagger UI for REST services (Spring MVC only — not the gateway).
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# AOP starter — required for Resilience4j's annotation aspects (@CircuitBreaker, @Bulkhead,
# @RateLimiter). Version from the Spring Boot BOM.
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" }

# Resilience4j Spring Boot 3 integration: circuit breaker, bulkhead and rate limiter as
# annotations configured under `resilience4j.*`. Added per-service where an outbound
# third-party dependency needs isolation (e.g. parking-service's geocoding provider).
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }

# Persistence (versions from the Spring Boot BOM).
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commonsCsv" }
jts-core = { module = "org.locationtech.jts:jts-core", version.ref = "jts" }

# Object storage (S3-compatible, used by media-service).
minio = { module = "io.minio:minio", version.ref = "minio" }
google-cloud-storage = { module = "com.google.cloud:google-cloud-storage", version.ref = "googleCloudStorage" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpcNettyShaded" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# JWT (access tokens).
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Test (versions from the Spring Boot BOM).
spring-security-test = { module = "org.springframework.security:spring-security-test" }
h2 = { module = "com.h2database:h2" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Testcontainers — Kafka integration tests only (versions from the Spring Boot BOM).
# Used by @Tag("integration") tests; the standard `test`/`build` excludes that tag.
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
