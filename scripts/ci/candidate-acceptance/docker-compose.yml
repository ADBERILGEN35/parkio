# Disposable auth+gateway acceptance stack for candidate images (reused from the U03/U04 release
# package, 22/22 on 2026-09-28). Synthetic accounts, isolated databases, loopback ports only.
# AUTH_IMAGE / GATEWAY_IMAGE / PARKIO_JWT_PRIVATE_KEY_PEM come from the environment.
name: parkio-candidate-acc

services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parkio_auth
      POSTGRES_USER: parkio_auth
      POSTGRES_PASSWORD: disposable_auth_pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkio_auth -d parkio_auth"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [acc]

  postgres-gateway:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parkio_gateway
      POSTGRES_USER: parkio_gateway
      POSTGRES_PASSWORD: disposable_gateway_pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkio_gateway -d parkio_gateway"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [acc]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [acc]

  stubs:
    image: python:3.12-alpine
    command: ["python", "/opt/stubs.py"]
    volumes:
      - ./stubs.py:/opt/stubs.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/actuator/health/readiness')"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [acc]
    ports:
      - "127.0.0.1:18099:8081"
    expose:
      - "8081"
      - "8082"

  auth-service:
    image: ${AUTH_IMAGE}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/parkio_auth
      SPRING_DATASOURCE_USERNAME: parkio_auth
      SPRING_DATASOURCE_PASSWORD: disposable_auth_pw
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "127.0.0.1:1"
      MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
      MANAGEMENT_TRACING_ENABLED: "false"
      PARKIO_TRACING_ENABLED: "false"
      PARKIO_OPENAPI_ENABLED: "false"
      PARKIO_GATEWAY_INTERNAL_SECRET: disposable-gateway-internal-secret-u03u04
      PARKIO_JWT_PRIVATE_KEY_PEM: ${PARKIO_JWT_PRIVATE_KEY_PEM}
      # CL-F15 v3: required outside the dev profile; the workflow exports a throwaway value.
      PARKIO_LOGIN_THROTTLE_HMAC_KEY: ${PARKIO_LOGIN_THROTTLE_HMAC_KEY}
      PARKIO_JWT_KEY_ID: parkio-auth-rs256-disposable
      PARKIO_JWT_ISSUER: parkio-auth
      PARKIO_JWT_AUDIENCE: parkio-api
      PARKIO_CORS_ALLOWED_ORIGINS: http://localhost
      PARKIO_REFRESH_COOKIE_SECURE: "false"
      PARKIO_EMAIL_PROVIDER: logging
      PARKIO_EMAIL_VERIFICATION_LOG_TOKEN: "true"
      PARKIO_WEB_BASE_URL: http://localhost:5173
      PARKIO_REGISTRATION_MODE: open
      PARKIO_ADMIN_BOOTSTRAP_ENABLED: "true"
      PARKIO_ADMIN_BOOTSTRAP_TOKEN: disposable-bootstrap-token-u03u04-32chars
      PARKIO_KAFKA_PROVISION_TOPICS: "false"
      PARKIO_OUTBOX_RETENTION_ENABLED: "false"
      PARKIO_INBOX_RETENTION_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s
    mem_limit: 768m
    networks: [acc]
    ports:
      - "127.0.0.1:18081:8081"

  gateway-service:
    image: ${GATEWAY_IMAGE}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-gateway:5432/parkio_gateway
      SPRING_DATASOURCE_USERNAME: parkio_gateway
      SPRING_DATASOURCE_PASSWORD: disposable_gateway_pw
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MANAGEMENT_TRACING_ENABLED: "false"
      PARKIO_TRACING_ENABLED: "false"
      PARKIO_OPENAPI_ENABLED: "false"
      PARKIO_GATEWAY_INTERNAL_SECRET: disposable-gateway-internal-secret-u03u04
      PARKIO_WAITLIST_HASH_SECRET: disposable-waitlist-hash-secret-u03u04xxxx
      PARKIO_WAITLIST_ADMISSIONS_ENABLED: "false"
      PARKIO_WAITLIST_EMAIL_PROVIDER: logging
      PARKIO_WAITLIST_ALLOW_LOGGING_PROVIDER: "true"
      PARKIO_AUTH_JWKS_URI: http://auth-service:8081/api/v1/auth/.well-known/jwks.json
      PARKIO_AUTH_SERVICE_URI: http://stubs:8081
      PARKIO_USER_SERVICE_URI: http://stubs:8082
      PARKIO_JWT_AUDIENCE: parkio-api
      PARKIO_CORS_ALLOWED_ORIGINS: http://localhost
      PARKIO_SESSION_EPOCH_CACHE_TTL: PT3S
      PARKIO_SESSION_EPOCH_TIMEOUT: PT2S
      PARKIO_USER_STATUS_CACHE_TTL: PT3S
      PARKIO_RL_AUTH_REPLENISH: "100"
      PARKIO_RL_AUTH_BURST: "200"
      PARKIO_RL_ADMIN_REPLENISH: "100"
      PARKIO_RL_ADMIN_BURST: "200"
      PARKIO_RL_DEFAULT_REPLENISH: "100"
      PARKIO_RL_DEFAULT_BURST: "200"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      postgres-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      stubs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s
    mem_limit: 768m
    networks: [acc]
    ports:
      - "127.0.0.1:18080:8080"

networks:
  acc:
    driver: bridge
