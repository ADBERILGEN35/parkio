# Workflow security (CL-F40): third-party actions pinned to commit SHAs (docker actions to
# digests), and no dispatch input or event field substituted into a script. See
# scripts/ci/check_workflow_security.py for the rules and their exemptions.
name: Workflow security

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ci/check_workflow_security.py"
      - "scripts/ci/test_check_workflow_security.py"
  push:
    branches: [api, master]
    paths:
      - ".github/workflows/**"
      - "scripts/ci/check_workflow_security.py"
      - "scripts/ci/test_check_workflow_security.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Workflow pins and script inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Checker unit tests
        run: python3 -m unittest scripts/ci/test_check_workflow_security.py

      - name: Check every workflow
        run: python3 scripts/ci/check_workflow_security.py
