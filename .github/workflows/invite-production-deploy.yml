name: Invite-production deploy

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/invite-production-deploy.yml"
      - "docker/**"
      - "frontend/**"
      - "infra/**"
      - "scripts/**"
      - "services/**"
  workflow_dispatch:
    inputs:
      action:
        description: "build | runner-acceptance | workspace-migration | deploy | rollback"
        required: true
        type: choice
        options:
          - build
          - runner-acceptance
          - workspace-migration
          - deploy
          - rollback
        default: build
      git_sha:
        description: "Exact 40-character SHA currently at api"
        required: true
        type: string
      dark_gateway_url:
        description: "Dark acceptance endpoint. Leave blank: the invite-production topology publishes exactly one (http://127.0.0.1:8080)."
        required: false
        type: string
      manifest_artifact:
        description: "For rollback: workflow artifact containing a secret-free deploy manifest"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: invite-production-runner
  cancel-in-progress: false

jobs:
  build-images:
    name: Build images + secret-safe dry-run manifest
    if: ${{ github.event_name == 'pull_request' || github.event.inputs.action == 'build' || github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      git_sha: ${{ steps.meta.outputs.git_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify pinned Node runtime
        run: ./scripts/verify-node-runtime.sh

      - name: Verify manual build pin
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          ./scripts/verify-invite-production-ref.sh \
            --expected-sha '${{ inputs.git_sha }}' \
            --ref-sha '${{ github.sha }}' \
            --ref-name '${{ github.ref }}'

      - name: Attest blank dark gateway dispatch input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' }}
        env:
          # Pass operator input through the environment, never interpolate it in shell source.
          PARKIO_DISPATCH_ACTION: ${{ inputs.action }}
          PARKIO_DARK_GATEWAY_INPUT: ${{ inputs.dark_gateway_url }}
        run: ./scripts/attest-invite-production-dark-gateway-input.sh

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Invite-production configuration and secret-safety tests
        env:
          # The dark-endpoint binding must be proven against the real merged
          # Compose model, not just the overlay source (PROD-DEPLOY-01A / D1).
          PARKIO_REQUIRE_COMPOSE_MODEL: "1"
        run: |
          set -euo pipefail
          python3 scripts/azure/test_render_invite_production_env.py
          bash scripts/test-preflight-invite-production.sh
          bash scripts/test-invite-production-runner-guards.sh
          python3 scripts/test_invite_production_node_runtime.py
          bash scripts/test-invite-production-clamav-runtime.sh
          python3 scripts/test_invite_production_feature_config.py
          bash scripts/test-invite-production-feature-config.sh
          bash scripts/test-invite-dark-gateway.sh
          bash scripts/test-invite-production-login-smoke.sh
          bash scripts/test-priv001-synthetic-principal.sh
          python3 scripts/test_invite_production_dispatch_input.py
          bash scripts/test-invite-dark-acme-isolation.sh
          bash scripts/test-invite-production-backup-scheduler.sh
          bash scripts/test-invite-production-runtime-release.sh
          bash scripts/test-invite-production-failure-evidence.sh
          bash scripts/test-invite-production-workspace-migration.sh
          bash scripts/test-managed-parking-flyway-baseline.sh
          bash scripts/test-invite-production-runtime-snapshot.sh
          python3 scripts/test_assert_invite_production_artifacts_safe.py
          python3 scripts/test_invite_production_deploy_safety.py
          node --test scripts/lib/assert-compose-resource-budget.test.mjs
          node --test scripts/test-invite-production-resource-budget-wiring.test.mjs
          node --test scripts/lib/sanitize-compose-config.test.mjs
          node --test frontend/apps/web/scripts/validate-build-env.test.mjs
          node --test frontend/apps/web/scripts/verify-bundle-env.test.mjs

      - name: Meta
        id: meta
        run: echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify invite-production resource budget
        env:
          PARKIO_DEPLOY_ARTIFACT_DIR: deploy-artifacts/invite-production
        run: |
          set -euo pipefail
          ./scripts/assert-invite-production-resource-budget.sh \
            --env-file docker/.env.invite-production.example \
            --evidence "$PARKIO_DEPLOY_ARTIFACT_DIR/resource-budget.json"

      - name: Dry-run invite-production deploy without secret-bearing evidence
        env:
          PARKIO_ENV_FILE: ${{ runner.temp }}/parkio-invite-ci-${{ github.run_id }}.env
          PARKIO_DEPLOY_ARTIFACT_DIR: deploy-artifacts/invite-production
          PARKIO_DEPLOY_OPERATOR: github-actions
          PARKIO_PREFLIGHT_ALLOW_NO_ALERT_WEBHOOK: "1"
          PARKIO_EXPECTED_GIT_SHA: ${{ steps.meta.outputs.git_sha }}
        run: |
          set -euo pipefail
          jwt_file="$RUNNER_TEMP/parkio-invite-ci-jwt-${GITHUB_RUN_ID}.pem"
          dry_run_log="$RUNNER_TEMP/parkio-invite-dry-run-${GITHUB_RUN_ID}.log"
          cleanup() { rm -f -- "$PARKIO_ENV_FILE" "$jwt_file" "$dry_run_log"; }
          trap cleanup EXIT HUP INT TERM

          cp docker/.env.invite-production.example "$PARKIO_ENV_FILE"
          chmod 600 "$PARKIO_ENV_FILE"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$jwt_file" 2>/dev/null
          python3 - "$PARKIO_ENV_FILE" "$jwt_file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          jwt = Path(sys.argv[2]).read_text().strip().replace("\n", "\\n")
          exact = {
              "PARKIO_PG_HOST": "pg-invite-ci.postgres.database.azure.com",
              "PARKIO_JWT_PRIVATE_KEY_PEM": f'"{jwt}"',
              "PARKIO_ACME_EMAIL": "ops@parkio.dev",
              "VITE_MAPTILER_KEY": "SECRET_SENTINEL_MAPTILER_PUBLIC_KEY",
              "PARKIO_RESEND_API_KEY": "re_SECRET_SENTINEL_RESEND_KEY",
              "PARKIO_PUSH_DELIVERY_ENABLED": "false",
              "PARKIO_PUSH_DELIVERY_PROVIDER": "noop",
              "PARKIO_EXPO_ACCESS_TOKEN": "",
              "PARKIO_ALERT_SLACK_WEBHOOK_URL": "https://hooks.slack.com/services/SECRET_SENTINEL_SLACK_URL/fixture/fixture",
              "PARKIO_ALERT_WEBHOOK_URL": "https://alerts.parkio.dev/test-receiver",
              "KAFKA_CLUSTER_ID": "Q0lJbnZpdGVQcm9kMDFBQQ",
          }
          lines = []
          for line in path.read_text().splitlines():
              if not line or line.lstrip().startswith("#") or "=" not in line:
                  lines.append(line)
                  continue
              key, value = line.split("=", 1)
              if key in exact:
                  lines.append(f"{key}={exact[key]}")
              elif "REPLACE_ME" in value:
                  lines.append(f'{key}="SECRET_SENTINEL_{key}_0123456789abcdef"')
              else:
                  lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          PY

          set +e
          ./scripts/deploy-invite-production.sh \
            --dry-run --allow-dirty --expected-sha "$PARKIO_EXPECTED_GIT_SHA" \
            > "$dry_run_log" 2>&1
          deploy_status=$?
          set +e
          ./scripts/finalize-invite-production-quarantined-evidence.sh \
            --deploy-status "$deploy_status" \
            --env-file "$PARKIO_ENV_FILE" \
            --artifact-dir "$PARKIO_DEPLOY_ARTIFACT_DIR" \
            --job-log "$dry_run_log" \
            --log-prefix '[invite-dry-run] '
          finalize_status=$?
          set -e
          exit "$finalize_status"

      - name: Upload secret-free manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: invite-production-manifest-${{ steps.meta.outputs.git_sha }}
          path: |
            deploy-artifacts/invite-production/deploy-*.json
            deploy-artifacts/invite-production/compose-structure.json
            deploy-artifacts/invite-production/resource-budget.json
          if-no-files-found: error
          retention-days: 90

  runner-acceptance:
    name: Non-deploy production runner acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'runner-acceptance' && github.ref == 'refs/heads/api' && inputs.git_sha == github.sha }}
    environment: invite-production
    runs-on: [self-hosted, linux, x64, parkio-invite-production]
    timeout-minutes: 20
    env:
      # actions/checkout resolves `path` against GITHUB_WORKSPACE, and
      # actions/setup-node resolves `node-version-file` with
      # path.join(GITHUB_WORKSPACE, input): an absolute input duplicates the
      # workspace prefix instead of overriding it. Every action input that
      # names the checkout must therefore use this workspace-relative path,
      # while PARKIO_SOURCE_DIR stays absolute for shell working-directory use.
      PARKIO_SOURCE_PATH: source-${{ github.run_id }}-${{ github.run_attempt }}
      PARKIO_SOURCE_DIR: ${{ github.workspace }}/source-${{ github.run_id }}-${{ github.run_attempt }}
      PARKIO_ENV_FILE: /dev/shm/parkio-invite-production-${{ github.run_id }}-${{ github.run_attempt }}.env
      AZURE_CONFIG_DIR: /dev/shm/parkio-azure-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact api SHA into a unique workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
          path: ${{ env.PARKIO_SOURCE_PATH }}

      - name: Verify trusted ref and clean checkout
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: |
          set -euo pipefail
          ./scripts/verify-invite-production-ref.sh \
            --expected-sha '${{ inputs.git_sha }}' \
            --ref-sha '${{ github.sha }}' \
            --ref-name '${{ github.ref }}'

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.PARKIO_SOURCE_PATH }}/.node-version

      - name: Verify production runner toolchain
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: ./scripts/verify-invite-production-toolchain.sh

      - name: Capture runtime snapshot before acceptance
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: ./scripts/snapshot-invite-production-runtime.sh capture "$RUNNER_TEMP/runtime-before.txt"

      - name: Verify dedicated host and Docker
        run: |
          set -euo pipefail
          test "$(id -un)" = parkio-runner
          test "$(hostname)" = vm-parkio-invite-prod
          docker version --format 'Docker server {{.Server.Version}}'
          docker compose version
          test ! -e "$PARKIO_ENV_FILE"

      - name: Runtime release is consumable by non-root containers
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: bash scripts/test-invite-production-release-containers.sh

      - name: Verify managed identity and production resource identities
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: |
          set -euo pipefail
          install -d -m 700 "$AZURE_CONFIG_DIR"
          az login --identity --allow-no-subscriptions --output none

          vm_name="$(az deployment group show \
            --resource-group rg-parkio-invite-production-we \
            --name prod-deploy-01a-foundation \
            --query properties.outputs.vmName.value -o tsv --only-show-errors)"
          vault_name="$(az deployment group show \
            --resource-group rg-parkio-invite-production-we \
            --name prod-deploy-01a-foundation \
            --query properties.outputs.keyVaultName.value -o tsv --only-show-errors)"
          pg_host="$(az deployment group show \
            --resource-group rg-parkio-invite-production-we \
            --name prod-deploy-01a-foundation \
            --query properties.outputs.postgresqlFqdn.value -o tsv --only-show-errors)"

          test "$vm_name" = vm-parkio-invite-prod
          test "$vault_name" = kvparkioinvjcvgwc
          test "$pg_host" = pg-parkio-invite-jcvgwc.postgres.database.azure.com
          echo "Foundation identities: PASS"

          names="$(az keyvault secret list --vault-name "$vault_name" \
            --query '[].name' -o tsv --only-show-errors)"
          for name in acme-contact-email maptiler-public-key resend-api-key slack-webhook-url; do
            printf '%s\n' "$names" | grep -Fxq "$name"
            echo "$name PRESENT"
          done
          if printf '%s\n' "$names" | grep -Fxq expo-access-token; then
            echo "ERROR: expo-access-token must not be provisioned for invite-production" >&2
            exit 3
          fi
          echo "expo-access-token ABSENT_NOT_REQUIRED"

          resolved="$(getent ahostsv4 "$pg_host" | awk 'NR == 1 {print $1}')"
          case "$resolved" in
            10.*|172.16.*|172.17.*|172.18.*|172.19.*|172.2?.*|172.30.*|172.31.*|192.168.*) ;;
            *) echo "ERROR: PostgreSQL did not resolve to a private IPv4 address" >&2; exit 3 ;;
          esac
          echo "PostgreSQL private DNS: PASS"

          tls_log="/dev/shm/parkio-pg-tls-${{ github.run_id }}-${{ github.run_attempt }}.log"
          trap 'rm -f -- "$tls_log"' EXIT
          timeout 15 openssl s_client -starttls postgres \
            -connect "$pg_host:5432" -servername "$pg_host" \
            -CApath /etc/ssl/certs \
            -verify_return_error < /dev/null > "$tls_log" 2>&1
          grep -q 'Verify return code: 0 (ok)' "$tls_log"
          echo "PostgreSQL TCP/TLS verify-full prerequisite: PASS"

      - name: Prove no runtime or migration action occurred
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: |
          set -euo pipefail
          # The invariant is "acceptance changed nothing", NOT "nothing exists".
          # `test -z "$(docker ps -q)"` encoded the latter and became impossible
          # once the preserved dark runtime existed (run 32476161001), since the
          # only way to satisfy it was to destroy what it protects.
          ./scripts/snapshot-invite-production-runtime.sh capture "$RUNNER_TEMP/runtime-after.txt"
          ./scripts/snapshot-invite-production-runtime.sh compare \
            "$RUNNER_TEMP/runtime-before.txt" "$RUNNER_TEMP/runtime-after.txt"
          # Retained independently of the snapshot comparison: a rendered env
          # file is per-job secret material, not runtime topology.
          test ! -e "$PARKIO_ENV_FILE"
          echo "No runtime mutation, no rendered env, no Flyway action: PASS"

      - name: Cleanup per-job source and credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cleanup="$PARKIO_SOURCE_DIR/scripts/cleanup-invite-production-job.sh"
          if [ -x "$cleanup" ]; then
            "$cleanup"
          else
            case "$PARKIO_SOURCE_DIR" in "$GITHUB_WORKSPACE"/source-[0-9]*-[0-9]*) ;; *) exit 2 ;; esac
            case "$PARKIO_ENV_FILE" in /dev/shm/parkio-invite-production-[0-9]*-[0-9]*.env) ;; *) exit 2 ;; esac
            case "$AZURE_CONFIG_DIR" in /dev/shm/parkio-azure-[0-9]*-[0-9]*) ;; *) exit 2 ;; esac
            rm -f -- "$PARKIO_ENV_FILE"
            rm -rf -- "$AZURE_CONFIG_DIR" "$PARKIO_SOURCE_DIR"
          fi

      - name: Prove cleanup itself mutated no runtime
        run: |
          set -euo pipefail
          # Cleanup runs after the comparison and removes the checkout, so the
          # snapshot script is no longer on disk; inline the same sanitized
          # structural fields and re-compare against the BEFORE snapshot.
          for cid in $(docker ps -aq); do
            docker inspect -f '{{slice .Name 1}}|{{slice .Id 0 12}}|{{.Config.Image}}|{{.State.Status}}|{{.State.StartedAt}}|{{.RestartCount}}' "$cid"
          done | grep '^parkio-' | sed 's/^/PROTECTED-/' | LC_ALL=C sort \
            > "$RUNNER_TEMP/runtime-final.txt"
          diff <(grep '^PROTECTED-' "$RUNNER_TEMP/runtime-before.txt") \
               "$RUNNER_TEMP/runtime-final.txt"
          test ! -e "$PARKIO_ENV_FILE"
          test ! -e "$AZURE_CONFIG_DIR"
          test ! -e "$PARKIO_SOURCE_DIR"
          echo "Post-cleanup runtime and residue verification: PASS"

  workspace-migration:
    name: Migrate legacy workspace bind mounts
    # One-time remediation for the containers the failed R7 deploy left bound to
    # the deleted per-job checkout (PROD-DEPLOY-01A-R8.1). Scoped to node-exporter
    # and blackbox-exporter; it recreates only those two services from the stable
    # release and refuses to act if anything else is affected.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'workspace-migration' && github.ref == 'refs/heads/api' && inputs.git_sha == github.sha }}
    environment: invite-production
    runs-on: [self-hosted, linux, x64, parkio-invite-production]
    timeout-minutes: 30
    env:
      PARKIO_SOURCE_PATH: source-${{ github.run_id }}-${{ github.run_attempt }}
      PARKIO_SOURCE_DIR: ${{ github.workspace }}/source-${{ github.run_id }}-${{ github.run_attempt }}
      PARKIO_ENV_FILE: /dev/shm/parkio-invite-production-${{ github.run_id }}-${{ github.run_attempt }}.env
      AZURE_CONFIG_DIR: /dev/shm/parkio-azure-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact api SHA into a unique workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
          path: ${{ env.PARKIO_SOURCE_PATH }}

      - name: Verify trusted ref and clean checkout
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: |
          set -euo pipefail
          ./scripts/verify-invite-production-ref.sh \
            --expected-sha '${{ inputs.git_sha }}' \
            --ref-sha '${{ github.sha }}' \
            --ref-name '${{ github.ref }}'

      - name: Stage the stable runtime release
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: ./scripts/stage-invite-production-release.sh --sha '${{ inputs.git_sha }}'

      - name: Materialize secrets into tmpfs through VM managed identity
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: |
          set -euo pipefail
          install -d -m 700 "$AZURE_CONFIG_DIR"
          ./scripts/azure/render-invite-production-env.sh --output "$PARKIO_ENV_FILE"
          test "$(stat -c '%a' "$PARKIO_ENV_FILE")" = 600

      - name: Rebind legacy workspace mounts onto the stable release
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: ./scripts/migrate-invite-production-workspace-mounts.sh --sha '${{ inputs.git_sha }}'

      - name: Cleanup per-job source and credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cleanup="$PARKIO_SOURCE_DIR/scripts/cleanup-invite-production-job.sh"
          if [ -x "$cleanup" ]; then
            "$cleanup"
          else
            case "$PARKIO_SOURCE_DIR" in "$GITHUB_WORKSPACE"/source-[0-9]*-[0-9]*) ;; *) exit 2 ;; esac
            rm -f -- "$PARKIO_ENV_FILE"
            rm -rf -- "$AZURE_CONFIG_DIR" "$PARKIO_SOURCE_DIR"
          fi

  deploy:
    name: Deploy invite-production
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && github.ref == 'refs/heads/api' && inputs.git_sha == github.sha }}
    needs: build-images
    environment: invite-production
    runs-on: [self-hosted, linux, x64, parkio-invite-production]
    timeout-minutes: 120
    env:
      # actions/checkout resolves `path` against GITHUB_WORKSPACE, and
      # actions/setup-node resolves `node-version-file` with
      # path.join(GITHUB_WORKSPACE, input): an absolute input duplicates the
      # workspace prefix instead of overriding it. Every action input that
      # names the checkout must therefore use this workspace-relative path,
      # while PARKIO_SOURCE_DIR stays absolute for shell working-directory use.
      PARKIO_SOURCE_PATH: source-${{ github.run_id }}-${{ github.run_attempt }}
      PARKIO_SOURCE_DIR: ${{ github.workspace }}/source-${{ github.run_id }}-${{ github.run_attempt }}
      PARKIO_ENV_FILE: /dev/shm/parkio-invite-production-${{ github.run_id }}-${{ github.run_attempt }}.env
      AZURE_CONFIG_DIR: /dev/shm/parkio-azure-${{ github.run_id }}-${{ github.run_attempt }}
      PARKIO_JOB_LOG: /dev/shm/parkio-deploy-${{ github.run_id }}-${{ github.run_attempt }}.log
    steps:
      - name: Checkout exact api SHA into a unique workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
          path: ${{ env.PARKIO_SOURCE_PATH }}

      - name: Verify trusted ref and clean checkout
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        env:
          # Never interpolate operator input straight into a shell body.
          PARKIO_DISPATCH_ACTION: ${{ inputs.action }}
          PARKIO_DARK_GATEWAY_INPUT: ${{ inputs.dark_gateway_url }}
        run: |
          set -euo pipefail
          ./scripts/verify-invite-production-ref.sh \
            --expected-sha '${{ inputs.git_sha }}' \
            --ref-sha '${{ github.sha }}' \
            --ref-name '${{ github.ref }}'
          ./scripts/attest-invite-production-dark-gateway-input.sh

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.PARKIO_SOURCE_PATH }}/.node-version

      - name: Verify production runner toolchain
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: ./scripts/verify-invite-production-toolchain.sh

      - name: Materialize secrets into tmpfs through VM managed identity
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: |
          set -euo pipefail
          install -d -m 700 "$AZURE_CONFIG_DIR"
          ./scripts/azure/render-invite-production-env.sh --output "$PARKIO_ENV_FILE"
          test "$(stat -c '%a' "$PARKIO_ENV_FILE")" = 600

      - name: Deploy exact commit with quarantined log
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        env:
          PARKIO_DEPLOY_OPERATOR: github-actions
          PARKIO_SMOKE_EXPECT_DIRECT_BLOCKED: "1"
        run: |
          set -euo pipefail
          set +e
          ./scripts/deploy-invite-production.sh --expected-sha '${{ inputs.git_sha }}' \
            > "$PARKIO_JOB_LOG" 2>&1
          status=$?
          set +e
          ./scripts/finalize-invite-production-quarantined-evidence.sh \
            --deploy-status "$status" \
            --env-file "$PARKIO_ENV_FILE" \
            --artifact-dir deploy-artifacts/invite-production \
            --job-log "$PARKIO_JOB_LOG" \
            --log-prefix '[invite-deploy] '
          finalize_status=$?
          set -e
          exit "$finalize_status"

      - name: Cleanup per-job source and credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # Quarantined log is deleted only after finalize has scanned and
          # (when safe) released it in the deploy step above.
          cleanup="$PARKIO_SOURCE_DIR/scripts/cleanup-invite-production-job.sh"
          rm -f -- "$PARKIO_JOB_LOG"
          if [ -x "$cleanup" ]; then
            "$cleanup"
          else
            case "$PARKIO_SOURCE_DIR" in "$GITHUB_WORKSPACE"/source-[0-9]*-[0-9]*) ;; *) exit 2 ;; esac
            case "$PARKIO_ENV_FILE" in /dev/shm/parkio-invite-production-[0-9]*-[0-9]*.env) ;; *) exit 2 ;; esac
            case "$AZURE_CONFIG_DIR" in /dev/shm/parkio-azure-[0-9]*-[0-9]*) ;; *) exit 2 ;; esac
            rm -f -- "$PARKIO_ENV_FILE"
            rm -rf -- "$AZURE_CONFIG_DIR" "$PARKIO_SOURCE_DIR"
          fi

  rollback:
    name: Rollback invite-production
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' && github.ref == 'refs/heads/api' && inputs.git_sha == github.sha }}
    environment: invite-production
    runs-on: [self-hosted, linux, x64, parkio-invite-production]
    timeout-minutes: 60
    env:
      # actions/checkout resolves `path` against GITHUB_WORKSPACE, and
      # actions/setup-node resolves `node-version-file` with
      # path.join(GITHUB_WORKSPACE, input): an absolute input duplicates the
      # workspace prefix instead of overriding it. Every action input that
      # names the checkout must therefore use this workspace-relative path,
      # while PARKIO_SOURCE_DIR stays absolute for shell working-directory use.
      PARKIO_SOURCE_PATH: source-${{ github.run_id }}-${{ github.run_attempt }}
      PARKIO_SOURCE_DIR: ${{ github.workspace }}/source-${{ github.run_id }}-${{ github.run_attempt }}
      PARKIO_ENV_FILE: /dev/shm/parkio-invite-production-${{ github.run_id }}-${{ github.run_attempt }}.env
      AZURE_CONFIG_DIR: /dev/shm/parkio-azure-${{ github.run_id }}-${{ github.run_attempt }}
      PARKIO_JOB_LOG: /dev/shm/parkio-rollback-${{ github.run_id }}-${{ github.run_attempt }}.log
    steps:
      - name: Checkout exact api SHA into a unique workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
          path: ${{ env.PARKIO_SOURCE_PATH }}

      - name: Verify trusted ref and clean checkout
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        env:
          PARKIO_DARK_GATEWAY_INPUT: ${{ inputs.dark_gateway_url }}
        run: |
          set -euo pipefail
          ./scripts/verify-invite-production-ref.sh \
            --expected-sha '${{ inputs.git_sha }}' \
            --ref-sha '${{ github.sha }}' \
            --ref-name '${{ github.ref }}'
          test -n '${{ inputs.manifest_artifact }}'
          source ./scripts/lib/dark-gateway-url.sh
          resolved="${PARKIO_DARK_GATEWAY_INPUT:-$PARKIO_DARK_GATEWAY_ALLOWED_URL}"
          parkio_validate_dark_gateway_url "$resolved"
          echo "PARKIO_GATEWAY_URL=$resolved" >> "$GITHUB_ENV"

      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.PARKIO_SOURCE_PATH }}/.node-version

      - name: Verify production runner toolchain
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: ./scripts/verify-invite-production-toolchain.sh

      - name: Materialize secrets into tmpfs through VM managed identity
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        run: |
          set -euo pipefail
          install -d -m 700 "$AZURE_CONFIG_DIR"
          ./scripts/azure/render-invite-production-env.sh --output "$PARKIO_ENV_FILE"
          test "$(stat -c '%a' "$PARKIO_ENV_FILE")" = 600

      - name: Download secret-free rollback manifest
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.manifest_artifact }}
          path: ${{ env.PARKIO_SOURCE_PATH }}/deploy-artifacts/invite-production

      - name: Rollback exact environment with quarantined log
        working-directory: ${{ env.PARKIO_SOURCE_DIR }}
        env:
          PARKIO_DEPLOY_OPERATOR: github-actions
          PARKIO_SMOKE_EXPECT_DIRECT_BLOCKED: "1"
        run: |
          set -euo pipefail
          manifest="$(find deploy-artifacts/invite-production -maxdepth 1 -type f -name 'deploy-*.json' -print -quit)"
          test -n "$manifest"
          set +e
          ./scripts/rollback-invite-production.sh --manifest "$manifest" > "$PARKIO_JOB_LOG" 2>&1
          status=$?
          set +e
          ./scripts/finalize-invite-production-quarantined-evidence.sh \
            --deploy-status "$status" \
            --env-file "$PARKIO_ENV_FILE" \
            --artifact-dir deploy-artifacts/invite-production \
            --job-log "$PARKIO_JOB_LOG" \
            --log-prefix '[invite-rollback] '
          finalize_status=$?
          set -e
          exit "$finalize_status"

      - name: Cleanup per-job source and credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cleanup="$PARKIO_SOURCE_DIR/scripts/cleanup-invite-production-job.sh"
          rm -f -- "$PARKIO_JOB_LOG"
          if [ -x "$cleanup" ]; then
            "$cleanup"
          else
            case "$PARKIO_SOURCE_DIR" in "$GITHUB_WORKSPACE"/source-[0-9]*-[0-9]*) ;; *) exit 2 ;; esac
            case "$PARKIO_ENV_FILE" in /dev/shm/parkio-invite-production-[0-9]*-[0-9]*.env) ;; *) exit 2 ;; esac
            case "$AZURE_CONFIG_DIR" in /dev/shm/parkio-azure-[0-9]*-[0-9]*) ;; *) exit 2 ;; esac
            rm -f -- "$PARKIO_ENV_FILE"
            rm -rf -- "$AZURE_CONFIG_DIR" "$PARKIO_SOURCE_DIR"
          fi
