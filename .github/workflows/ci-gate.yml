# CI gate (U09, CX-F09): one check that is green only when every workflow the pull request's
# changes trigger has run, passed and shown its tests ran. The required checks come from the
# workflows' own pull_request filters (scripts/ci/ci_gate.py); .github/ci-gate-policy.json lists
# the jobs that skip by design and the test-evidence lines.
#
# Branch protection does not require this check yet; making it required is an owner decision.
name: CI gate

on:
  pull_request:
    branches: [api, master]

permissions:
  contents: read
  actions: read

# A new push to the pull request replaces the gate of the previous commit.
concurrency:
  group: ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Gate unit tests
        run: python3 -m unittest scripts/ci/test_ci_gate.py scripts/ci/test_junit_summary.py

      - name: Wait for and judge the required checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: >-
          python3 scripts/ci/ci_gate.py --repository "$REPOSITORY" --head-sha "$HEAD_SHA"
          --base-ref "$BASE_REF" --timeout-minutes 80
