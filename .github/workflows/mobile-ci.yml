# Mobile quality gate for Expo / React Native apps under `frontend/`.
# Canonical production Mobile is `frontend/apps/mobile-v2` (Task 8 / WP-07).
# Legacy `frontend/apps/mobile` remains covered until retirement.
#
# Scope: typecheck + lint + unit tests + focused Mobile-v2 suite + expo-doctor.
# Release APK/AAB builds remain on EAS (see mobile-v2 / legacy eas.json).
#
# Path-filtered to mobile apps + shared packages so unrelated PRs stay fast.
# Retries remain disabled (jest / expo-doctor defaults; no retry: flags).

name: Mobile CI

on:
  pull_request:
    paths:
      - "frontend/apps/mobile/**"
      - "frontend/apps/mobile-v2/**"
      - "frontend/packages/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [api, master]
    paths:
      - "frontend/apps/mobile/**"
      - "frontend/apps/mobile-v2/**"
      - "frontend/packages/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  mobile-v2-checks:
    name: Mobile-v2 typecheck, lint, test & expo doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @parkio/mobile-v2 typecheck

      - name: Lint
        run: pnpm --filter @parkio/mobile-v2 lint

      - name: Focused Mobile-v2 verification
        run: |
          pnpm --filter @parkio/mobile-v2 test:wp07
          pnpm --filter @parkio/mobile-v2 test:task08

      - name: Unit tests
        run: pnpm --filter @parkio/mobile-v2 test

      - name: Native ownership
        run: pnpm --filter @parkio/mobile-v2 run validate:native-ownership

      - name: Expo doctor
        # Blocking. Use `run doctor` so pnpm invokes the package script
        # (run-expo-doctor.mjs), not pnpm's built-in doctor. The CNG sync
        # check cannot represent committed android/ plus a retained prebuild
        # recipe; that single finding is replaced by Native ownership.
        # Every other expo-doctor failure still fails the job.
        # See frontend/apps/mobile-v2/NATIVE-BUILD.md.
        run: pnpm --filter @parkio/mobile-v2 run doctor

  # Legacy `apps/mobile` is deprecated and is NOT a release artifact (see
  # docs/operations/mobile-release-policy.md and frontend/README.md "Mobile
  # foundation (WP-07)"). It keeps running for retirement visibility, but it is
  # advisory: a deprecated app must not block releases of the canonical apps.
  # Canonical Mobile (`mobile-v2`) above stays blocking.
  mobile-legacy-checks:
    name: Legacy mobile typecheck, lint, test & expo doctor (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @parkio/mobile typecheck

      - name: Lint
        run: pnpm --filter @parkio/mobile lint

      - name: Unit tests
        run: pnpm --filter @parkio/mobile exec jest --ci

      - name: Expo doctor
        run: pnpm --filter @parkio/mobile exec expo-doctor
