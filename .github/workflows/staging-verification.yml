name: Staging verification (WP-06.2 / WP-06.2A.1)

on:
  pull_request:
    paths:
      - "scripts/staging/**"
      - "scripts/smoke-hosted-beta.sh"
      - "scripts/restore-drill.sh"
      - "docker/docker-compose.staging-verification.yml"
      - "docker/docker-compose.restore-drill.yml"
      - "docs/operations/evidence/**"
      - "docs/operations/wp-06-02*.md"
      - "services/gateway-service/src/main/resources/application.yml"
      - ".github/workflows/staging-verification.yml"
      - ".github/workflows/scheduled-restore-drills.yml"
      - "scripts/test_scheduled_staging_dispatch.py"
      - "scripts/test_staging_restore_acceptance.py"
  workflow_dispatch:
    inputs:
      run_restore:
        description: Run restore drill with evidence
        type: boolean
        default: false
      run_journeys:
        description: Run critical application journeys (requires full stack capability)
        type: boolean
        default: false
      run_restored_apis:
        description: Repoint apps to restored drill DBs and verify APIs
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: staging-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: Safety guards and schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'api' || github.sha }}

      - name: Check scheduled staging dispatch and restore acceptance contracts
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 -m unittest scripts.test_scheduled_staging_dispatch scripts.test_staging_restore_acceptance

      - name: Fail closed on fork PRs needing private MinIO
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork PRs cannot read private ghcr.io/adberilgen35/parkio/{minio,mc} with GITHUB_TOKEN."
          echo "This is fail-closed, not a skip. Open the change from ADBERILGEN35/parkio."
          exit 1

      - name: Log in to GHCR for private MinIO pulls
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make staging scripts executable
        run: chmod +x gradlew scripts/staging/*.sh scripts/staging/lib/*.sh scripts/*.sh

      - name: Bash syntax check
        run: |
          set -euo pipefail
          for f in scripts/staging/*.sh scripts/staging/lib/*.sh scripts/smoke-hosted-beta.sh; do
            bash -n "$f"
          done

      - name: Require python3 for JSON helper
        run: |
          python3 --version
          bash -c 'source scripts/staging/lib/json-helper.sh && json_require_python'

      - name: Compose overlay config validation
        run: |
          cp docker/.env.example docker/.env
          docker compose --env-file docker/.env \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.staging-verification.yml config >/dev/null

      - name: Run WP-06.2 governance tests
        run: |
          ./gradlew :services:parking-service:test --tests "com.parkio.parking.infrastructure.metrics.StagingVerificationGovernanceTest" \
            :services:gateway-service:test --tests "com.parkio.gateway.infrastructure.config.GatewayDownstreamTimeoutGovernanceTest" --no-daemon

      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-verification-logs
          path: build/operational-evidence/
          if-no-files-found: ignore

  restore-evidence:
    name: Restore drill + evidence bundle
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_restore)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PARKIO_ENVIRONMENT_TYPE: CI_EPHEMERAL
      PARKIO_STAGING_ISOLATION_MARKER: wp062-ci-${{ github.run_id }}
      COMPOSE_PROJECT_NAME: parkio-wp062-${{ github.run_id }}
      PARKIO_STAGING_RUN_RESTORE: "yes"
      PARKIO_STAGING_RUN_MINIO: "yes"
      PARKIO_STAGING_ALLOW_DESTRUCTIVE: "yes"
      # Full-stack journeys require app images + resources — enable via dispatch or self-hosted label.
      PARKIO_STAGING_RUN_JOURNEYS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_journeys && 'yes' || 'no' }}
      PARKIO_STAGING_RUN_RESTORED_APIS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_restored_apis && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'api' || github.sha }}

      - name: Fail closed on fork PRs needing private MinIO
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork PRs cannot read private ghcr.io/adberilgen35/parkio/{minio,mc} with GITHUB_TOKEN."
          echo "This is fail-closed, not a skip. Open the change from ADBERILGEN35/parkio."
          exit 1

      - name: Log in to GHCR for private MinIO pulls
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare env
        run: cp docker/.env.example docker/.env

      - name: Start database stack
        run: |
          docker compose --env-file docker/.env -f docker/docker-compose.yml up -d --wait \
            postgres-auth postgres-user postgres-parking postgres-media \
            postgres-gamification postgres-notification postgres-moderation \
            postgres-analytics postgres-ai-validation postgres-gateway redis kafka minio || \
          docker compose --env-file docker/.env -f docker/docker-compose.yml up -d --wait \
            postgres-auth postgres-user postgres-parking postgres-media \
            postgres-gamification postgres-notification postgres-moderation \
            postgres-analytics postgres-ai-validation

      - name: Note journey capability
        if: env.PARKIO_STAGING_RUN_JOURNEYS == 'yes'
        run: |
          echo "INFRA_INPUT_REQUIRED: full application stack journeys need docker-compose.apps.yml images."
          echo "Starting apps when images are available locally; otherwise journeys remain blocked."
          docker compose --env-file docker/.env \
            -f docker/docker-compose.yml -f docker/docker-compose.apps.yml \
            up -d --build || echo "APP_STACK_UNAVAILABLE"

      - name: Run verification pipeline (restore + semantic [+ journeys])
        run: |
          chmod +x scripts/staging/*.sh scripts/staging/lib/*.sh scripts/*.sh
          ./scripts/staging/run-verification-pipeline.sh

      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp062-operational-evidence-${{ github.run_id }}
          path: build/operational-evidence/
          if-no-files-found: ignore

      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p build/operational-evidence/diagnostics
          docker compose --env-file docker/.env -f docker/docker-compose.yml ps > build/operational-evidence/diagnostics/compose-ps.txt || true
          docker ps -a > build/operational-evidence/diagnostics/docker-ps.txt || true

      - name: Tear down databases
        if: always()
        run: |
          docker compose --env-file docker/.env \
            -f docker/docker-compose.yml -f docker/docker-compose.apps.yml down -v || \
          docker compose --env-file docker/.env -f docker/docker-compose.yml down -v

  # U08: this check runs only when a restore was requested. Unrequested structural-only
  # runs skip the job, so the check is not a green "restore succeeded" result. When a
  # restore was requested, always() still starts the job if restore-evidence failed,
  # was skipped, or was cancelled; the step then fails unless that result is success.
  # The request expression does not read needs.*, so restore-evidence's own if cannot
  # turn a requested restore into an unrequested run. Job success means the dependency
  # result was success. It does not download or validate the evidence artifact.
  restore-acceptance:
    name: Requested restore executed and succeeded
    needs: restore-evidence
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_restore)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require an executed, successful restore when one was requested
        env:
          RESTORE_REQUESTED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_restore) }}
          RESTORE_RESULT: ${{ needs.restore-evidence.result }}
        run: |
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "restore requested: ${RESTORE_REQUESTED}; restore-evidence result: ${RESTORE_RESULT:-<none>}"
          case "${RESTORE_REQUESTED}" in
            false)
              echo "Restore not requested: structural-only run. It is not restore evidence." | tee -a "${summary}"
              exit 0
              ;;
            true) ;;
            *)
              echo "::error::Cannot tell whether a restore was requested ('${RESTORE_REQUESTED}')."
              exit 1
              ;;
          esac
          if [ "${RESTORE_RESULT:-}" != success ]; then
            echo "::error::Restore was requested but restore-evidence finished as '${RESTORE_RESULT:-<none>}'. A skipped, cancelled or failed restore is not restore evidence."
            exit 1
          fi
          echo "Restore requested; restore-evidence executed and succeeded." | tee -a "${summary}"
