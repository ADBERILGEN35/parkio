# Gradle dependency retry (#608).
#
# gradle.properties raises Gradle's retry budget for downloads that get HTTP 429, a 5xx answer or a
# dropped connection. scripts/ci/test_gradle_dependency_retry.py checks, on the wrapper's Gradle
# version, that the budget takes effect and stays bounded, and that a missing artifact (404) still
# fails at once. It runs Gradle against a local fault-injecting repository, so it needs no external
# dependency host. It runs when the setting, the wrapper or the test changes.

name: Gradle dependency retry

on:
  pull_request:
    branches: [api]
    paths:
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "gradlew"
      - "scripts/ci/test_gradle_dependency_retry.py"
      - ".github/workflows/gradle-dependency-retry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-dependency-retry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retry:
    name: Gradle retry budget against a fault-injecting repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Retry budget tests
        run: python3 scripts/ci/test_gradle_dependency_retry.py
