# Frontend quality gate. Mirrors backend-ci.yml's discipline (least-privilege
# permissions, job timeout, fast feedback) for the pnpm workspace under
# `frontend/`. Until this existed the SPA's typecheck, lint, unit tests and
# production build were never gated in CI â€” regressions and broken builds could
# merge undetected (production-readiness audit, item "Frontend CI").
#
# Scope: architecture checks, WP-04/WP-05/WP-06/WP-07 focused gates,
# the frontend-controlled WP-03 Chromium acceptance suite, typecheck, lint,
# unit tests (Vitest), and the production build. The focused browser gate uses
# Playwright network mocks and does not start backend services; real-stack E2E
# remains a separate manual workflow.
#
# Path-filtered to frontend changes so backend-/docs-only PRs stay fast, the
# mirror image of how backend-integration.yml filters to backend paths.

name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "web/marketing/**"
      - "scripts/serve-marketing-site.mjs"
      - "scripts/validate-marketing-site.mjs"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [api, master]
    paths:
      - "frontend/**"
      - "web/marketing/**"
      - "scripts/serve-marketing-site.mjs"
      - "scripts/validate-marketing-site.mjs"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the previous (still-running) run.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend-build:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned in frontend/package.json ("packageManager").
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install focused browser
        run: pnpm --filter @parkio/web exec playwright install --with-deps chromium

      # The waitlist client's node tests (adapter, error mapping, i18n feedback) under web/marketing.
      - name: Marketing waitlist unit tests
        run: node --test ../web/marketing/*.test.mjs

      - name: Marketing static and responsive validation
        run: pnpm --filter @parkio/web test:marketing

      - name: Architecture guardrails
        run: pnpm guardrails

      - name: Architecture guardrail tests
        run: pnpm guardrails:test

      - name: Architecture guardrail lint
        run: pnpm guardrails:lint

      - name: OpenAPI comparison tests
        run: pnpm contracts:openapi:test

      - name: OpenAPI comparison lint
        run: pnpm contracts:openapi:lint

      - name: Backend scope guard
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Frontend-only sprint guard. Dual-domain PRs (services/ + frontend/) intentionally
          # change backend; skipping prevents false failures on api-branch provider work.
          #
          # Compare against the base this checkout actually contains. The event's
          # pull_request.base.sha can be older than that: the base branch moves without updating it,
          # and diffing from it would count other merged PRs' changes as this PR's. That either
          # failed the guard on their files or skipped it on their services/ changes.
          base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
          echo "Comparing ${base}...HEAD (event base.sha ${PR_BASE_SHA})."
          # Captured first: with pipefail, grep -q closing the pipe early could fail the test.
          changed="$(git diff --name-only "${base}...HEAD")"
          if grep -qE '^services/' <<< "${changed}"; then
            echo "Backend service paths present in PR; skipping frontend-only backend-scope guard."
            exit 0
          fi
          pnpm guardrails:backend -- --base "${base}"

      - name: WP-04 frontend data architecture
        run: |
          pnpm guardrails:wp04
          pnpm --filter @parkio/web test:wp04

      - name: WP-05 core parking flows
        run: |
          pnpm guardrails:wp05
          pnpm --filter @parkio/web test:wp05

      - name: WP-06 production hardening
        run: |
          pnpm guardrails:wp06
          pnpm --filter @parkio/web test:wp06

      - name: WP-07 mobile foundation
        run: |
          pnpm guardrails:wp07
          pnpm --filter @parkio/mobile-v2 test:wp07

      # CL-F30: axe-core WCAG 2.x A/AA measurement, a keyboard walk, page language and footer checks
      # for the web app and the marketing site in Turkish and English. Every network call is mocked;
      # the report guards reject skipped or zero-test runs.
      - name: Accessibility browser measurement
        run: pnpm --filter @parkio/web e2e:a11y

      - name: WP-03 routing browser acceptance
        run: pnpm --filter @parkio/web exec playwright test e2e/wp03-routing.spec.ts --project=wp03-chromium --workers=1 --retries=0

      # CX-F04 identity handoff. The report guard fails on skipped, flaky or
      # zero-discovered tests, so a skipped-green run cannot count as acceptance.
      # Synthetic accounts; every network call is mocked with page.route.
      - name: Pending-profile ownership browser acceptance
        run: |
          node --test apps/web/scripts/assert-playwright-report.test.mjs
          pnpm --filter @parkio/web e2e:ownership

      # CX-F11: TR/EN auth flow, retry after a dropped connection, duplicate submit, offline, admin
      # RBAC and Explore, on a Vite dev server with the release bake's feature flags and app
      # environment. The CL-F20 Explore failure scenarios are declared known defects; the guard
      # fails if that count changes.
      - name: Web candidate acceptance scenarios
        run: pnpm --filter @parkio/web e2e:cxf11

      # CL-F39.3: the real service worker across two releases in Chromium (local server,
      # synthetic releases); the report guard rejects skipped or zero-test runs.
      - name: Service-worker upgrade browser acceptance
        run: pnpm --filter @parkio/web e2e:sw-upgrade

      # CL-F21: an auth link's lang decides the page language over a stored preference
      # (reset-password and login; register and verify as unchanged controls). Every
      # network call is mocked; the report guard rejects skipped or zero-test runs.
      - name: Auth link language browser acceptance
        run: pnpm --filter @parkio/web e2e:link-locale

      # `pnpm -r` runs each script only in the workspace packages that define it,
      # so packages without a given script are skipped rather than failing.
      #
      # The Expo/React Native apps are excluded here and owned by Mobile CI:
      #   * `mobile-v2` is gated there (typecheck, lint, focused suites, full jest);
      #     running its jest suites a second time alongside the web suites only added
      #     runner contention, which surfaced as RNTL `waitFor` timeouts.
      #   * legacy `mobile` is deprecated and advisory (docs/operations/mobile-release-policy.md);
      #     a blocking copy here would contradict that policy.
      # Nothing loses coverage — every excluded script still runs in Mobile CI.
      - name: Typecheck
        run: pnpm -r --filter='!@parkio/mobile' --filter='!@parkio/mobile-v2' typecheck

      - name: Lint
        run: pnpm -r --filter='!@parkio/mobile' --filter='!@parkio/mobile-v2' lint

      - name: Unit tests
        run: pnpm -r --filter='!@parkio/mobile' --filter='!@parkio/mobile-v2' test

      - name: Production build
        run: pnpm -r --filter='!@parkio/mobile' --filter='!@parkio/mobile-v2' build
