# Frontend quality gate. Mirrors backend-ci.yml's discipline (least-privilege
# permissions, job timeout, fast feedback) for the pnpm workspace under
# `frontend/`. Until this existed the SPA's typecheck, lint, unit tests and
# production build were never gated in CI â€” regressions and broken builds could
# merge undetected (production-readiness audit, item "Frontend CI").
#
# Scope: architecture checks, WP-04/WP-05/WP-06/WP-07 focused gates,
# the frontend-controlled WP-03 Chromium acceptance suite, typecheck, lint,
# unit tests (Vitest), and the production build. The focused browser gate uses
# Playwright network mocks and does not start backend services; real-stack E2E
# remains a separate manual workflow.
#
# Path-filtered to frontend changes so backend-/docs-only PRs stay fast, the
# mirror image of how backend-integration.yml filters to backend paths.

name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the previous (still-running) run.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend-build:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned in frontend/package.json ("packageManager").
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install focused browser
        run: pnpm --filter @parkio/web exec playwright install --with-deps chromium

      - name: Architecture guardrails
        run: pnpm guardrails

      - name: Architecture guardrail tests
        run: pnpm guardrails:test

      - name: Architecture guardrail lint
        run: pnpm guardrails:lint

      - name: OpenAPI comparison tests
        run: pnpm contracts:openapi:test

      - name: OpenAPI comparison lint
        run: pnpm contracts:openapi:lint

      - name: Backend scope guard
        if: github.event_name == 'pull_request'
        run: |
          # Frontend-only sprint guard. Dual-domain PRs (services/ + frontend/) intentionally
          # change backend; skipping prevents false failures on api-branch provider work.
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | grep -qE '^services/'; then
            echo "Backend service paths present in PR; skipping frontend-only backend-scope guard."
            exit 0
          fi
          pnpm guardrails:backend -- --base ${{ github.event.pull_request.base.sha }}

      - name: WP-04 frontend data architecture
        run: |
          pnpm guardrails:wp04
          pnpm --filter @parkio/web test:wp04

      - name: WP-05 core parking flows
        run: |
          pnpm guardrails:wp05
          pnpm --filter @parkio/web test:wp05

      - name: WP-06 production hardening
        run: |
          pnpm guardrails:wp06
          pnpm --filter @parkio/web test:wp06

      - name: WP-07 mobile foundation
        run: |
          pnpm guardrails:wp07
          pnpm --filter @parkio/mobile-v2 test:wp07

      - name: WP-03 routing browser acceptance
        run: pnpm --filter @parkio/web exec playwright test e2e/wp03-routing.spec.ts --project=wp03-chromium --workers=1 --retries=0

      # `pnpm -r` runs each script only in the workspace packages that define it,
      # so packages without a given script are skipped rather than failing.
      #
      # The Expo/React Native apps are excluded here and owned by Mobile CI:
      #   * `mobile-v2` is gated there (typecheck, lint, focused suites, full jest);
      #     running its jest suites a second time alongside the web suites only added
      #     runner contention, which surfaced as RNTL `waitFor` timeouts.
      #   * legacy `mobile` is deprecated and advisory (docs/operations/mobile-release-policy.md);
      #     a blocking copy here would contradict that policy.
      # Nothing loses coverage — every excluded script still runs in Mobile CI.
      - name: Typecheck
        run: pnpm -r --filter='!@parkio/mobile' --filter='!@parkio/mobile-v2' typecheck

      - name: Lint
        run: pnpm -r --filter='!@parkio/mobile' --filter='!@parkio/mobile-v2' lint

      - name: Unit tests
        run: pnpm -r --filter='!@parkio/mobile' --filter='!@parkio/mobile-v2' test

      - name: Production build
        run: pnpm -r --filter='!@parkio/mobile' --filter='!@parkio/mobile-v2' build
