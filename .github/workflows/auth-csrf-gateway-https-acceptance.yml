name: Auth CSRF gateway HTTPS acceptance

on:
  pull_request:
    paths:
      - "services/auth-service/src/main/**"
      - "services/auth-service/src/csrfLab/**"
      - "services/auth-service/build.gradle.kts"
      - "services/gateway-service/src/main/java/com/parkio/gateway/infrastructure/config/CorsConfig.java"
      - "services/gateway-service/src/test/java/com/parkio/gateway/infrastructure/config/CorsConfigTest.java"
      - "scripts/csrf-lab/**"
      - "scripts/auth-csrf-chromium-acceptance.mjs"
      - "docs/security/GHAS-44-CSRF-MARKETING-EVIDENCE.md"
      - ".github/workflows/auth-csrf-gateway-https-acceptance.yml"
      - ".github/workflows/auth-csrf-browser-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-csrf-gateway-https-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-https:
    name: Auth CSRF gateway HTTPS acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm --filter @parkio/web exec playwright install --with-deps chromium

      - name: Verify CSRF lab filter absent from production bootJar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :services:auth-service:assertCsrfLabAbsentFromBootJar

      - name: Gateway CORS sibling unit evidence
        run: ./gradlew --no-daemon :services:gateway-service:test --tests com.parkio.gateway.infrastructure.config.CorsConfigTest

      - name: Run gateway HTTPS sibling-host browser lab
        env:
          PARKIO_CSRF_GATEWAY_BROWSER: "1"
        run: |
          export PARKIO_CSRF_PLAYWRIGHT_PACKAGE="$(cd frontend/apps/web && node -e 'process.stdout.write(require("path").dirname(require.resolve("@playwright/test")))')"
          test -f "$PARKIO_CSRF_PLAYWRIGHT_PACKAGE/index.mjs"
          node scripts/csrf-lab/run-auth-csrf-gateway-https-lab.mjs

      - name: Require passed lab artifact with session + layer attribution
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("build/csrf-gateway-https-result.json")
          if not path.is_file():
              raise SystemExit("missing build/csrf-gateway-https-result.json — lab did not produce evidence")
          result = json.loads(path.read_text())
          if result.get("status") == "security_defect":
              raise SystemExit(f"SECURITY DEFECT reproduced: {result.get('defect')}")
          if result.get("status") != "passed":
              raise SystemExit(f"gateway HTTPS lab not passed: {result.get('status')}")
          layers = result.get("layers") or {}
          required = [
              "siblingRefreshJson",
              "siblingLogoutJson",
              "siblingRefreshSimple",
              "siblingLogoutSimple",
              "authOriginIsolateRefresh",
              "authOriginIsolateLogout",
              "crossRefreshJson",
              "crossRefreshSimple",
              "crossLogoutJson",
          ]
          missing = [k for k in required if k not in layers]
          if missing:
              raise SystemExit(f"missing layer attribution: {missing}")
          isolate = layers["authOriginIsolateRefresh"]
          if not isolate.get("reachedAuth"):
              raise SystemExit(f"auth Origin isolate did not reach auth: {isolate}")
          if 403 not in (isolate.get("authStatuses") or []):
              raise SystemExit(f"auth Origin isolate missing 403: {isolate}")
          session = result.get("session") or {}
          if "attackBaseline" not in session or "afterAllowedLogout" not in session:
              raise SystemExit("missing session before/after probes")
          print("Gateway HTTPS CSRF lab proven:")
          print(json.dumps({"layers": layers, "sessionKeys": list(session.keys())}, indent=2))
          PY
