# Practical security gates for Parkio. The policy is deliberately high-signal:
# secrets always fail, dependency scans fail on HIGH/CRITICAL, and container images
# fail on CRITICAL findings with a fix in OS and library packages and, through S1,
# on HIGH/CRITICAL application-library findings with a fix. The images are the ten
# services and the web image (S2).
#
# Container scan selection (U08, owner decision 2026-10-05):
# - A pull request scans the images its changed files can affect
#   (scripts/ci/select_container_scans.py). Unclassified paths, scan inputs and an
#   unknown file list select every image. A path under scripts/ or docker/ selects
#   the images whose Dockerfile or Gradle build names it.
# - Every other event scans everything: a push to api or master, and a
#   workflow_dispatch, which includes master's scheduled dispatch onto api.
# - The summary fails when the selection fails, a selected scan fails or leaves no
#   report, or the scan is skipped while images were selected.
#
# CodeQL and Trivy SARIF upload publish to GitHub Code Scanning, which requires
# Code scanning (and, on private repos, GitHub Advanced Security) to be enabled.
# Those parts are gated behind the repository variable CODEQL_ENABLED so this
# workflow passes on a personal/private repo today and lights CodeQL up later,
# without code changes, once the repo moves to an org/GHAS:
#   set repository variable CODEQL_ENABLED=true (Settings -> Secrets and
#   variables -> Actions -> Variables) after enabling Code scanning.
# Scan reports are always published as build artifacts regardless of that gate.

env:
  TRIVY_IMAGE: aquasec/trivy:0.64.1
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

name: Security CI

on:
  pull_request:
  push:
    branches: [api, master]
  workflow_dispatch:

# Least-privilege for the Code Scanning path. security-events: write is only
# consumed by the SARIF-upload steps, which are themselves gated on
# CODEQL_ENABLED; it is harmless (unused) while the gate is off.
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'api' || github.sha }}
          fetch-depth: 0

      - name: Run gitleaks
        uses: docker://zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 # v8.28.0
        with:
          args: >
            git
            --config /github/workspace/.gitleaks.toml
            --redact
            --report-format sarif
            --report-path /github/workspace/gitleaks.sarif
            --verbose
            /github/workspace

      - name: Upload gitleaks report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Gated: runs only once Code scanning / GHAS is available and the repo
    # variable CODEQL_ENABLED is set to "true". Otherwise the job is skipped
    # cleanly (green) and the summary job reports it as skipped.
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'api' || github.sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  dependencies:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'api' || github.sha }}

      # Authenticated ghcr pull avoids anonymous trivy-db rate limits
      # (TOOMANYREQUESTS) when fetching the vulnerability database.
      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ env.TRIVY_IMAGE }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Show Trivy Docker image version
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          echo "Docker version:"
          docker version
          echo "Selected Trivy image: ${TRIVY_IMAGE}"
          docker run --rm "${TRIVY_IMAGE}" --version

      - name: Generate dependency vulnerability report
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          echo "Docker version:"
          docker version
          echo "Selected Trivy image: ${TRIVY_IMAGE}"
          docker run --rm "${TRIVY_IMAGE}" --version
          echo "Scan target: ."
          echo "Severity policy: report HIGH/CRITICAL fixable library vulnerabilities; do not fail this report step."
          echo "Ignore policy: .trivyignore.yaml (narrow, expiring exceptions only)"
          echo "Output: trivy-dependencies.txt"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${TRIVY_CACHE_DIR}:/root/.cache/trivy" \
            -w /work \
            "${TRIVY_IMAGE}" \
            fs . \
            --scanners vuln \
            --vuln-type library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --format table \
            --output trivy-dependencies.txt \
            --exit-code 0 \
            --cache-dir /root/.cache/trivy

      - name: Block on dependency vulnerabilities
        run: |
          set -euo pipefail
          echo "Docker version:"
          docker version
          echo "Selected Trivy image: ${TRIVY_IMAGE}"
          docker run --rm "${TRIVY_IMAGE}" --version
          echo "Scan target: ."
          echo "Severity policy: block on HIGH/CRITICAL fixable library vulnerabilities."
          echo "Ignore policy: .trivyignore.yaml (narrow, expiring exceptions only)"
          echo "Output: trivy-dependencies.sarif"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -v "${TRIVY_CACHE_DIR}:/root/.cache/trivy" \
            -w /work \
            "${TRIVY_IMAGE}" \
            fs . \
            --scanners vuln \
            --vuln-type library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --format sarif \
            --output trivy-dependencies.sarif \
            --exit-code 1 \
            --cache-dir /root/.cache/trivy

      - name: Show dependency report on failure
        if: failure()
        run: |
          if [ -s trivy-dependencies.txt ]; then
            cat trivy-dependencies.txt
          else
            echo "No dependency table report was generated. Check the preceding Trivy command output."
          fi

      - name: Upload dependency SARIF to Code Scanning
        # Only when Code Scanning is available; harmless to skip otherwise.
        if: ${{ always() && vars.CODEQL_ENABLED == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-dependencies.sarif
          category: trivy-dependencies

      - name: Upload dependency report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependencies-reports
          path: |
            trivy-dependencies.txt
            trivy-dependencies.sarif
          if-no-files-found: ignore
          retention-days: 14

  select:
    name: Container scan selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.select.outputs.images }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'api' || github.sha }}

      - name: Selection and summary-gate tests
        run: python3 -m unittest scripts/ci/test_select_container_scans.py scripts/ci/test_security_ci_summary.py

      # A pull request scans the images its changed files can affect; every other event, including
      # master's scheduled dispatch onto api, scans all of them. Unclassified paths and unknown file
      # lists select every image (U08, owner decision 2026-10-05).
      - name: Select the images to scan
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: python3 scripts/ci/select_container_scans.py --event "$EVENT" --github-output "$GITHUB_OUTPUT"

  container-images:
    name: Container scan (${{ matrix.service }})
    needs: select
    if: ${{ needs.select.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'api' || github.sha }}

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ env.TRIVY_IMAGE }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Show Trivy Docker image version
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          echo "Docker version:"
          docker version
          echo "Selected Trivy image: ${TRIVY_IMAGE}"
          docker run --rm "${TRIVY_IMAGE}" --version

      - name: Ensure gradlew executable
        run: chmod +x gradlew

      # S2: the web image is built as the release builds it (release bake values) with a
      # synthetic MapTiler key; only its dependencies and base image matter to the scan.
      - name: Build image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          if [ "$SERVICE" = "web" ]; then
            args=()
            while IFS='=' read -r key value; do
              case "$key" in VITE_*) args+=(--build-arg "$key=$value") ;; esac
            done < <(grep -v -E '^\s*(#|$)' docker/web-hosted-beta.release-bake.env)
            docker build -f frontend/apps/web/Dockerfile "${args[@]}" \
              --build-arg VITE_MAPTILER_KEY=securityScanSyntheticMapKey00 \
              -t "parkio/web:security-ci" .
          else
            docker build -f "services/${SERVICE}/Dockerfile" -t "parkio/${SERVICE}:security-ci" .
          fi

      - name: Scan image for high and critical findings
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          image_ref="parkio/${{ matrix.service }}:security-ci"
          echo "Docker version:"
          docker version
          echo "Selected Trivy image: ${TRIVY_IMAGE}"
          docker run --rm "${TRIVY_IMAGE}" --version
          echo "Scan target: ${image_ref}"
          echo "Severity policy: report HIGH/CRITICAL image vulnerabilities; do not fail this report step."
          echo "Output: trivy-image-${{ matrix.service }}.txt"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${TRIVY_CACHE_DIR}:/root/.cache/trivy" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${TRIVY_IMAGE}" \
            image "${image_ref}" \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --output trivy-image-${{ matrix.service }}.txt \
            --exit-code 0 \
            --cache-dir /root/.cache/trivy

      - name: Block on critical image findings
        run: |
          set -euo pipefail
          image_ref="parkio/${{ matrix.service }}:security-ci"
          echo "Docker version:"
          docker version
          echo "Selected Trivy image: ${TRIVY_IMAGE}"
          docker run --rm "${TRIVY_IMAGE}" --version
          echo "Scan target: ${image_ref}"
          echo "Severity policy: block on CRITICAL image vulnerabilities."
          echo "Output: trivy-image-${{ matrix.service }}.sarif"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${TRIVY_CACHE_DIR}:/root/.cache/trivy" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${TRIVY_IMAGE}" \
            image "${image_ref}" \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image-${{ matrix.service }}.sarif \
            --exit-code 1 \
            --cache-dir /root/.cache/trivy

      - name: Block on high and critical library findings with a fix
        if: ${{ !cancelled() }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          image_ref="parkio/${SERVICE}:security-ci"
          echo "Scan target: ${image_ref} (application libraries only)"
          echo "Severity policy: block on HIGH/CRITICAL library vulnerabilities that have a fix."
          echo "Ignore policy: .trivyignore.yaml (narrow, expiring exceptions only)"
          for format in table sarif; do
            ext=$([ "$format" = table ] && echo txt || echo sarif)
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${TRIVY_CACHE_DIR}:/root/.cache/trivy" \
              -v "${GITHUB_WORKSPACE}:/work" \
              -w /work \
              "${TRIVY_IMAGE}" \
              image "${image_ref}" \
              --scanners vuln \
              --pkg-types library \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile .trivyignore.yaml \
              --format "$format" \
              --output "trivy-image-${SERVICE}-library.${ext}" \
              --exit-code "$([ "$format" = sarif ] && echo 1 || echo 0)" \
              --cache-dir /root/.cache/trivy
          done

      - name: Show image reports on failure
        if: failure()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          for report in "trivy-image-${SERVICE}.txt" "trivy-image-${SERVICE}-library.txt"; do
            if [ -s "$report" ]; then
              echo "== $report"
              cat "$report"
            else
              echo "No table report $report was generated. Check the preceding Trivy command output."
            fi
          done

      # Missing results fail the job: a selected scan must leave all four reports.
      - name: Require every scan report
        if: ${{ !cancelled() }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          missing=0
          for report in "trivy-image-${SERVICE}.txt" "trivy-image-${SERVICE}.sarif" \
                        "trivy-image-${SERVICE}-library.txt" "trivy-image-${SERVICE}-library.sarif"; do
            if [ ! -s "$report" ]; then
              echo "::error::missing scan result ${report}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload image SARIF to Code Scanning
        if: ${{ always() && vars.CODEQL_ENABLED == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Upload library SARIF to Code Scanning
        if: ${{ always() && vars.CODEQL_ENABLED == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-${{ matrix.service }}-library.sarif
          category: trivy-image-${{ matrix.service }}-library

      - name: Upload image report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ matrix.service }}-reports
          path: |
            trivy-image-${{ matrix.service }}.txt
            trivy-image-${{ matrix.service }}.sarif
            trivy-image-${{ matrix.service }}-library.txt
            trivy-image-${{ matrix.service }}-library.sarif
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: Security CI summary
    runs-on: ubuntu-latest
    if: always()
    needs: [secrets, codeql, dependencies, select, container-images]
    steps:
      - name: Write summary
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          SELECTED_IMAGES: ${{ needs.select.outputs.images }}
          CONTAINER_RESULT: ${{ needs.container-images.result }}
          CODEQL_ENABLED: ${{ vars.CODEQL_ENABLED }}
        run: |
          if [ "${CODEQL_ENABLED}" = "true" ]; then
            codeql_line="**enabled** (result: ${CODEQL_RESULT}) — SARIF uploaded to Code Scanning when available"
          else
            # Distinguishes intentional gate-off from platform unavailability. Public repos
            # can run CodeQL without GHAS; this skip is a configuration choice, not a PASS.
            codeql_line="**skipped by configuration** (CODEQL_ENABLED is not \"true\"; not a SAST PASS)"
          fi

          {
            echo "## Security CI summary"
            echo ""
            echo "| Gate | Policy | Result |"
            echo "| --- | --- | --- |"
            echo "| Secret scan (gitleaks) | blocking — fails on any detected secret | ${SECRETS_RESULT} |"
            echo "| Trivy dependency scan | blocking — fails on HIGH/CRITICAL fixable library vulns | ${DEPENDENCIES_RESULT} |"
            echo "| Container scan selection | images this run must scan; unknown paths select all | ${SELECT_RESULT}: ${SELECTED_IMAGES:-unknown} |"
            echo "| Trivy container scan | reporting HIGH/CRITICAL; blocking on CRITICAL image vulns and on HIGH/CRITICAL fixable library vulns | ${CONTAINER_RESULT} |"
            echo "| CodeQL (SAST) | ${codeql_line} |  |"
            echo ""
            echo "All scan reports are published as workflow artifacts regardless of CodeQL state."
            echo ""
            echo "### How to enable CodeQL"
            echo "1. Move the repo to an organization, or enable GitHub Advanced Security on it."
            echo "2. Enable **Settings -> Code security and analysis -> Code scanning**."
            echo "3. Add repository variable **CODEQL_ENABLED=true** (Settings -> Secrets and variables -> Actions -> Variables)."
            echo "4. Re-run Security CI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail summary if a required gate failed
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          SELECT_ANY: ${{ needs.select.outputs.any }}
          CONTAINER_RESULT: ${{ needs.container-images.result }}
        run: |
          # codeql may legitimately be "skipped" (gate off) — that is not a failure.
          fail=0
          for r in "$SECRETS_RESULT" "$DEPENDENCIES_RESULT" "$SELECT_RESULT"; do
            if [ "$r" != "success" ]; then fail=1; fi
          done
          # The container scan may be skipped only when the selection chose no image; a skip for any
          # other reason (a failed or missing selection) fails closed.
          if [ "$CONTAINER_RESULT" != "success" ]; then
            if [ "$CONTAINER_RESULT" = "skipped" ] && [ "$SELECT_RESULT" = "success" ] && [ "$SELECT_ANY" = "false" ]; then
              echo "Container scan skipped: the selection chose no image."
            else
              fail=1
            fi
          fi
          if [ "$CODEQL_RESULT" = "failure" ]; then fail=1; fi
          if [ "$fail" -eq 1 ]; then
            echo "::error::One or more Security CI gates failed. See the job summary."
            exit 1
          fi
          echo "All required Security CI gates passed."
