# Candidate images from a pinned api revision (owner decision 2026-10-07, item 3).
#
# One dispatch builds the production images (ten services and web) from one api commit, exactly
# as .github/workflows/release.yml builds them (same Dockerfiles, build arguments, pinned Buildx
# and build-push actions, OCI labels), scans them with Security CI's container policy, keeps every
# image as a workflow artifact, and accepts them in this run on disposable stacks:
#   - the full Compose stack (docker-compose.images.yml tags) with the runtime-validation checks:
#     every container runs the candidate image id, healthchecks, readiness, gateway/ingress 401/400;
#   - the U03 auth+gateway artifact acceptance (privileged-token revocation within the configured
#     epoch-cache bound, fail-closed epoch lookups, direct-ingress protection, single-session
#     revocation; scripts/ci/candidate-acceptance, 22 checks);
#   - the web suites (a11y-web, cxf11-acceptance) against the candidate web image.
# Nothing is pushed or published here. Publication is a separate, owner-approved dispatch of
# candidate-publish.yml, which pushes the artifacts of a given run after checking their identities
# against this run's manifest. Artifacts, not a rebuild at publication time, because service jars
# are not byte-reproducible: the accepted image and the published image must be the same bytes.
#
# Layout of every job: this workflow's own revision is the workspace root (helper scripts, the
# acceptance stack, the composite action), and the source is checked out at source_sha under
# source/, which is also the Docker build context. So an older source_sha that predates the
# helpers can still be built, and no tracked path of the source is touched.
#
# Prerequisites: the WEB_MAPTILER_KEY secret on the `release` environment (release-equivalent web
# image; the Dockerfile refuses an empty key), read access to the private MinIO image for the full
# stack (GITHUB_TOKEN). On pull requests only the script tests run.

name: Candidate images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full 40-hex api commit to build; it must be reachable from origin/api"
        required: true
        type: string
      services:
        description: "all, or a comma-separated subset of: gateway-service,auth-service,user-service,parking-service,media-service,gamification-service,notification-service,moderation-service,ai-validation-service,analytics-service,web"
        required: false
        default: all
        type: string
      acceptance:
        description: "Run the disposable acceptance stacks (needs all services)"
        required: false
        default: true
        type: boolean
  pull_request:
    branches: [api]
    paths:
      - ".github/workflows/candidate-images.yml"
      - ".github/workflows/candidate-publish.yml"
      - ".github/actions/candidate-image-build/**"
      - "scripts/ci/candidate-*"
      - "scripts/ci/candidate-acceptance/**"
      - "scripts/ci/test-candidate-scripts.sh"
      - "scripts/web-candidate-evidence.sh"

permissions:
  contents: read

concurrency:
  group: candidate-images-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: aquasec/trivy:0.64.1
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
  # As release.yml: no Docker build record artifact (it would carry the build arguments).
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  script-tests:
    name: Candidate helper script tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the helper script tests
        run: |
          set -euo pipefail
          chmod +x scripts/ci/test-candidate-scripts.sh
          scripts/ci/test-candidate-scripts.sh

  resolve:
    name: Resolve the pinned api revision
    needs: script-tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha12: ${{ steps.resolve.outputs.sha12 }}
      created: ${{ steps.resolve.outputs.created }}
      service_matrix: ${{ steps.resolve.outputs.service_matrix }}
      services_selected: ${{ steps.resolve.outputs.services_selected }}
      web_selected: ${{ steps.resolve.outputs.web_selected }}
      all_selected: ${{ steps.resolve.outputs.all_selected }}
      selected_csv: ${{ steps.resolve.outputs.selected_csv }}
    steps:
      - name: Checkout api history
        uses: actions/checkout@v4
        with:
          ref: api
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and select
        id: resolve
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full 40-hex commit id"; exit 2
          fi
          if ! git cat-file -e "${SOURCE_SHA}^{commit}"; then
            echo "::error::$SOURCE_SHA is not a commit in this repository"; exit 2
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/api; then
            echo "::error::$SOURCE_SHA is not reachable from origin/api; candidates come from pinned api revisions only"; exit 2
          fi
          python3 - "$SOURCE_SHA" "$SERVICES" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          sha, services = sys.argv[1], sys.argv[2].strip()
          known = {
              "gateway-service": "services/gateway-service/Dockerfile",
              "auth-service": "services/auth-service/Dockerfile",
              "user-service": "services/user-service/Dockerfile",
              "parking-service": "services/parking-service/Dockerfile",
              "media-service": "services/media-service/Dockerfile",
              "gamification-service": "services/gamification-service/Dockerfile",
              "notification-service": "services/notification-service/Dockerfile",
              "moderation-service": "services/moderation-service/Dockerfile",
              "ai-validation-service": "services/ai-validation-service/Dockerfile",
              "analytics-service": "services/analytics-service/Dockerfile",
              "web": "frontend/apps/web/Dockerfile",
          }
          selected = list(known) if services in ("", "all") else [s.strip() for s in services.split(",") if s.strip()]
          unknown = [s for s in selected if s not in known]
          if unknown:
              print(f"::error::unknown services: {', '.join(unknown)}", file=sys.stderr); sys.exit(2)
          service_matrix = [{"service": s, "dockerfile": known[s]} for s in selected if s != "web"]
          print(f"sha={sha}")
          print(f"sha12={sha[:12]}")
          print(f"service_matrix={json.dumps(service_matrix)}")
          print(f"services_selected={'true' if service_matrix else 'false'}")
          print(f"web_selected={'true' if 'web' in selected else 'false'}")
          print(f"all_selected={'true' if set(selected) == set(known) else 'false'}")
          print(f"selected_csv={','.join(selected)}")
          PY
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Candidate source $SOURCE_SHA (api ancestor), services: ${SERVICES:-all}"

  build:
    name: Build ${{ matrix.service }}
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && needs.resolve.outputs.services_selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.service_matrix) }}
    steps:
      - name: Checkout this workflow's tooling (workspace root)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the pinned revision (source/)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Build, scan and save the candidate image
        uses: ./.github/actions/candidate-image-build
        with:
          source_dir: source
          service: ${{ matrix.service }}
          dockerfile: ${{ matrix.dockerfile }}
          source_sha: ${{ needs.resolve.outputs.sha }}
          sha12: ${{ needs.resolve.outputs.sha12 }}
          created: ${{ needs.resolve.outputs.created }}
          trivy_image: ${{ env.TRIVY_IMAGE }}
          trivy_cache_dir: ${{ env.TRIVY_CACHE_DIR }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  build_web:
    name: Candidate web image
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && needs.resolve.outputs.web_selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # WEB_MAPTILER_KEY lives on the `release` environment (release.yml, job images). The key is
    # baked into the public bundle, so this is not a server secret; release.yml says the same.
    environment: release
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout this workflow's tooling (workspace root)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the pinned revision (source/)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false

      # release.yml's web build arguments, derived from the hosted-beta release bake with the same
      # contract check. The MapTiler key is added from the environment secret below; an empty
      # secret must reach the Dockerfile so the build fails loudly instead of baking "" (I11).
      - name: Web build arguments
        id: webargs
        env:
          WEB_MAPTILER_KEY: ${{ secrets.WEB_MAPTILER_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_MAPTILER_KEY}" ]; then
            echo "::error::WEB_MAPTILER_KEY is empty: set it on the release environment (release.yml needs it too)"; exit 1
          fi
          chmod +x scripts/ci/candidate-web-build-args.sh
          # The source revision's bake file, not this workflow's: the image is built from source/.
          bake="$GITHUB_WORKSPACE/source/docker/web-hosted-beta.release-bake.env"
          {
            echo 'args<<ARGS_EOF'
            PARKIO_WEB_BAKE="$bake" scripts/ci/candidate-web-build-args.sh
            echo "VITE_MAPTILER_KEY=${WEB_MAPTILER_KEY}"
            echo 'ARGS_EOF'
          } >> "$GITHUB_OUTPUT"
          PARKIO_WEB_BAKE="$bake" scripts/ci/candidate-web-build-args.sh

      - name: Build, scan and save the candidate web image
        uses: ./.github/actions/candidate-image-build
        with:
          source_dir: source
          service: web
          dockerfile: frontend/apps/web/Dockerfile
          source_sha: ${{ needs.resolve.outputs.sha }}
          sha12: ${{ needs.resolve.outputs.sha12 }}
          created: ${{ needs.resolve.outputs.created }}
          extra_build_args: ${{ steps.webargs.outputs.args }}
          trivy_image: ${{ env.TRIVY_IMAGE }}
          trivy_cache_dir: ${{ env.TRIVY_CACHE_DIR }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  acceptance-stack:
    name: Full stack acceptance (candidate images)
    needs: [resolve, build, build_web]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance && needs.resolve.outputs.all_selected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      SHA12: ${{ needs.resolve.outputs.sha12 }}
      COMPOSE_ENV_FILE: docker/.env.candidate-acceptance
      COMPOSE_FILES: >-
        -f docker/docker-compose.yml
        -f docker/docker-compose.apps.yml
        -f docker/docker-compose.images.yml
        -f docker/docker-compose.hosted-beta.yml
    steps:
      - name: Checkout this workflow's tooling (workspace root)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the pinned revision (source/)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Log in to GHCR for the private MinIO pull
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the candidate images
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-image-*-${{ needs.resolve.outputs.sha12 }}
          path: candidates

      - name: Load the candidate images and check their identities
        run: |
          set -euo pipefail
          mkdir -p acceptance-stack
          for dir in candidates/candidate-image-*-"$SHA12"; do
            (cd "$dir" && sha256sum -c SHA256SUMS --quiet)
            gunzip -c "$dir/image.tar.gz" | docker load
            expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["Id"])' "$dir/inspect.json")"
            tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["RepoTags"][0])' "$dir/inspect.json")"
            actual="$(docker image inspect -f '{{.Id}}' "$tag")"
            test "$actual" = "$expected" || { echo "::error::$tag loaded as $actual, artifact says $expected"; exit 1; }
            echo "$tag $actual" | tee -a acceptance-stack/loaded-images.txt
          done
          test "$(wc -l < acceptance-stack/loaded-images.txt)" -eq 11 || { echo "::error::expected 11 candidate images"; exit 1; }

      - name: Prepare the CI-only env and start the stack from the loaded images only
        working-directory: source
        run: |
          set -euo pipefail
          T="$GITHUB_WORKSPACE"; A="$T/acceptance-stack"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.pem"
          python3 "$T/scripts/ci/candidate-stack-env.py" --image-tag "candidate-$SHA12" --git-sha "$SHA" \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --jwt-pem "$RUNNER_TEMP/jwt.pem" --out "$COMPOSE_ENV_FILE"
          docker compose --env-file "$COMPOSE_ENV_FILE" $COMPOSE_FILES config --quiet
          docker compose --env-file "$COMPOSE_ENV_FILE" $COMPOSE_FILES config --format json > "$RUNNER_TEMP/compose-model.json"
          python3 "$T/scripts/ci/compose_image_identity.py" record "$RUNNER_TEMP/compose-model.json" \
            --expect-revision "$SHA" --out "$A/image-identity.json" \
            --override "$RUNNER_TEMP/compose-pull-never.json"
          docker compose --env-file "$COMPOSE_ENV_FILE" $COMPOSE_FILES -f "$RUNNER_TEMP/compose-pull-never.json" up -d --no-build
          python3 "$T/scripts/ci/compose_image_identity.py" verify "$A/image-identity.json"

      - name: Healthchecks, readiness and ingress protection
        working-directory: source
        run: |
          set -euo pipefail
          T="$GITHUB_WORKSPACE"; A="$T/acceptance-stack"
          chmod +x "$T/scripts/ci/candidate-stack-checks.sh"
          if "$T/scripts/ci/candidate-stack-checks.sh" "$A"; then
            echo '{"status": "pass", "detail": "every container runs the candidate image id; healthchecks, readiness and gateway/ingress checks passed"}' > "$A/result.json"
          else
            echo '{"status": "fail", "detail": "see checks.tsv and health.tsv"}' > "$A/result.json"
            exit 1
          fi

      - name: Collect logs and tear down
        if: always()
        working-directory: source
        run: |
          set -euo pipefail
          A="$GITHUB_WORKSPACE/acceptance-stack"
          docker compose --env-file "$COMPOSE_ENV_FILE" $COMPOSE_FILES ps > "$A/ps.txt" 2>&1 || true
          docker compose --env-file "$COMPOSE_ENV_FILE" $COMPOSE_FILES logs --no-color --tail 400 > "$A/compose-logs.txt" 2>&1 || true
          docker compose --env-file "$COMPOSE_ENV_FILE" $COMPOSE_FILES down -v --remove-orphans || true
          [ -f "$A/result.json" ] || echo '{"status": "fail", "detail": "stack did not start"}' > "$A/result.json"

      - name: Upload the stack acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-acceptance-stack
          path: acceptance-stack/
          retention-days: 90
          overwrite: true

  acceptance-auth-gateway:
    name: Auth+gateway artifact acceptance (U03, 22 checks)
    needs: [resolve, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance && needs.resolve.outputs.all_selected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHA12: ${{ needs.resolve.outputs.sha12 }}
      AUTH_IMAGE: parkio/auth-service:candidate-${{ needs.resolve.outputs.sha12 }}
      GATEWAY_IMAGE: parkio/gateway-service:candidate-${{ needs.resolve.outputs.sha12 }}
      COMPOSE_FILE: scripts/ci/candidate-acceptance/docker-compose.yml
    steps:
      - name: Checkout this workflow's tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the auth and gateway candidates
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-image-{auth-service,gateway-service}-${{ needs.resolve.outputs.sha12 }}
          path: candidates

      - name: Load the candidate images
        run: |
          set -euo pipefail
          mkdir -p acceptance-auth-gateway
          for dir in candidates/candidate-image-*-"$SHA12"; do
            (cd "$dir" && sha256sum -c SHA256SUMS --quiet)
            gunzip -c "$dir/image.tar.gz" | docker load
          done
          docker image inspect -f '{{.Id}}' "$AUTH_IMAGE" "$GATEWAY_IMAGE" | tee acceptance-auth-gateway/loaded-image-ids.txt

      - name: Start the disposable stack and run the acceptance
        run: |
          set -euo pipefail
          PARKIO_JWT_PRIVATE_KEY_PEM="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | awk 'BEGIN{ORS="\\n"}{print}')"
          export PARKIO_JWT_PRIVATE_KEY_PEM
          PARKIO_LOGIN_THROTTLE_HMAC_KEY="$(openssl rand -base64 48)"
          export PARKIO_LOGIN_THROTTLE_HMAC_KEY
          docker compose -f "$COMPOSE_FILE" up -d --wait --wait-timeout 300
          docker compose -f "$COMPOSE_FILE" ps --format '{{.Name}}\t{{.Image}}\t{{.Status}}' | tee acceptance-auth-gateway/ps.txt
          for svc in auth-service gateway-service; do
            cid="$(docker compose -f "$COMPOSE_FILE" ps -q "$svc")"
            running="$(docker inspect -f '{{.Image}}' "$cid")"
            expected="$(docker image inspect -f '{{.Id}}' "parkio/${svc}:candidate-${SHA12}")"
            test "$running" = "$expected" || { echo "::error::$svc runs $running, candidate is $expected"; exit 1; }
          done
          rc=0
          CANDIDATE_ACCEPTANCE_OUT="$PWD/acceptance-auth-gateway" python3 scripts/ci/candidate-acceptance/run-acceptance.py || rc=$?
          python3 - "$rc" <<'PY'
          import json, sys
          rc = int(sys.argv[1])
          results = json.load(open("acceptance-auth-gateway/acceptance-image-results.json"))
          passed, failed = results.get("passed", 0), results.get("failed", 1)
          # The runner records 22 checks (September package: 22/22); fewer means a check did not run.
          status = "pass" if rc == 0 and failed == 0 and passed >= 22 else "fail"
          json.dump({"status": status, "detail": f"passed {passed}, failed {failed} (fixture PARKIO_SESSION_EPOCH_CACHE_TTL=PT3S; 22 expected)"},
                    open("acceptance-auth-gateway/result.json", "w"))
          print(status, passed, failed)
          sys.exit(0 if status == "pass" else 1)
          PY

      - name: Collect logs and tear down
        if: always()
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" logs --no-color --tail 400 > acceptance-auth-gateway/compose-logs.txt 2>&1 || true
          docker compose -f "$COMPOSE_FILE" down -v --remove-orphans || true
          [ -f acceptance-auth-gateway/result.json ] || echo '{"status": "fail", "detail": "stack did not start or the runner did not finish"}' > acceptance-auth-gateway/result.json

      - name: Upload the auth+gateway acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-acceptance-auth-gateway
          path: acceptance-auth-gateway/
          retention-days: 90
          overwrite: true

  acceptance-web:
    name: Web suites against the candidate web image (a11y, CX-F11)
    needs: [resolve, build_web]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance && needs.resolve.outputs.all_selected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHA12: ${{ needs.resolve.outputs.sha12 }}
      WEB_IMAGE: parkio/web:candidate-${{ needs.resolve.outputs.sha12 }}
    steps:
      - name: Checkout this workflow's tooling (workspace root)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the pinned revision (source/)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: source/frontend/package.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: source/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source/frontend
        run: pnpm install --frozen-lockfile

      - name: Install focused browser
        run: pnpm --dir source/frontend --filter @parkio/web exec playwright install --with-deps chromium

      - name: Download the web candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate-image-web-${{ needs.resolve.outputs.sha12 }}
          path: candidates/web

      - name: Load the candidate web image
        run: |
          set -euo pipefail
          (cd candidates/web && sha256sum -c SHA256SUMS --quiet)
          gunzip -c candidates/web/image.tar.gz | docker load
          docker image inspect -f '{{.Id}}' "$WEB_IMAGE"

      # The script comes from this workflow's revision; the source root (frontend, bake, git) is the
      # pinned checkout under source/, so the provenance records source_sha and the prebuilt revision
      # check holds.
      - name: Run the suites against the prebuilt candidate image
        run: |
          set -euo pipefail
          mkdir -p acceptance-web
          rc=0
          PARKIO_CANDIDATE_SOURCE_ROOT="$GITHUB_WORKSPACE/source" PARKIO_CANDIDATE_PREBUILT_TAG="$WEB_IMAGE" \
            bash scripts/web-candidate-evidence.sh "$GITHUB_WORKSPACE/acceptance-web/evidence" || rc=$?
          python3 - "$rc" <<'PY'
          import json, sys
          rc = int(sys.argv[1])
          suites = []
          try:
              for line in open("acceptance-web/evidence/suites.tsv"):
                  name, code = line.rstrip("\n").split("\t")
                  suites.append(f"{name}={'pass' if code == '0' else 'fail'}")
          except FileNotFoundError:
              pass
          status = "pass" if rc == 0 and suites and all(s.endswith("=pass") for s in suites) else "fail"
          json.dump({"status": status, "detail": ", ".join(suites) or "no suite ran"}, open("acceptance-web/result.json", "w"))
          print(status, suites)
          sys.exit(0 if status == "pass" else 1)
          PY

      - name: Upload the web acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-acceptance-web
          path: acceptance-web/
          retention-days: 90
          overwrite: true

  manifest:
    name: Candidate manifest
    needs: [resolve, build, build_web, acceptance-stack, acceptance-auth-gateway, acceptance-web]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this workflow's tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the identity records and acceptance results
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-{image-*-${{ needs.resolve.outputs.sha12 }}-meta,acceptance-*}
          path: records

      - name: Assemble the manifest
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          SELECTED: ${{ needs.resolve.outputs.selected_csv }}
          ACCEPTANCE: ${{ inputs.acceptance && needs.resolve.outputs.all_selected == 'true' }}
        run: |
          set -euo pipefail
          flag=()
          [ "$ACCEPTANCE" = "true" ] && flag=(--acceptance-required)
          rc=0
          python3 scripts/ci/candidate-manifest.py --source-sha "$SHA" --artifacts records --out manifest \
            --expect-services "$SELECTED" "${flag[@]}" || rc=$?
          (cd manifest && sha256sum candidate-manifest.json SUMMARY.md > SHA256SUMS)
          cat manifest/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run id for candidate-publish.yml: ${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload the manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-manifest-${{ needs.resolve.outputs.sha12 }}
          path: manifest/
          retention-days: 90
          overwrite: true
