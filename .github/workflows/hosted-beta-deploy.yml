# Hosted-beta deploy / rollback foundation (R5.1).
#
# Always builds images from the workflow commit (sha-<gitsha>). Deploy and rollback
# are workflow_dispatch only — nothing auto-deploys to a VPS.
#
# The deploy and rollback jobs run the default hosted-beta profile. It renders
# docker/compose.production.files (CL-F12): deploy builds the services that list does not
# pin and pulls the digest pins, and rollback re-points the built ones. Before the next
# deploy, confirm the parkio-beta runner host: docs/beta/deploy-runbook.md, "Release step".
#
# Jobs:
#   build-images  — build + tag all app images, write deploy manifest artifact
#   deploy        — optional; needs self-hosted runner labeled parkio-beta
#                   (not required for local script use)
#   rollback      — optional; requires manifest under deploy-artifacts/
#
# Local operators should prefer:
#   PARKIO_ENV_FILE=docker/.env ./scripts/deploy-hosted-beta.sh
#   PARKIO_ENV_FILE=docker/.env ./scripts/rollback-hosted-beta.sh --manifest deploy-artifacts/....json

name: Hosted-beta deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "build | deploy | rollback"
        required: true
        type: choice
        options:
          - build
          - deploy
          - rollback
        default: build
      manifest_artifact:
        description: "For rollback: RUN_ID/ARTIFACT@SHA256 of the earlier deploy's live manifest (its deploy job summary prints it)"
        required: false
        type: string
      allow_dirty:
        description: "Unused in CI (checkout is always clean). Reserved for documentation parity."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: hosted-beta-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    name: Build images + manifest
    if: ${{ github.event.inputs.action == 'build' || github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      git_sha: ${{ steps.meta.outputs.git_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Meta
        id: meta
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          tag="sha-${sha}"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "git_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "Building $tag at $created"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Dry-run deploy script (manifest + compose config)
        env:
          PARKIO_IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          PARKIO_GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          PARKIO_IMAGE_CREATED: ${{ steps.meta.outputs.created }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-hosted-beta.sh scripts/rollback-hosted-beta.sh scripts/smoke-hosted-beta.sh
          # Example env is enough for dry-run manifest + compose config (no production secrets).
          cp docker/.env.example docker/.env.ci-deploy
          PARKIO_ENV_FILE=docker/.env.ci-deploy \
            PARKIO_DEPLOY_ARTIFACT_DIR=deploy-artifacts \
            PARKIO_DEPLOY_OPERATOR=github-actions \
            ./scripts/deploy-hosted-beta.sh --dry-run --no-hosted-beta-overlay --allow-dirty

      - name: Build all service images (current commit)
        env:
          PARKIO_IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          PARKIO_GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          PARKIO_IMAGE_CREATED: ${{ steps.meta.outputs.created }}
        run: |
          set -euo pipefail
          # Example env is enough for image *build*; runtime deploy needs real secrets on the runner.
          export PARKIO_IMAGE_TAG PARKIO_GIT_SHA PARKIO_IMAGE_CREATED
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.apps.yml \
            -f docker/docker-compose.images.yml \
            --env-file docker/.env.ci-deploy \
            build

      - name: Tag beta-latest
        env:
          PARKIO_IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          for svc in gateway-service auth-service user-service parking-service media-service \
            gamification-service notification-service moderation-service ai-validation-service analytics-service; do
            docker tag "parkio/${svc}:${PARKIO_IMAGE_TAG}" "parkio/${svc}:beta-latest"
          done

      - name: Upload deploy manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-manifest-${{ steps.meta.outputs.git_sha }}
          path: |
            deploy-artifacts/
          retention-days: 90

      - name: Optional push to GHCR
        if: ${{ vars.PUBLISH_IMAGES == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: ${{ vars.PUBLISH_IMAGES == 'true' }}
        env:
          PARKIO_IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          for svc in gateway-service auth-service user-service parking-service media-service \
            gamification-service notification-service moderation-service ai-validation-service analytics-service; do
            src="parkio/${svc}:${PARKIO_IMAGE_TAG}"
            dst="${REGISTRY}/${repo}/${svc}:${PARKIO_IMAGE_TAG}"
            dst_beta="${REGISTRY}/${repo}/${svc}:beta-latest"
            docker tag "$src" "$dst"
            docker tag "$src" "$dst_beta"
            docker push "$dst"
            docker push "$dst_beta"
          done

  deploy:
    name: Deploy (self-hosted beta)
    if: ${{ github.event.inputs.action == 'deploy' }}
    needs: build-images
    runs-on: [self-hosted, parkio-beta]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy current commit
        env:
          PARKIO_ENV_FILE: docker/.env
          PARKIO_DEPLOY_OPERATOR: github-actions
          PARKIO_GATEWAY_URL: http://127.0.0.1:8080
          PARKIO_SMOKE_EXPECT_DIRECT_BLOCKED: "1"
          # Seeded real-e2e account password for the smoke (secret store -> repository secret; no default
          # since 2026-10-08). Empty -> the wrapper refuses before anything is built or started.
          PARKIO_REAL_USER_PASSWORD: ${{ secrets.HOSTED_BETA_REAL_USER_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-hosted-beta.sh scripts/smoke-hosted-beta.sh
          if [ ! -f "$PARKIO_ENV_FILE" ]; then
            echo "ERROR: env file $PARKIO_ENV_FILE not found on runner."
            echo "Place a real docker/.env on the parkio-beta runner (never commit secrets)."
            exit 2
          fi
          ./scripts/deploy-hosted-beta.sh

      # The rollback needs only the manifest. deploy-artifacts/ also holds the Compose model
      # rendered from the runner's real docker/.env (secrets) and the smoke logs, and artifacts of
      # this public repository are downloadable, so the upload is an allowlist (#204 review N6).
      - name: Upload post-deploy manifest
        uses: actions/upload-artifact@v4
        with:
          name: deploy-manifest-live-${{ needs.build-images.outputs.git_sha }}
          path: deploy-artifacts/deploy-*.json
          if-no-files-found: error
          retention-days: 90

      - name: Record the rollback reference
        env:
          PARKIO_MANIFEST_ARTIFACT: deploy-manifest-live-${{ needs.build-images.outputs.git_sha }}
        run: |
          set -euo pipefail
          # Reached only when the deploy succeeded. A later rollback run downloads this run's
          # manifest by run id and checks it against this SHA-256 (U13 CL-F06).
          shopt -s nullglob
          manifests=(deploy-artifacts/deploy-*.json)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error::expected one deploy-*.json for the rollback reference, found ${#manifests[@]}"
            exit 1
          fi
          sha256="$(sha256sum "${manifests[0]}" | cut -d' ' -f1)"
          {
            echo "### Rollback reference"
            echo "manifest_artifact for a later rollback: \`${GITHUB_RUN_ID}/${PARKIO_MANIFEST_ARTIFACT}@${sha256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Rollback (self-hosted beta)
    if: ${{ github.event.inputs.action == 'rollback' }}
    runs-on: [self-hosted, parkio-beta]
    timeout-minutes: 60
    # actions: read lets the job download the manifest artifact of the earlier deploy run.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The manifest is an artifact of the earlier deploy run, which download-artifact can only
      # reach with that run's id and a token (U13 CL-F06). The run must be a successful
      # workflow_dispatch of this workflow on the same branch whose deploy job succeeded, holding
      # exactly that artifact.
      - name: Resolve the deploy run that holds the manifest
        id: manifest_run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARKIO_MANIFEST_REFERENCE: ${{ github.event.inputs.manifest_artifact }}
        run: |
          ./scripts/ci/resolve-rollback-manifest-run.sh --repo "$GITHUB_REPOSITORY" \
            --workflow hosted-beta-deploy.yml --branch "$GITHUB_REF_NAME" \
            --deploy-job "Deploy (self-hosted beta)" --reference "$PARKIO_MANIFEST_REFERENCE"

      # By the id the resolver checked, not by name. With merge-multiple the files land directly
      # in path, as a download by name does.
      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.manifest_run.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ steps.manifest_run.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: deploy-artifacts/

      - name: Verify the rollback manifest
        id: manifest
        env:
          PARKIO_MANIFEST_GIT_SHA: ${{ steps.manifest_run.outputs.head_sha }}
          PARKIO_MANIFEST_SHA256: ${{ steps.manifest_run.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          # A reference with @SHA256 pins the manifest's content.
          if [ -n "$PARKIO_MANIFEST_SHA256" ]; then set -- --sha256 "$PARKIO_MANIFEST_SHA256"; fi
          ./scripts/ci/verify-rollback-manifest.sh --dir deploy-artifacts --git-sha "$PARKIO_MANIFEST_GIT_SHA" "$@"

      - name: Rollback
        env:
          PARKIO_ENV_FILE: docker/.env
          PARKIO_DEPLOY_OPERATOR: github-actions
          PARKIO_GATEWAY_URL: http://127.0.0.1:8080
          PARKIO_SMOKE_EXPECT_DIRECT_BLOCKED: "1"
          # Seeded real-e2e account password for the smoke (secret store -> repository secret; no default
          # since 2026-10-08). Empty -> the wrapper refuses before anything is built or started.
          PARKIO_REAL_USER_PASSWORD: ${{ secrets.HOSTED_BETA_REAL_USER_PASSWORD }}
          PARKIO_VERIFIED_MANIFEST: ${{ steps.manifest.outputs.manifest }}
        run: |
          set -euo pipefail
          chmod +x scripts/rollback-hosted-beta.sh scripts/smoke-hosted-beta.sh
          ./scripts/rollback-hosted-beta.sh --manifest "$PARKIO_VERIFIED_MANIFEST"