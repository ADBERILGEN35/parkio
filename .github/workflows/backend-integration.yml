# Testcontainers integration tests (the distributed guarantees that H2/mocks
# cannot prove: outbox relay + DLQ, inbox dedup, Kafka transport, PostGIS nearby
# search, MinIO presigned URLs). These spin up PostgreSQL/Kafka/MinIO containers,
# so they are kept OUT of the fast PR gate (`backend-ci.yml`).
#
# When it runs:
#  - pull_request: always starts so "Backend integration summary" can be required;
#    Testcontainers run only when backend/build/docker paths change (#418 / N-09c).
#  - workflow_dispatch: on demand, and nightly from master's
#    scheduled-restore-drills.yml dispatcher (`--ref api`). GitHub only
#    evaluates `on.schedule` on the default branch, so this workflow must not
#    carry its own schedule on api (Z-04 / #450).
#
# `-Pparkio.integrationTest.requireDocker=true` makes the run FAIL FAST if the
# runner has no Docker daemon, instead of silently skipping every suite and
# reporting a false-green build. ubuntu-latest ships Docker out of the box.
# With that flag the tasks also always execute: no build-cache restore and no
# up-to-date skip can stand in for a run (checked after the run below).

name: Backend integration tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A new push to a PR cancels the previous (still-running) integration run.
concurrency:
  group: backend-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect backend paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # ManagedParkingPublicCensusIT runs scripts/azure/sql/managed-parking-public-census.sql (CI audit N6).
          PATH_REGEX: '^(services/|platform/|tools/|buildSrc/|gradle/|gradlew(\.bat)?$|build\.gradle|settings\.gradle|gradle\.properties$|scripts/azure/sql/|docker/|scripts/ci/check-integration-test-not-reused\.sh|\.github/workflows/backend-integration\.yml|scripts/ci/detect_path_scope\.sh|scripts/ci/path_filtered_summary_gate\.sh)'
        run: bash scripts/ci/detect_path_scope.sh

  integration-test:
    name: Integration tests (Testcontainers)
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'api' || github.sha }}

      - name: Fail closed on fork PRs needing private MinIO
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork PRs cannot read private ghcr.io/adberilgen35/parkio/{minio,mc} with GITHUB_TOKEN."
          echo "This is fail-closed, not a skip. Open the change from ADBERILGEN35/parkio."
          exit 1

      - name: Log in to GHCR for private MinIO pulls
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Testcontainers integration tests
        run: ./gradlew --no-daemon integrationTest -Pparkio.integrationTest.requireDocker=true --max-workers=1

      # Test evidence for the CI gate (scripts/ci/ci_gate.py): a green run that ran no tests fails there.
      - name: Integration test evidence
        run: python3 scripts/ci/junit_summary.py --label "Integration test" --task integrationTest

      # A cached or up-to-date result must not stand in for a run (#205 review B1). One module of
      # each integrationTest definition (the buildSrc convention, the platform's own and the
      # dlt-redrive tool's own) is run again with a docker stub that always fails; the task must
      # execute and fail closed. Without the flag, caching must still work (platform, last).
      - name: Integration tests are never reused without running
        run: |
          set -euo pipefail
          ./scripts/ci/check-integration-test-not-reused.sh --module :services:analytics-service
          ./scripts/ci/check-integration-test-not-reused.sh --module :platform:parkio-platform
          ./scripts/ci/check-integration-test-not-reused.sh --module :tools:dlt-redrive
          ./scripts/ci/check-integration-test-not-reused.sh --module :platform:parkio-platform --without-flag

      - name: Upload integration test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  # Always reports on every PR so it can become a required check after #368's
  # scheduled streak without blocking frontend-/docs-only PRs (#418). Failures
  # in the Testcontainers job propagate; intentional path skips are success.
  summary:
    name: Backend integration summary
    if: always()
    needs: [detect, integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail summary if a required gate failed
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          RUN: ${{ needs.detect.outputs.run }}
          WORK_RESULTS: ${{ needs.integration-test.result }}
        run: bash scripts/ci/path_filtered_summary_gate.sh
