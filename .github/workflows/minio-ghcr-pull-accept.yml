# Fresh-runner pull of the private linux/amd64 MinIO pins using the same
# authentication model as stack workflows: GITHUB_TOKEN + packages:read.
# Does not publish, deploy, or restore production data.
name: MinIO GHCR pull accept

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/minio-ghcr-pull-accept.yml"
      - "scripts/ci/assert-minio-image-pins.sh"
      - "docker/docker-compose.yml"
      - "docker/.env.example"

permissions:
  contents: read
  packages: read

concurrency:
  group: minio-ghcr-pull-accept-${{ github.ref }}
  cancel-in-progress: true

env:
  MINIO_IMAGE: ghcr.io/adberilgen35/parkio/minio@sha256:efba309ba4dc89e48f37304db52a0b854c0e701ba944ca02205c4e292c1a756c
  MINIO_MC_IMAGE: ghcr.io/adberilgen35/parkio/mc@sha256:456b1e641897329fc9491f9bc8b31df351d728af9a328bf5653707af62d0d6bf

jobs:
  pull-accept:
    name: Fresh-runner GHCR MinIO pull
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail closed on fork PRs needing private MinIO
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork PRs cannot read private ghcr.io/adberilgen35/parkio/{minio,mc} with GITHUB_TOKEN."
          echo "This is fail-closed, not a skip. Open the change from ADBERILGEN35/parkio."
          exit 1

      - name: Log in to GHCR for private MinIO pulls
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert pin parity
        run: |
          chmod +x scripts/ci/assert-minio-image-pins.sh
          ./scripts/ci/assert-minio-image-pins.sh

      - name: Pull and verify destination platform manifests
        run: |
          set -euo pipefail
          docker pull "$MINIO_IMAGE"
          docker pull "$MINIO_MC_IMAGE"
          server_id="$(docker image inspect --format '{{index .RepoDigests 0}}' "$MINIO_IMAGE")"
          mc_id="$(docker image inspect --format '{{index .RepoDigests 0}}' "$MINIO_MC_IMAGE")"
          echo "server digest ref: $server_id"
          echo "mc digest ref: $mc_id"
          echo "$server_id" | grep -F "sha256:efba309ba4dc89e48f37304db52a0b854c0e701ba944ca02205c4e292c1a756c"
          echo "$mc_id" | grep -F "sha256:456b1e641897329fc9491f9bc8b31df351d728af9a328bf5653707af62d0d6bf"
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$MINIO_IMAGE" | grep -x 'linux/amd64'
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$MINIO_MC_IMAGE" | grep -x 'linux/amd64'
