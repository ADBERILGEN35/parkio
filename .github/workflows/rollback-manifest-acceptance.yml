name: Rollback manifest acceptance

# U13 CL-F06: a rollback runs as a new workflow run and must fetch the manifest of an earlier
# deploy run. This workflow fetches a real one the way both deploy workflows' rollback jobs do,
# and checks that wrong references fail closed. Nothing deploys, and the manifest's contents are
# not printed.
#
# Rollback compatibility-guard acceptance (CL-F12 F-INV-2; owner decision 2026-10-05, "Assert
# correct refusal"). An invite-production rollback refuses a target whose compose file list differs
# from the one it would render. The job dry-runs that guard twice:
#   - against a synthetic deploy manifest with this checkout's list, which must succeed;
#   - against the manifest of the newest qualifying deploy run (by creation time). A compatible
#     list must dry-run successfully; an incompatible one must be refused by the guard itself,
#     naming the files, before anything is written. The job then states that a rollback to that
#     deploy run is NOT currently possible.
# This is not operational rollback acceptance. A green result does not mean that a rollback to the
# latest deployed release currently works. That acceptance remains BLOCKED until an authorized
# compatible release exists.

on:
  pull_request:
    paths:
      - "scripts/ci/resolve-rollback-manifest-run.sh"
      - "scripts/ci/verify-rollback-manifest.sh"
      - "scripts/ci/test-rollback-manifest-retrieval.sh"
      - "scripts/ci/test_deploy_workflow_guards.py"
      - "scripts/rollback-hosted-beta.sh"
      - "scripts/rollback-invite-production.sh"
      - "scripts/lib/deploy-common.sh"
      - "scripts/lib/runtime-release.sh"
      - "scripts/ci/rollback-compatibility-guard-acceptance.sh"
      - "scripts/ci/test-rollback-compatibility-guard-acceptance.sh"
      - "scripts/ci/write-synthetic-invite-deploy-manifest.sh"
      - "scripts/ci/select-rollback-acceptance-source.py"
      - "scripts/ci/test_select_rollback_acceptance_source.py"
      - "scripts/test-invite-rollback-compose-files.sh"
      - ".github/workflows/rollback-manifest-acceptance.yml"
      - ".github/workflows/invite-production-deploy.yml"
      - ".github/workflows/hosted-beta-deploy.yml"
  workflow_dispatch:

concurrency:
  # Superseded pull request runs are cancelled; other events get a unique group,
  # so push and dispatch runs are never cancelled or serialized by this.
  group: rollback-manifest-acceptance-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  acceptance:
    name: Rollback compatibility-guard acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests (fake GitHub API, synthetic manifests)
        run: ./scripts/ci/test-rollback-manifest-retrieval.sh

      - name: Record what this check is (rollback compatibility-guard acceptance)
        run: |
          {
            echo "## Rollback compatibility-guard acceptance"
            echo
            echo "This checks the invite-production rollback's compose file-list guard (F-INV-2) against a synthetic"
            echo "compatible manifest and the newest qualifying deploy run's manifest. It performs no rollback."
            echo
            echo "> [!IMPORTANT]"
            echo "> A green result does **not** mean that a rollback to the latest deployed release currently works."
            echo "> Operational rollback acceptance remains **BLOCKED** until an authorized compatible release exists."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback compatibility-guard unit tests (compose file list; both acceptance branches)
        run: |
          set -euo pipefail
          bash scripts/test-invite-rollback-compose-files.sh
          bash scripts/ci/test-rollback-compatibility-guard-acceptance.sh
          python3 scripts/ci/test_select_rollback_acceptance_source.py

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Deploy workflow guards (no operator text as shell source, allowlisted uploads)
        run: python3 scripts/ci/test_deploy_workflow_guards.py

      # The newest qualifying deploy run is the source: a run whose deploy job succeeded and which
      # holds exactly one unexpired manifest, chosen by created_at (#289 review R2-F1). A newer run
      # whose listing is anything else fails the step instead of being passed over. A build-only run
      # (deploy skipped) that still holds its manifest, if one exists, must be refused.
      #
      # Manifest artifacts are kept 90 days, the maximum for a public repository. This check, like
      # a rollback itself, can therefore only reach an api deploy from that window (#204 review
      # N5). The summary records when the source manifest expires and warns two weeks ahead.
      - name: Find the newest qualifying invite-production deploy run (deploy succeeded, one manifest)
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/select-rollback-acceptance-source.py

      - name: Resolve that run as the rollback job does
        id: resolved
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARKIO_MANIFEST_REFERENCE: ${{ steps.source.outputs.reference }}
        run: |
          ./scripts/ci/resolve-rollback-manifest-run.sh --repo "$GITHUB_REPOSITORY" \
            --workflow invite-production-deploy.yml --branch api --deploy-job "Deploy invite-production" \
            --reference "$PARKIO_MANIFEST_REFERENCE"

      - name: Wrong references fail closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          ARTIFACT: ${{ steps.source.outputs.artifact }}
          BUILD_ONLY_REFERENCE: ${{ steps.source.outputs.build_only_reference }}
        run: |
          set -euo pipefail
          refused() { # description, reference
            # The step shell runs with errexit, so the refusal's exit code is caught here.
            if ./scripts/ci/resolve-rollback-manifest-run.sh --repo "$GITHUB_REPOSITORY" \
              --workflow invite-production-deploy.yml --branch api --deploy-job "Deploy invite-production" \
              --reference "$2"; then rc=0; else rc=$?; fi
            if [ "$rc" -ne 3 ]; then echo "::error::$1 was not refused (exit $rc)"; exit 1; fi
            echo "refused as expected: $1"
          }
          refused "this run (another workflow, pull_request)" "$GITHUB_RUN_ID/$ARTIFACT"
          refused "a run id that does not exist" "1/$ARTIFACT"
          refused "an artifact name without the run id" "$ARTIFACT"
          refused "an artifact the run does not hold" "$RUN_ID/invite-production-manifest-0000000000000000000000000000000000000000"
          refused "a malformed SHA-256 pin" "$RUN_ID/$ARTIFACT@not-a-sha256"
          if [ -n "$BUILD_ONLY_REFERENCE" ]; then
            refused "a build-only run, whose deploy was skipped" "$BUILD_ONLY_REFERENCE"
          else
            echo "::notice::No build-only run holds an unexpired manifest; the unit tests cover that refusal."
          fi

      - name: Download the manifest from that run by artifact id
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.resolved.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ steps.resolved.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: deploy-artifacts/invite-production

      - name: Verify the manifest
        id: manifest
        env:
          PARKIO_MANIFEST_GIT_SHA: ${{ steps.resolved.outputs.head_sha }}
        run: |
          ./scripts/ci/verify-rollback-manifest.sh --dir deploy-artifacts/invite-production \
            --profile invite-production --git-sha "$PARKIO_MANIFEST_GIT_SHA"

      # A deploy job's summary prints RUN_ID/ARTIFACT@SHA256. Pinned that way, the rollback must
      # accept this manifest and refuse any other content.
      - name: A pinned reference accepts its manifest and refuses other content
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolved.outputs.run_id }}
          ARTIFACT: ${{ steps.resolved.outputs.artifact }}
          PARKIO_MANIFEST_GIT_SHA: ${{ steps.resolved.outputs.head_sha }}
          PARKIO_MANIFEST_SHA256: ${{ steps.manifest.outputs.sha256 }}
        run: |
          set -euo pipefail
          pinned="$(GITHUB_OUTPUT='' ./scripts/ci/resolve-rollback-manifest-run.sh --repo "$GITHUB_REPOSITORY" \
            --workflow invite-production-deploy.yml --branch api --deploy-job "Deploy invite-production" \
            --reference "$RUN_ID/$ARTIFACT@$PARKIO_MANIFEST_SHA256")"
          grep -qx "manifest_sha256=$PARKIO_MANIFEST_SHA256" <<<"$pinned"
          verify() { # expected sha256
            GITHUB_OUTPUT='' ./scripts/ci/verify-rollback-manifest.sh --dir deploy-artifacts/invite-production \
              --profile invite-production --git-sha "$PARKIO_MANIFEST_GIT_SHA" --sha256 "$1" > /dev/null
          }
          verify "$PARKIO_MANIFEST_SHA256"
          other="$(printf '%s' "$PARKIO_MANIFEST_SHA256" | tr '0-9a-f' '1-9a-f0')"
          if verify "$other"; then rc=0; else rc=$?; fi
          if [ "$rc" -ne 3 ]; then echo "::error::another SHA-256 was not refused (exit $rc)"; exit 1; fi
          echo "the pinned reference accepts its manifest and refuses other content"

      - name: "Rollback compatibility-guard acceptance: synthetic compatible manifest (positive path)"
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/compatibility-guard"
          mkdir -p "$work"
          bash scripts/ci/write-synthetic-invite-deploy-manifest.sh \
            --env-file docker/.env.invite-production.example --out "$work/synthetic-deploy.json"
          bash scripts/ci/rollback-compatibility-guard-acceptance.sh --manifest "$work/synthetic-deploy.json" \
            --env-template docker/.env.invite-production.example --work-dir "$work/synthetic" \
            --expect compatible --label "a synthetic deploy with this checkout's compose file list" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: "Rollback compatibility-guard acceptance: the newest qualifying deploy run's manifest"
        env:
          PARKIO_VERIFIED_MANIFEST: ${{ steps.manifest.outputs.manifest }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.run_head_sha }}
          SOURCE_CREATED_AT: ${{ steps.source.outputs.run_created_at }}
        run: |
          set -euo pipefail
          label="the newest qualifying deploy run $SOURCE_RUN_ID (commit ${SOURCE_HEAD_SHA:0:12}, created $SOURCE_CREATED_AT)"
          bash scripts/ci/rollback-compatibility-guard-acceptance.sh --manifest "$PARKIO_VERIFIED_MANIFEST" \
            --env-template docker/.env.invite-production.example --work-dir "$RUNNER_TEMP/compatibility-guard/newest" \
            --label "$label" --summary "$GITHUB_STEP_SUMMARY"
