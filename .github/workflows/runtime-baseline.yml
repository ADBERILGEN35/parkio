name: Runtime baseline (WP-06.2)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Baseline profile
        type: choice
        options:
          - SMOKE
          - BASELINE_CI
          - STAGING_BASELINE
        default: SMOKE
  schedule:
    - cron: "12 6 * * 4"

permissions:
  contents: read

concurrency:
  group: runtime-baseline-wp062
  cancel-in-progress: true

jobs:
  baseline-metadata:
    name: Record bounded baseline profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARKIO_ENVIRONMENT_TYPE: CI_EPHEMERAL
      PARKIO_STAGING_ISOLATION_MARKER: wp062-baseline-${{ github.run_id }}
      PARKIO_BASELINE_PROFILE: ${{ github.event.inputs.profile || 'SMOKE' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'api' || github.sha }}
      - name: Collect baseline metadata
        run: |
          chmod +x scripts/staging/collect-runtime-baseline.sh
          export PARKIO_EVIDENCE_DIR="build/operational-evidence/baseline-${{ github.run_id }}"
          mkdir -p "$PARKIO_EVIDENCE_DIR"
          ./scripts/staging/collect-runtime-baseline.sh
      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-baseline-${{ github.run_id }}
          path: build/operational-evidence/
          if-no-files-found: ignore
