# Backend quality gate: every PR (and every push to api/master) must compile and
# pass the unit-test suite (`./gradlew build` excludes the `integration` tag,
# so this job never needs Docker and stays fast).
#
# Testcontainers integration tests live in a SEPARATE workflow
# (`backend-integration.yml`): they run on PRs that touch backend/build/docker
# paths, nightly, and on demand. Keeping them out of this gate keeps PR builds
# fast and Docker-independent for docs-/frontend-only changes.

name: Backend CI

on:
  pull_request:
  push:
    branches: [api, master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the previous (still-running) run — mirrors the other gates.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # This job's own Gradle dependency cache (#608). setup-java's `cache: gradle` key names no job,
      # so all its workflows shared one entry. The SBOM job (supply-chain.yml) saved that entry without
      # the test classpaths, and setup-java never saves again on a hit. This job therefore downloaded its
      # test dependencies on every run, and Maven Central answered some of those downloads with 429 or
      # 403. After a build change, restore-keys start from the latest entry, so only new artifacts are
      # downloaded. The local build cache (build-cache-1) stays out: no task output, and so no test
      # result, carries over from one run to the next.
      # Every run restores; only api saves (the step after the build, #638). actions/cache saved on pull
      # requests too, and each pull request that changed a build file added about 1 GB to the
      # repository's 10 GB cache budget. The service image builds read this entry as well, read-only
      # (scripts/ci/gradle_ro_dep_cache.py).
      - name: Restore Gradle dependencies
        id: gradle-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/*
            !~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper
          key: gradle-deps-backend-ci-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-backend-ci-${{ runner.os }}-

      # Supply-chain: fail the build if the committed Gradle wrapper jar is not an
      # unmodified official Gradle distribution (cheap, runs on every PR).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and run unit tests
        run: ./gradlew --no-daemon build

      # Test evidence for the CI gate (scripts/ci/ci_gate.py): a green build that ran no tests fails there.
      - name: Unit test evidence
        run: python3 scripts/ci/junit_summary.py --label "Unit test" --task test

      # Only api itself (its pushes and dispatches) saves, after a green build, and only when the exact
      # key missed: pull requests restore api's entry and never write one.
      - name: Save Gradle dependencies
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/api' && steps.gradle-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/*
            !~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper
          key: ${{ steps.gradle-deps.outputs.cache-primary-key }}

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
