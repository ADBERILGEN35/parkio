name: Restore replay harness

# U02: every erasure participant's restore-replay tests and the auth coordinator's, against real
# disposable dependencies (PostgreSQL, Kafka, and MinIO for media), with the executed count per
# participant in the job summary. Isolated CI resources only; nothing deploys or restores. This
# proves each service on its own, not an end-to-end replay through a restore entry point.
#
# The media class pulls the private ghcr.io MinIO image, as backend-integration.yml does, so a fork
# PR fails closed instead of skipping.
#
# Restore replay depends on more than the erasure classes: relays, routing, application.yml,
# migrations and the build. So the harness runs for every change to the services, the build logic
# or Gradle (the backend paths of backend-integration.yml), and again after the merge into api.

on:
  pull_request:
    paths:
      - "services/**"
      - "buildSrc/**"
      - "gradle/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - "scripts/ci/restore-replay-harness.sh"
      - "scripts/ci/test-restore-replay-harness.sh"
      - ".github/workflows/restore-replay-harness.yml"
  push:
    branches: [api]
    paths:
      - "services/**"
      - "buildSrc/**"
      - "gradle/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - "scripts/ci/restore-replay-harness.sh"
      - "scripts/ci/test-restore-replay-harness.sh"
      - ".github/workflows/restore-replay-harness.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A newer push to a PR cancels its older run (#205 review N-R1). Every other run, a push to api in
# particular, gets a group of its own commit: GitHub keeps at most one pending run per group and
# replaces it when another queues, so a shared group could still drop a merge's run (#208 N4).
concurrency:
  group: restore-replay-harness-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Restore replay per participant (real PostgreSQL, Kafka, MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harness unit tests (fake Gradle, synthetic XML)
        run: ./scripts/ci/test-restore-replay-harness.sh

      - name: Fail closed on fork PRs needing private MinIO
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork PRs cannot read private ghcr.io/adberilgen35/parkio/minio with GITHUB_TOKEN."
          echo "This is fail-closed, not a skip. Open the change from ADBERILGEN35/parkio."
          exit 1

      - name: Log in to GHCR for private MinIO pulls
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run the harness
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          rc=0
          ./scripts/ci/restore-replay-harness.sh --summary restore-replay-summary.md || rc=$?
          if [ -f restore-replay-summary.md ]; then cat restore-replay-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"

      - name: Keep the summary and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-replay-harness
          path: |
            restore-replay-summary.md
            services/*/build/test-results/integrationTest/TEST-*.xml
          if-no-files-found: warn
          retention-days: 30
