# Production release workflow (P1.6).
#
# Builds, verifies, and assembles a signed-ready, SBOM-bearing release — but NEVER
# auto-publishes. The GitHub Release is created as a DRAFT, and image publish + signing
# are gated, so a human must explicitly approve before anything becomes public.
#
# Trigger:
#   * push of a semver tag  v*   (e.g. v1.2.3)  — the normal path, or
#   * workflow_dispatch with an explicit `version` input (for dry runs / re-cuts).
#
# Pipeline: detect version -> build + unit + integration tests -> SBOMs -> build images
# (OCI-labelled, reproducible tags) -> image SBOMs -> (gated) push + cosign keyless sign +
# attest -> DRAFT GitHub Release with SBOMs + provenance attached.
#
# Nothing here needs a long-lived secret. Image publish/sign use GHCR + the built-in
# GITHUB_TOKEN + OIDC, and stay OFF until vars.PUBLISH_IMAGES == 'true'.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3). Used when run manually."
        required: true
        type: string
      publish_images:
        description: "Publish images to GHCR. Requires running from a tag ref. Overrides vars.PUBLISH_IMAGES."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.64.1
  # build-push-action otherwise uploads a multi-MB `*.dockerbuild` build record per
  # image. Those records are not release evidence, and downloading them alongside the
  # SBOMs is what made the release job fail on artifact-service hiccups.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Version detection — single source of truth for every downstream job.
  # ---------------------------------------------------------------------------
  version:
    name: Detect version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.detect.outputs.version }}
      created: ${{ steps.detect.outputs.created }}
      sha: ${{ steps.detect.outputs.sha }}
      publish: ${{ steps.detect.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version + build timestamp
        id: detect
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish_images }}
          VAR_PUBLISH: ${{ vars.PUBLISH_IMAGES }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${DISPATCH_VERSION}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          if ! echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$version' is not a valid semver tag (vMAJOR.MINOR.PATCH)."
            exit 1
          fi

          publish=false
          if [ "${DISPATCH_PUBLISH:-false}" = "true" ] || [ "${VAR_PUBLISH:-}" = "true" ]; then
            publish=true
          fi

          # Source integrity: a release must describe an immutable tag, and the
          # checkout must be exactly that tag's commit with nothing uncommitted.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            if [ "$publish" = "true" ]; then
              echo "::error::Image publication requires running from refs/tags/<version>; got ${GITHUB_REF}."
              exit 1
            fi
            echo "::warning::Not a tag ref (${GITHUB_REF}); running in build-only mode."
          else
            peeled="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
            if [ "$peeled" != "${GITHUB_SHA}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} peels to $peeled but the checkout is ${GITHUB_SHA}."
              exit 1
            fi
            if [ "${GITHUB_REF_NAME}" != "$version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match release version $version."
              exit 1
            fi
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty; refusing to build a release from it."
            git status --porcelain
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (commit ${GITHUB_SHA}, publish=$publish)"

  # ---------------------------------------------------------------------------
  # 2. Verify — the same gates as CI, but all in the release lineage.
  # ---------------------------------------------------------------------------
  verify:
    name: Build, unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Supply-chain: verify the wrapper jar is an unmodified official Gradle distribution.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build + unit tests
        run: ./gradlew --no-daemon build -PparkioVersion=${{ needs.version.outputs.version }}

      - name: Integration tests (Testcontainers)
        run: ./gradlew --no-daemon integrationTest -Pparkio.integrationTest.requireDocker=true -PparkioVersion=${{ needs.version.outputs.version }}

  # ---------------------------------------------------------------------------
  # 3. SBOMs — release-pinned, attached to the GitHub Release.
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOMs (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: version
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Backend SBOMs (CycloneDX / Gradle)
        run: ./gradlew --no-daemon --no-configuration-cache cyclonedxBom -PparkioVersion=${{ needs.version.outputs.version }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Frontend SBOM (CycloneDX / Trivy)
        run: |
          set -euo pipefail
          mkdir -p sbom
          for f in services/*/build/reports/sbom/bom.json; do
            svc="$(echo "$f" | sed -E 's#services/([^/]+)/.*#\1#')"
            cp "$f" "sbom/${svc}.cdx.json"
          done
          docker run --rm -v "${GITHUB_WORKSPACE}:/work" -w /work \
            "${TRIVY_IMAGE}" fs frontend --format cyclonedx --output sbom/frontend.cdx.json
          ls -1 sbom

      - name: Upload release SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: release-sboms
          path: sbom/*.cdx.json
          retention-days: 90

      - name: Attest SBOMs
        if: ${{ vars.ATTESTATIONS_ENABLED == 'true' }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "sbom/*.cdx.json"

  # ---------------------------------------------------------------------------
  # 4. Images — OCI-labelled, reproducible tags, image SBOM, optional sign/push.
  #    Build always (proves the images build at the release commit). Push + sign
  #    only when vars.PUBLISH_IMAGES == 'true' (keyless cosign via OIDC, GHCR).
  # ---------------------------------------------------------------------------
  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [version, verify]
    # WEB_MAPTILER_KEY (and any future release build secrets) live on the `release`
    # environment. Without this, secrets.WEB_MAPTILER_KEY is empty for the web image
    # even when the operator has configured the environment secret correctly.
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      # `web` is a first-class hosted-beta image (docker/docker-compose.images.yml
      # deploys parkio/web next to the services), so the release must produce it
      # from the same tag as the backend images.
      matrix:
        include:
          - service: ai-validation-service
            dockerfile: services/ai-validation-service/Dockerfile
          - service: analytics-service
            dockerfile: services/analytics-service/Dockerfile
          - service: auth-service
            dockerfile: services/auth-service/Dockerfile
          - service: gamification-service
            dockerfile: services/gamification-service/Dockerfile
          - service: gateway-service
            dockerfile: services/gateway-service/Dockerfile
          - service: media-service
            dockerfile: services/media-service/Dockerfile
          - service: moderation-service
            dockerfile: services/moderation-service/Dockerfile
          - service: notification-service
            dockerfile: services/notification-service/Dockerfile
          - service: parking-service
            dockerfile: services/parking-service/Dockerfile
          - service: user-service
            dockerfile: services/user-service/Dockerfile
          - service: web
            dockerfile: frontend/apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Second integrity gate: the image must come from the approved commit, and
      # the tree it is built from must be pristine.
      - name: Verify release source integrity
        env:
          EXPECTED_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out commit $head does not match the release commit $EXPECTED_SHA."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty; refusing to build ${{ matrix.service }}."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            peeled="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
            if [ "$peeled" != "$EXPECTED_SHA" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} peels to $peeled, expected $EXPECTED_SHA."
              exit 1
            fi
          fi
          echo "Building ${{ matrix.service }} from $head (${GITHUB_REF})."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reproducible, immutable tags: the semver version AND the full commit SHA. No
      # bare `latest` from the release flow (latest is a mutable convenience, set
      # separately/manually only after a release is verified — see rollback docs).
      - name: Compute image refs
        id: refs
        run: |
          set -euo pipefail
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          base="${REGISTRY}/${repo}/${{ matrix.service }}"
          echo "image=${base}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${base}:${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${base}:sha-${{ needs.version.outputs.sha }}" >> "$GITHUB_OUTPUT"

      # Fail before the build (and therefore long before any push) when a production-shaped
      # web build is missing a required public build-time value. rc5 shipped a web image
      # with an empty VITE_MAPTILER_KEY because the build-arg was passed *conditionally*:
      # an empty secret silently dropped the arg, the bundle baked "", and config/env.ts
      # threw during module evaluation, white-screening every route while nginx still
      # answered 200. The value itself is never printed - only its presence.
      - name: Gate required web build configuration
        if: ${{ matrix.service == 'web' }}
        env:
          WEB_APP_ENV: ${{ vars.WEB_APP_ENV || 'hosted-beta' }}
          WEB_MAPTILER_KEY: ${{ secrets.WEB_MAPTILER_KEY }}
          WEB_API_BASE_URL: ${{ vars.WEB_API_BASE_URL || 'https://api.parkio.dev/api/v1' }}
        run: |
          set -euo pipefail
          missing=0
          case "$WEB_APP_ENV" in
            hosted-beta|invite-production|production)
              if [ -z "${WEB_API_BASE_URL}" ]; then
                echo "::error::WEB_API_BASE_URL repository variable is empty but VITE_APP_ENV=$WEB_APP_ENV requires it."
                missing=1
              fi
              if [ -z "${WEB_MAPTILER_KEY}" ]; then
                echo "::error::WEB_MAPTILER_KEY is empty but VITE_APP_ENV=$WEB_APP_ENV requires it. Set the release-environment (or repository) secret WEB_MAPTILER_KEY before cutting the release."
                missing=1
              fi
              ;;
            *)
              echo "VITE_APP_ENV=$WEB_APP_ENV is not production-shaped; required-value gate not applicable."
              ;;
          esac
          [ "$missing" -eq 0 ] || exit 1
          echo "Required web build configuration present for VITE_APP_ENV=$WEB_APP_ENV."

      - name: Build image (OCI-labelled)
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ needs.version.outputs.publish == 'true' }}
          load: ${{ needs.version.outputs.publish != 'true' }}
          tags: |
            ${{ steps.refs.outputs.tag_version }}
            ${{ steps.refs.outputs.tag_sha }}
          # The web image bakes its public runtime config at build time; those values
          # are public routing/feature config, never secret carriers. They are passed
          # only for `web` so the service builds stay free of unused build-args.
          #
          # VITE_MAPTILER_KEY is stored as an Actions *secret* only to keep it out of the
          # repository - it is NOT a server secret. Any Vite VITE_* value is embedded
          # verbatim in the public JS bundle that every browser downloads, so it cannot be
          # kept confidential. It must be protected provider-side with MapTiler
          # domain/origin allow-listing (app.parkio.dev and any preview origins), not by
          # secrecy. It is passed unconditionally: an empty value must reach the Dockerfile
          # so the build fails loudly instead of baking "" (defect I11).
          build-args: |
            IMAGE_VERSION=${{ needs.version.outputs.version }}
            IMAGE_REVISION=${{ needs.version.outputs.sha }}
            IMAGE_CREATED=${{ needs.version.outputs.created }}
            ${{ matrix.service == 'web' && format('VITE_API_BASE_URL={0}', vars.WEB_API_BASE_URL || 'https://api.parkio.dev/api/v1') || '' }}
            ${{ matrix.service == 'web' && format('VITE_APP_ENV={0}', vars.WEB_APP_ENV || 'hosted-beta') || '' }}
            ${{ matrix.service == 'web' && format('VITE_MAPTILER_KEY={0}', secrets.WEB_MAPTILER_KEY) || '' }}
          provenance: false # we attach our own attestations below

      # ---- Registry evidence: never trust the runner-local digest alone ----
      - name: Verify published image in registry
        id: registry
        if: ${{ needs.version.outputs.publish == 'true' }}
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
          TAG_VERSION: ${{ steps.refs.outputs.tag_version }}
          TAG_SHA: ${{ steps.refs.outputs.tag_sha }}
          EXPECTED_SHA: ${{ needs.version.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          version_digest="$(docker buildx imagetools inspect "$TAG_VERSION" --format '{{.Manifest.Digest}}')"
          sha_digest="$(docker buildx imagetools inspect "$TAG_SHA" --format '{{.Manifest.Digest}}')"
          if [ "$version_digest" != "$sha_digest" ]; then
            echo "::error::$TAG_VERSION ($version_digest) and $TAG_SHA ($sha_digest) resolve to different digests."
            exit 1
          fi

          # Pull by digest and read the labels back off the registry copy.
          docker pull "${IMAGE}@${version_digest}" >/dev/null
          revision="$(docker image inspect "${IMAGE}@${version_digest}" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          labelled_version="$(docker image inspect "${IMAGE}@${version_digest}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          arch="$(docker image inspect "${IMAGE}@${version_digest}" --format '{{.Os}}/{{.Architecture}}')"
          if [ "$revision" != "$EXPECTED_SHA" ]; then
            echo "::error::Image revision label '$revision' != release commit $EXPECTED_SHA."
            exit 1
          fi
          if [ "$labelled_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::Image version label '$labelled_version' != $EXPECTED_VERSION."
            exit 1
          fi

          {
            echo "### ${{ matrix.service }}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| repository | \`${IMAGE}\` |"
            echo "| tags | \`${EXPECTED_VERSION}\`, \`sha-${EXPECTED_SHA}\` |"
            echo "| digest | \`${version_digest}\` |"
            echo "| revision label | \`${revision}\` |"
            echo "| platform | \`${arch}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${version_digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}@${version_digest}" >> "$GITHUB_OUTPUT"

      - name: Install web image-smoke dependencies
        if: ${{ matrix.service == 'web' }}
        working-directory: frontend
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @parkio/web exec playwright install --with-deps chromium

      - name: Test web artifact and image-smoke gates
        if: ${{ matrix.service == 'web' }}
        working-directory: frontend/apps/web
        run: |
          set -euo pipefail
          node --test scripts/validate-build-env.test.mjs scripts/verify-bundle-env.test.mjs scripts/smoke-image.test.mjs

      # ---- Web image smoke: prove the SPA MOUNTS, not just that nginx answers ----
      # rc5's blank-page image satisfied every HTTP-level check (index.html and every asset
      # returned 200). This runs the real image and fails if #root never receives children
      # or a module-evaluation error is thrown. It also re-asserts the served bundle's
      # required public values, reporting only PRESENT/EMPTY/MISSING - never a value.
      #
      # Runs against the digest-pulled copy when publishing, else the `load`ed local tag.
      # The in-Dockerfile gates already make an invalid image unbuildable; this is the
      # behavioural backstop that would have caught rc5 even if those gates were bypassed.
      - name: Smoke-test web image
        if: ${{ matrix.service == 'web' }}
        env:
          DIGEST_REF: ${{ steps.registry.outputs.ref }}
          LOCAL_REF: ${{ steps.refs.outputs.tag_version }}
          WEB_APP_ENV: ${{ vars.WEB_APP_ENV || 'hosted-beta' }}
        working-directory: frontend/apps/web
        run: |
          set -euo pipefail
          ref="${DIGEST_REF:-$LOCAL_REF}"
          echo "Smoke-testing $ref"
          node scripts/smoke-image.mjs --image "$ref" --app-env "$WEB_APP_ENV"

      # Scans whatever copy exists locally: the digest pull above when publishing,
      # the `load`ed build otherwise.
      - name: Generate image SBOM (CycloneDX / Trivy)
        env:
          DIGEST_REF: ${{ steps.registry.outputs.ref }}
          LOCAL_REF: ${{ steps.refs.outputs.tag_version }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          ref="${DIGEST_REF:-$LOCAL_REF}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/sbom:/sbom" \
            "${TRIVY_IMAGE}" image "$ref" \
            --format cyclonedx --output "/sbom/${{ matrix.service }}-image.cdx.json"

      - name: Upload image SBOM
        uses: actions/upload-artifact@v4
        with:
          name: image-sbom-${{ matrix.service }}
          path: sbom/${{ matrix.service }}-image.cdx.json
          retention-days: 90

      # ---- Optional: keyless signing + provenance (only when publishing images) ----
      - name: Install cosign
        if: ${{ needs.version.outputs.publish == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless / OIDC)
        if: ${{ needs.version.outputs.publish == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.refs.outputs.image }}@${DIGEST}"

      # GitHub artifact attestations are unavailable on user-owned private
      # repositories (API returns "Feature not available..."); attempting them
      # after a successful push would fail a green publish. Cosign keyless
      # signatures above still attach. Re-enable when the repo is public or the
      # org has attestations enabled.
      - name: Attest image provenance
        if: ${{ needs.version.outputs.publish == 'true' && !github.event.repository.private }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.refs.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # 5. Draft GitHub Release — the MANUAL APPROVAL GATE. Created as a draft with
  #    SBOMs attached; a human reviews and clicks Publish. Gated on the optional
  #    `release` environment so required-reviewer protection can be added later.
  # ---------------------------------------------------------------------------
  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version, verify, sbom, images]
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SBOMs only. Downloading *everything* also pulled the multi-MB buildx build
      # records, and that is what made this step exhaust its retries.
      - name: Download release SBOMs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*sbom*"
          merge-multiple: true

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -name '*.cdx.json' -exec cp {} release-assets/ \;
          find artifacts -name 'provenance.json' -exec cp {} release-assets/ \; || true
          echo "Assets:"; ls -1 release-assets

      # Draft only — never auto-published. gh CLI uses the built-in token (no extra action).
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --draft \
            --title "Parkio $VERSION" \
            --notes "Automated draft release for $VERSION (commit ${GITHUB_SHA}).

          Attached: CycloneDX SBOMs (backend services, frontend, container images) and the
          build provenance manifest. Review, then click **Publish release** to make it public.

          Image publish + cosign signing are controlled by the repo variable PUBLISH_IMAGES." \
            release-assets/* || gh release upload "$VERSION" release-assets/* --clobber
