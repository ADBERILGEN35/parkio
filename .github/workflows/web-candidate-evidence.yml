# Candidate web image evidence (CL-F30, CX-F11; owner decision 2026-10-05, option C).
#
# Builds the web image the release builds: frontend/apps/web/Dockerfile with the VITE_* values of
# docker/web-hosted-beta.release-bake.env and a synthetic MapTiler key. It runs that image on the
# runner's loopback, runs the a11y-web and CX-F11 acceptance suites against it, and uploads
# provenance.json (source, build inputs, image id, suite results, run) with the reports.
# Nothing is pushed or published. See scripts/web-candidate-evidence.sh.
#
# It runs for every api commit that changes the web image's inputs, on demand, and on pull requests
# that change the evidence job itself. Feature pull requests already run the same suites on the dev
# server in Frontend CI.

name: Web candidate image evidence

on:
  push:
    branches: [api]
    paths:
      - "frontend/**"
      - "docker/web-hosted-beta.release-bake.env"
      - "scripts/web-candidate-evidence.sh"
      - ".github/workflows/web-candidate-evidence.yml"
  pull_request:
    branches: [api]
    paths:
      - "scripts/web-candidate-evidence.sh"
      - ".github/workflows/web-candidate-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-candidate-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Candidate image evidence (a11y, CX-F11)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the pnpm version pinned in frontend/package.json ("packageManager").
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install focused browser
        run: pnpm --dir frontend --filter @parkio/web exec playwright install --with-deps chromium

      - name: Build the candidate image and run the suites against it
        run: bash scripts/web-candidate-evidence.sh web-candidate-evidence

      - name: Evidence summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f web-candidate-evidence/SUMMARY.md ]; then
            cat web-candidate-evidence/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No evidence summary: the candidate image did not build or start." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload candidate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-candidate-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: web-candidate-evidence/
          retention-days: 90
          if-no-files-found: error
