name: Bug report
description: Report reproducible behavior that does not match the documented system.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Frontend web
        - Mobile
        - Docker/local stack
        - Hosted beta operations
        - Documentation
        - CI
        - Unknown
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser/device, Docker mode, branch, or commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets, tokens, private keys, and personal data.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Checks already run
      description: Commands, test names, or manual checks.
    validations:
      required: false
