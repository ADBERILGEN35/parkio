spring:
  application:
    name: parking-service
  data:
    # Redis backs the best-effort forward-geocoding cache. In docker-compose this
    # resolves to the `redis` service; locally it defaults to localhost:6379. The
    # cache adapter degrades to a miss if Redis is unreachable (no hard dependency).
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  kafka:
    # Broker is externalized; local/dev default targets the docker-compose host listener.
    bootstrap-servers: ${PARKIO_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      ack-mode: manual
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${SPRING_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}
        request.timeout.ms: ${SPRING_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:10000}
        max.block.ms: ${SPRING_KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
        # Envelope is self-describing; consumers read it as JSON, so no type headers.
        spring.json.add.type.headers: false
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        request.timeout.ms: ${SPRING_KAFKA_CONSUMER_REQUEST_TIMEOUT_MS:10000}
        default.api.timeout.ms: ${SPRING_KAFKA_CONSUMER_DEFAULT_API_TIMEOUT_MS:10000}
        max.poll.records: ${SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS:100}
        max.poll.interval.ms: ${SPRING_KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:300000}
        session.timeout.ms: ${SPRING_KAFKA_CONSUMER_SESSION_TIMEOUT_MS:10000}
        heartbeat.interval.ms: ${SPRING_KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS:3000}
        spring.json.trusted.packages: "com.parkio.*"
        spring.json.use.type.headers: false
    admin:
      # Missing broker at startup must not fail the context.
      fail-fast: false
  jackson:
    # Event compatibility (event-contracts.md): tolerate unknown fields, ISO-8601 instants.
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parkio_parking}
    username: ${SPRING_DATASOURCE_USERNAME:parkio_parking}
    password: ${SPRING_DATASOURCE_PASSWORD:parking_local_dev_pw}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:8}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:1000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8083}
  # Graceful shutdown: on SIGTERM stop accepting new requests and let in-flight
  # ones drain (spring.lifecycle.timeout-per-shutdown-phase, 30s) before the JVM exits.
  shutdown: graceful

logging:
  pattern:
    level: "%5p [${spring.application.name:-},traceId=%X{traceId:-},spanId=%X{spanId:-},correlationId=%X{correlationId:-},eventId=%X{eventId:-}]"

management:
  endpoints:
    web:
      exposure:
        # Probes + Prometheus scrape only â€” never sensitive endpoints (env, beans, ...).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # Tag every metric with the service name (kept in sync with the scrape label).
      application: ${spring.application.name}
  tracing:
    # 100% sampling for hosted-beta; tune down to 0.05-0.20 for production via env.
    enabled: ${PARKIO_TRACING_ENABLED:true}
    sampling:
      probability: ${PARKIO_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # OTLP/HTTP span export to Tempo. The localhost default is for IDE-only dev; the
      # docker-compose apps overlay sets this to http://tempo:4318/v1/traces.
      endpoint: ${PARKIO_TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}


springdoc:
  api-docs:
    enabled: ${parkio.openapi.enabled:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${parkio.openapi.enabled:true}
    path: /swagger-ui.html
  show-actuator: false

info:
  app:
    name: parking-service
    description: Parkio parking-service

parkio:
  municipal:
    enabled: false
    manual-sync-enabled: false
    discovery:
      # DATA-WP-12: nearby duplicate-presentation (canonical default on).
      # Production profile pins false until a separate rollout approval.
      duplicate-presentation-enabled: ${PARKIO_MUNICIPAL_DISCOVERY_DUPLICATE_PRESENTATION_ENABLED:true}
      duplicate-radius-meters: ${PARKIO_MUNICIPAL_DISCOVERY_DUPLICATE_RADIUS_METERS:100}
      overfetch-factor: ${PARKIO_MUNICIPAL_DISCOVERY_OVERFETCH_FACTOR:2}
      overfetch-absolute-max: ${PARKIO_MUNICIPAL_DISCOVERY_OVERFETCH_ABSOLUTE_MAX:200}
      supported-pairs:
        - IZUM_OSM
    registry:
      candidate-generation-enabled: ${PARKIO_MUNICIPAL_REGISTRY_CANDIDATE_GENERATION_ENABLED:false}
      review-api-enabled: ${PARKIO_MUNICIPAL_REGISTRY_REVIEW_API_ENABLED:false}
      reviewed-linking-enabled: ${PARKIO_MUNICIPAL_REGISTRY_REVIEWED_LINKING_ENABLED:false}
      # Intentionally hardcoded off. RegistryProperties rejects any attempt to bind true.
      automatic-linking-enabled: false
      # DATA-WP-11: public nearby/detail provenance (canonical default on).
      # Production profile pins false until a separate rollout approval.
      provenance-publication-enabled: ${PARKIO_MUNICIPAL_REGISTRY_PROVENANCE_PUBLICATION_ENABLED:true}
      # DATA-WP-10: ingest provenance writes (default on). Independent of publication.
      provenance-ingest-write-enabled: ${PARKIO_MUNICIPAL_REGISTRY_PROVENANCE_INGEST_WRITE_ENABLED:true}
    izum:
      enabled: false
      operating-mode: ${PARKIO_MUNICIPAL_IZUM_OPERATING_MODE:SCHEDULED}
      base-url: https://openapi.izmir.bel.tr
      path: /api/ibb/izum/otoparklar
      connect-timeout: 2s
      read-timeout: 5s
      max-retries: 2
      scheduler-enabled: false
      fixed-delay-ms: 120000
      user-agent: ParkioParkingService/1.0 (+https://parkio.dev)
    ispark:
      # PROVIDER-ISTANBUL-01: İstanbul / İSPARK. Default dark; enable independently of İZUM.
      enabled: false
      operating-mode: ${PARKIO_MUNICIPAL_ISPARK_OPERATING_MODE:SCHEDULED}
      base-url: https://api.ibb.gov.tr
      path: /ispark/Park
      connect-timeout: 2s
      read-timeout: 10s
      max-retries: 1
      scheduler-enabled: false
      fixed-delay-ms: 120000
      user-agent: ParkioParkingService/1.0 (+https://parkio.dev)
    anpark:
      # PROVIDER-ANKARA-01: Ankara / ANPARK inventory only. Default dark.
      # LEGAL REVIEW REQUIRED before production enablement.
      enabled: false
      operating-mode: ${PARKIO_MUNICIPAL_ANPARK_OPERATING_MODE:SCHEDULED}
      base-url: https://www.anpark.com.tr
      path: /wp-json/anpark/v1/parks
      connect-timeout: 2s
      read-timeout: 10s
      max-retries: 1
      scheduler-enabled: false
      # 6h — inventory-only; no live occupancy polling cadence.
      fixed-delay-ms: 21600000
      user-agent: ParkioParkingService/1.0 (+https://parkio.dev)
    konya:
      # PROVIDER-KONYA-01: Konya / Otopark Bilgileri inventory only. Default dark.
      enabled: false
      operating-mode: ${PARKIO_MUNICIPAL_KONYA_OPERATING_MODE:SCHEDULED}
      base-url: https://acikveri.konya.bel.tr
      path: /api/3/action/datastore_search
      resource-id: 707d3cb9-1264-49dc-98a0-b9863766ab39
      page-size: 100
      max-pages: 10
      max-records: 500
      connect-timeout: 5s
      read-timeout: 30s
      max-retries: 1
      scheduler-enabled: false
      # 24h — static/stale inventory; no live occupancy polling cadence.
      fixed-delay-ms: 86400000
      user-agent: ParkioParkingService/1.0 (+https://parkio.dev)
    kayseri:
      # PROVIDER-KAYSERI-01: Kayseri / Otoparklar GeoJSON inventory only. Default dark.
      enabled: false
      operating-mode: ${PARKIO_MUNICIPAL_KAYSERI_OPERATING_MODE:SCHEDULED}
      base-url: https://acikveri.kayseri.bel.tr
      path: /uploads/data/2024/10/7/otoparklar-456371.geojson
      max-records: 100
      connect-timeout: 5s
      read-timeout: 30s
      max-retries: 1
      scheduler-enabled: false
      # 24h — static inventory; no live occupancy polling cadence.
      fixed-delay-ms: 86400000
      user-agent: ParkioParkingService/1.0 (+https://parkio.dev)
    fake-test:
      # WP-SPA-13: architecture-only fake provider. Never enable outside tests.
      enabled: false
      publication-enabled: false
    sla:
      warning-consecutive-failures: ${PARKIO_MUNICIPAL_SLA_WARNING_CONSECUTIVE_FAILURES:3}
      critical-consecutive-failures: ${PARKIO_MUNICIPAL_SLA_CRITICAL_CONSECUTIVE_FAILURES:5}
      warning-seconds-since-success: ${PARKIO_MUNICIPAL_SLA_WARNING_SECONDS_SINCE_SUCCESS:600}
      critical-seconds-since-success: ${PARKIO_MUNICIPAL_SLA_CRITICAL_SECONDS_SINCE_SUCCESS:1800}
      stale-running-after-seconds: ${PARKIO_MUNICIPAL_SLA_STALE_RUNNING_AFTER_SECONDS:600}
      recovering-window-seconds: ${PARKIO_MUNICIPAL_SLA_RECOVERING_WINDOW_SECONDS:900}
      failure-window-seconds: ${PARKIO_MUNICIPAL_SLA_FAILURE_WINDOW_SECONDS:86400}
    # MUNI-SYNC-RESILIENCE-01: actionable stale RUNNING recovery (≠ SLA observe-only threshold).
    sync:
      stale-run-recovery-enabled: ${PARKIO_MUNICIPAL_SYNC_STALE_RUN_RECOVERY_ENABLED:true}
      stale-running-threshold: ${PARKIO_MUNICIPAL_SYNC_STALE_RUNNING_THRESHOLD:20m}
      stale-run-watchdog-enabled: ${PARKIO_MUNICIPAL_SYNC_STALE_RUN_WATCHDOG_ENABLED:true}
      stale-run-watchdog-fixed-delay-ms: ${PARKIO_MUNICIPAL_SYNC_STALE_RUN_WATCHDOG_FIXED_DELAY_MS:120000}
    osm:
      import-enabled: false
      scheduler-enabled: false
      operating-mode: ${PARKIO_MUNICIPAL_OSM_OPERATING_MODE:OPERATOR_IMPORTED}
      conflation-enabled: false
      auto-match-enabled: false
      publish-restricted: false
      publication-enabled: false
      local-input-path: ""
      allowed-input-dir: ""
      max-input-bytes: 52428800
      clip-version: ${PARKIO_MUNICIPAL_OSM_CLIP_VERSION:izmir-admin-izbb-2024-10-18-v1}
      # DATA-WP-13: osm-label-v1 (default) or legacy technical IDs
      label-policy: ${PARKIO_MUNICIPAL_OSM_LABEL_POLICY:osm-label-v1}
      boundary-dir: ${PARKIO_MUNICIPAL_OSM_BOUNDARY_DIR:}
      boundary-geojson-filename: ${PARKIO_MUNICIPAL_OSM_BOUNDARY_GEOJSON_FILENAME:izmir-admin-boundary.geojson}
      boundary-poly-filename: ${PARKIO_MUNICIPAL_OSM_BOUNDARY_POLY_FILENAME:izmir-admin-boundary.poly}
      boundary-geojson-sha256: ${PARKIO_MUNICIPAL_OSM_BOUNDARY_GEOJSON_SHA256:}
      boundary-source-sha256: ${PARKIO_MUNICIPAL_OSM_BOUNDARY_SOURCE_SHA256:6f4f43e4ce8139ddca4606582d903f047cb7c73810f8b876541a1ec3994ffd89}
    izelman:
      enabled: ${PARKIO_MUNICIPAL_IZELMAN_ENABLED:false}
      facility-import-enabled: ${PARKIO_MUNICIPAL_IZELMAN_FACILITY_IMPORT_ENABLED:false}
      roadside-import-enabled: ${PARKIO_MUNICIPAL_IZELMAN_ROADSIDE_IMPORT_ENABLED:false}
      tariff-import-enabled: ${PARKIO_MUNICIPAL_IZELMAN_TARIFF_IMPORT_ENABLED:false}
      facility-publication-enabled: ${PARKIO_MUNICIPAL_IZELMAN_FACILITY_PUBLICATION_ENABLED:false}
      roadside-publication-enabled: ${PARKIO_MUNICIPAL_IZELMAN_ROADSIDE_PUBLICATION_ENABLED:false}
      tariff-publication-enabled: ${PARKIO_MUNICIPAL_IZELMAN_TARIFF_PUBLICATION_ENABLED:false}
      scheduler-enabled: ${PARKIO_MUNICIPAL_IZELMAN_SCHEDULER_ENABLED:false}
      candidate-generation-enabled: ${PARKIO_MUNICIPAL_IZELMAN_CANDIDATE_GENERATION_ENABLED:false}
      auto-match-enabled: false
      allowed-input-dir: ${PARKIO_MUNICIPAL_IZELMAN_ALLOWED_INPUT_DIR:}
      max-input-bytes: ${PARKIO_MUNICIPAL_IZELMAN_MAX_INPUT_BYTES:5242880}
      aging-after-days: ${PARKIO_MUNICIPAL_IZELMAN_AGING_AFTER_DAYS:180}
      historical-after-days: ${PARKIO_MUNICIPAL_IZELMAN_HISTORICAL_AFTER_DAYS:730}
    ops:
      # DATA-WP-15: admin quality/coverage report API (canonical default off; leave-on is DATA-WP-15A).
      quality-report-enabled: ${PARKIO_MUNICIPAL_OPS_QUALITY_REPORT_ENABLED:false}
      # DATA-WP-16: source-mode-aware SLA (canonical default off; leave-on is DATA-WP-16A).
      source-mode-sla-enabled: ${PARKIO_MUNICIPAL_OPS_SOURCE_MODE_SLA_ENABLED:false}
      # DATA-WP-18: district coverage section (canonical default off; leave-on is DATA-WP-18A).
      district-coverage-enabled: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_ENABLED:false}
      recent-run-limit-default: ${PARKIO_MUNICIPAL_OPS_QUALITY_REPORT_RECENT_RUN_LIMIT_DEFAULT:20}
      recent-run-limit-max: ${PARKIO_MUNICIPAL_OPS_QUALITY_REPORT_RECENT_RUN_LIMIT_MAX:100}
      district-coverage:
        asset-path: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_ASSET_PATH:}
        expected-sha256: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_EXPECTED_SHA256:6f4f43e4ce8139ddca4606582d903f047cb7c73810f8b876541a1ec3994ffd89}
        name-property: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_NAME_PROPERTY:adi}
        expected-count: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_EXPECTED_COUNT:30}
        max-facilities: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_MAX_FACILITIES:10000}
        cache-ttl-seconds: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_CACHE_TTL_SECONDS:45}
        topology-policy-enabled: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_TOPOLOGY_POLICY_ENABLED:false}
        topology-policy-version: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_TOPOLOGY_POLICY_VERSION:izmir-district-topology-v1}
        normalized-asset-path: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_NORMALIZED_ASSET_PATH:}
        normalized-asset-sha256: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_NORMALIZED_ASSET_SHA256:0c7457122d13fa02eba1258b6cda5cc28bfb7d64150e4e7db131f40611a655ec}
  openapi:
    enabled: ${PARKIO_OPENAPI_ENABLED:true}
  idempotency:
    ttl: ${PARKIO_IDEMPOTENCY_TTL:24h}
  lifecycle:
    parking-expiry:
      enabled: ${PARKIO_PARKING_EXPIRY_ENABLED:true}
      fixed-delay-ms: ${PARKIO_PARKING_EXPIRY_FIXED_DELAY_MS:60000}
      batch-size: ${PARKIO_PARKING_EXPIRY_BATCH_SIZE:100}
    parking-session-stale:
      # Master switch for the stale-session job (reminders + auto-complete + optional retention).
      enabled: ${PARKIO_PARKING_SESSION_STALE_ENABLED:true}
      # This is the live @Scheduled delay. Keep aligned with parkio.parking.session.scheduler-rate (PT1H).
      fixed-delay-ms: ${PARKIO_PARKING_SESSION_STALE_FIXED_DELAY_MS:3600000}
      batch-size: ${PARKIO_PARKING_SESSION_STALE_BATCH_SIZE:100}
    moderation-timeout:
      # Resolves spots the moderation pipeline never answered for: bounded retries at the
      # AI gate, then the terminal REVIEW_FAILED state. Never touches pending spots' TTL.
      enabled: ${PARKIO_MODERATION_TIMEOUT_ENABLED:true}
      fixed-delay-ms: ${PARKIO_MODERATION_TIMEOUT_FIXED_DELAY_MS:60000}
      batch-size: ${PARKIO_MODERATION_TIMEOUT_BATCH_SIZE:100}
    outcome-validation:
      enabled: ${PARKIO_OUTCOME_VALIDATION_ENABLED:true}
      fixed-delay-ms: ${PARKIO_OUTCOME_VALIDATION_FIXED_DELAY_MS:60000}
      batch-size: ${PARKIO_OUTCOME_VALIDATION_BATCH_SIZE:100}
    trust-shadow:
      enabled: ${PARKIO_TRUST_SHADOW_ENABLED:true}
      fixed-delay-ms: ${PARKIO_TRUST_SHADOW_FIXED_DELAY_MS:60000}
      batch-size: ${PARKIO_TRUST_SHADOW_BATCH_SIZE:100}
      max-attempts: ${PARKIO_TRUST_SHADOW_MAX_ATTEMPTS:3}
    reward-shadow:
      enabled: ${PARKIO_REWARD_SHADOW_ENABLED:false}
      fixed-delay-ms: ${PARKIO_REWARD_SHADOW_FIXED_DELAY_MS:60000}
      batch-size: ${PARKIO_REWARD_SHADOW_BATCH_SIZE:100}
    fraud-shadow:
      enabled: ${PARKIO_FRAUD_SHADOW_ENABLED:false}
      fixed-delay-ms: ${PARKIO_FRAUD_SHADOW_FIXED_DELAY_MS:60000}
      batch-size: ${PARKIO_FRAUD_SHADOW_BATCH_SIZE:100}
      max-attempts: ${PARKIO_FRAUD_SHADOW_MAX_ATTEMPTS:3}
    calibration:
      enabled: ${PARKIO_CALIBRATION_ENABLED:false}
      fixed-delay-ms: ${PARKIO_CALIBRATION_FIXED_DELAY_MS:300000}
      batch-size: ${PARKIO_CALIBRATION_BATCH_SIZE:50}
      max-attempts: ${PARKIO_CALIBRATION_MAX_ATTEMPTS:3}
    retention:
      outbox-enabled: ${PARKIO_OUTBOX_RETENTION_ENABLED:true}
      inbox-enabled: ${PARKIO_INBOX_RETENTION_ENABLED:true}
      outbox-retention: ${PARKIO_OUTBOX_RETENTION:P7D}
      inbox-retention: ${PARKIO_INBOX_RETENTION:P30D}
      fixed-delay-ms: ${PARKIO_RETENTION_FIXED_DELAY_MS:3600000}
      batch-size: ${PARKIO_RETENTION_BATCH_SIZE:1000}
  auth:
    client:
      base-url: ${PARKIO_AUTH_SERVICE_URI:http://localhost:8081}
  gateway:
    # Shared secret required on every inbound request (X-Gateway-Auth) so only
    # gateway-originated traffic is accepted. No default â†’ fail closed if unset.
    internal-secret: ${PARKIO_GATEWAY_INTERNAL_SECRET}
    # Optional comma-separated previous secrets also accepted during a rotation. The
    # gateway always sends `internal-secret`; downstream accepts that plus these so the
    # old and new secret overlap with no downtime. Empty when no rotation is in progress.
    internal-accepted-secrets: ${PARKIO_GATEWAY_INTERNAL_ACCEPTED_SECRETS:}
  media:
    client:
      # Internal base URL of media-service, used to request short-lived signed
      # photo URLs on behalf of authorized spot viewers. Calls carry the shared
      # X-Gateway-Auth secret; timeouts are short so a media outage degrades to a
      # fast 503 instead of stalling request threads.
      base-url: ${PARKIO_MEDIA_SERVICE_URI:http://localhost:8084}
      connect-timeout: ${PARKIO_MEDIA_CLIENT_CONNECT_TIMEOUT:2s}
      read-timeout: ${PARKIO_MEDIA_CLIENT_READ_TIMEOUT:5s}
  geocoding:
    # Forward geocoding (place text -> coordinates) for the /map search, proxied
    # through this service instead of called directly from the browser (ADR-014).
    provider:
      # Default is the public OpenStreetMap Nominatim endpoint (hosted-beta). Point
      # this at an SLA-backed provider for production; the adapter is swappable.
      base-url: ${PARKIO_GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
      # Nominatim's usage policy requires a descriptive User-Agent identifying the app.
      user-agent: ${PARKIO_GEOCODING_USER_AGENT:Parkio/1.0 (+https://parkio.app)}
      country-codes: ${PARKIO_GEOCODING_COUNTRY_CODES:tr}
      language: ${PARKIO_GEOCODING_LANGUAGE:tr}
      # Short timeouts: a slow provider degrades to "no suggestions" fast, never stalls.
      connect-timeout: ${PARKIO_GEOCODING_CONNECT_TIMEOUT:1s}
      read-timeout: ${PARKIO_GEOCODING_READ_TIMEOUT:3s}
    cache:
      positive-ttl: ${PARKIO_GEOCODING_CACHE_POSITIVE_TTL:24h}
      negative-ttl: ${PARKIO_GEOCODING_CACHE_NEGATIVE_TTL:5m}
  spa:
    recommendations:
      # WP-SPA-05 destination parking recommendations. Default off; schema-free kill switch.
      enabled: ${PARKIO_SPA_RECOMMENDATIONS_ENABLED:false}
    ranking:
      # WP-SPA-06 deterministic ranking. Default off — preserves SPA-05 distance order.
      enabled: ${PARKIO_SPA_RANKING_ENABLED:false}
      favourites-enabled: ${PARKIO_SPA_RANKING_FAVOURITES_ENABLED:true}
      distance-weight: ${PARKIO_SPA_RANKING_DISTANCE_WEIGHT:0.35}
      freshness-weight: ${PARKIO_SPA_RANKING_FRESHNESS_WEIGHT:0.25}
      capacity-weight: ${PARKIO_SPA_RANKING_CAPACITY_WEIGHT:0.15}
      confidence-weight: ${PARKIO_SPA_RANKING_CONFIDENCE_WEIGHT:0.15}
      favourite-weight: ${PARKIO_SPA_RANKING_FAVOURITE_WEIGHT:0.10}
      distance-cap-meters: ${PARKIO_SPA_RANKING_DISTANCE_CAP_METERS:1200}
      # WP-SPA-14 AI ranking shadow FRAMEWORK (local challenger). Default off; never mutates public order.
      shadow:
        enabled: ${PARKIO_SPA_RANKING_SHADOW_ENABLED:false}
        sample-rate: ${PARKIO_SPA_RANKING_SHADOW_SAMPLE_RATE:0.0}
        timeout-ms: ${PARKIO_SPA_RANKING_SHADOW_TIMEOUT_MS:500}
        max-candidates: ${PARKIO_SPA_RANKING_SHADOW_MAX_CANDIDATES:10}
        max-concurrent: ${PARKIO_SPA_RANKING_SHADOW_MAX_CONCURRENT:4}
      # WP-SPA-14B privacy-safe ranking evaluation correlation. Default off.
      evaluation:
        enabled: ${PARKIO_SPA_RANKING_EVALUATION_ENABLED:false}
        retention-hours: ${PARKIO_SPA_RANKING_EVALUATION_RETENTION_HOURS:24}
        cleanup-enabled: ${PARKIO_SPA_RANKING_EVALUATION_CLEANUP_ENABLED:true}
        cleanup-fixed-delay-ms: ${PARKIO_SPA_RANKING_EVALUATION_CLEANUP_FIXED_DELAY_MS:900000}
        cleanup-batch-size: ${PARKIO_SPA_RANKING_EVALUATION_CLEANUP_BATCH_SIZE:500}
        # WP-SPA-14D privacy-safe long-horizon rollups. Default off.
        rollup-enabled: ${PARKIO_SPA_RANKING_EVALUATION_ROLLUP_ENABLED:false}
        rollup-retention-days: ${PARKIO_SPA_RANKING_EVALUATION_ROLLUP_RETENTION_DAYS:90}
        rollup-grace-minutes: ${PARKIO_SPA_RANKING_EVALUATION_ROLLUP_GRACE_MINUTES:60}
        rollup-fixed-delay-ms: ${PARKIO_SPA_RANKING_EVALUATION_ROLLUP_FIXED_DELAY_MS:900000}
        rollup-max-slices-per-pass: ${PARKIO_SPA_RANKING_EVALUATION_ROLLUP_MAX_SLICES_PER_PASS:24}
        rollup-cleanup-enabled: ${PARKIO_SPA_RANKING_EVALUATION_ROLLUP_CLEANUP_ENABLED:true}
  user:
    client:
      # Internal base URL of user-service for favourite parking status (WP-SPA-06).
      # Fail-open; short timeouts so ranking continues with favourite=0 on outage.
      base-url: ${PARKIO_USER_SERVICE_URI:http://localhost:8082}
      connect-timeout: ${PARKIO_USER_CLIENT_CONNECT_TIMEOUT:1s}
      read-timeout: ${PARKIO_USER_CLIENT_READ_TIMEOUT:2s}
  parking:
    # One-shot legacy inventory reset. Keep disabled except on an explicit operator run.
    legacy-policy-reset:
      enabled: ${PARKIO_PARKING_LEGACY_POLICY_RESET_ENABLED:false}
      dry-run: ${PARKIO_PARKING_LEGACY_POLICY_RESET_DRY_RUN:true}
      target-policy-version: ${PARKIO_PARKING_LEGACY_POLICY_RESET_TARGET:2026-07-photo-policy-v3-recall}
      batch-size: ${PARKIO_PARKING_LEGACY_POLICY_RESET_BATCH_SIZE:500}
    outcome:
      max-processing-attempts: ${PARKIO_PARKING_OUTCOME_MAX_PROCESSING_ATTEMPTS:10}
    session:
      confirm-after: ${PARKIO_PARKING_SESSION_CONFIRM_AFTER:PT24H}
      reminder-2-after: ${PARKIO_PARKING_SESSION_REMINDER_2_AFTER:PT48H}
      auto-complete-after: ${PARKIO_PARKING_SESSION_AUTO_COMPLETE_AFTER:PT72H}
      scheduler-rate: ${PARKIO_PARKING_SESSION_SCHEDULER_RATE:PT1H}
      scheduler-batch-size: ${PARKIO_PARKING_SESSION_SCHEDULER_BATCH_SIZE:100}
      reminders-enabled: ${PARKIO_PARKING_SESSION_REMINDERS_ENABLED:true}
      auto-complete-enabled: ${PARKIO_PARKING_SESSION_AUTO_COMPLETE_ENABLED:true}
      notification-enabled: ${PARKIO_PARKING_SESSION_NOTIFICATION_ENABLED:true}
      retention-enabled: ${PARKIO_PARKING_SESSION_RETENTION_ENABLED:false}
      retention-after: ${PARKIO_PARKING_SESSION_RETENTION_AFTER:P365D}
    search:
      # Tunable nearby-search defaults and caps (ai-context/02). Client-supplied
      # radius/limit above the max (or <= 0) are rejected with 400.
      default-radius-meters: 1000
      default-result-limit: 10
      max-radius-meters: 50000
      max-result-limit: 50
    decision:
      # WP-05.5 non-authoritative Decision Engine shadow. Default off everywhere.
      # When true, evaluates EvidenceVector→DecisionResult after applyAiValidationResult
      # and records low-cardinality comparison metrics only. Never mutates publication.
      shadow-enabled: ${PARKIO_PARKING_DECISION_SHADOW_ENABLED:false}
      # WP-05.8 controlled authority. Default off / 0% canary everywhere.
      # Independent of shadow-enabled. Never set non-zero canary in production defaults.
      authority:
        enabled: ${PARKIO_PARKING_DECISION_AUTHORITY_ENABLED:false}
        canary-percentage: ${PARKIO_PARKING_DECISION_AUTHORITY_CANARY_PERCENTAGE:0}
        policy-version: ${PARKIO_PARKING_DECISION_AUTHORITY_POLICY_VERSION:decision-shadow-v1}
    exposure-shadow:
      # WP-05.13 adaptive exposure shadow. Default off everywhere.
      enabled: ${PARKIO_PARKING_EXPOSURE_SHADOW_ENABLED:false}
      sample-percent: ${PARKIO_PARKING_EXPOSURE_SHADOW_SAMPLE_PERCENT:10}
      time-budget-millis: ${PARKIO_PARKING_EXPOSURE_SHADOW_TIME_BUDGET_MS:25}
    moderation:
      # Moderation-lifecycle windows. `active-duration` is the advertised user-visible
      # lifetime and is spent ONLY once a spot is published — never while it waits on
      # moderation, which is what previously let slow reviews expire spots before they
      # were ever visible.
      active-duration: ${PARKIO_SPOT_ACTIVE_DURATION:10m}
      # AI publication-gate budget, then bounded retries with per-attempt backoff.
      # Defaults keep the AI path well under max-publishable-age (~8m worst case).
      validation-timeout: ${PARKIO_MODERATION_VALIDATION_TIMEOUT:2m}
      validation-retry-backoff: ${PARKIO_MODERATION_VALIDATION_RETRY_BACKOFF:1m}
      max-validation-attempts: ${PARKIO_MODERATION_MAX_VALIDATION_ATTEMPTS:3}
      # Human review budget after AI lands the spot in PENDING_REVIEW. Sized for
      # perishable availability (~10m TTL), not overnight queues.
      review-timeout: ${PARKIO_MODERATION_REVIEW_TIMEOUT:15m}
      # Hard ceiling from submission time. A late approval past this age fails as
      # REVIEW_FAILED (stale) instead of publishing a fresh TTL for an old report.
      max-publishable-age: ${PARKIO_MODERATION_MAX_PUBLISHABLE_AGE:30m}
  kafka:
    # Topic provisioning via NewTopic beans (KafkaTopicsConfig). Replication factor is
    # configurable for production; 1 is the local/dev default (single-broker compose).
    provision-topics: true
    replication-factor: ${PARKIO_KAFKA_REPLICATION_FACTOR:1}
    moderation-consumer:
      enabled: ${PARKIO_MODERATION_CONSUMER_ENABLED:true}
    ai-validation-consumer:
      enabled: ${PARKIO_AI_VALIDATION_CONSUMER_ENABLED:true}
    relay:
      # Outbox relay: publishes parking-spot events to parkio.parking.spot. Poll interval
      # and batch size are configurable; send-timeout bounds the per-row broker ack wait.
      enabled: true
      poll-interval-ms: 1000
      batch-size: 100
      send-timeout-ms: 10000

# Resilience for the outbound geocoding provider call (instance: geocoding). Isolates a
# third-party dependency so its slowness/outage can never destabilise parking-service:
# the rate limiter respects the provider's usage policy, the bulkhead caps concurrency,
# and the circuit breaker short-circuits sustained failures. Health indicators are off so
# a degraded geocoder (non-critical) never flips the service health to DOWN.
resilience4j:
  circuitbreaker:
    instances:
      geocoding:
        register-health-indicator: false
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
  bulkhead:
    instances:
      geocoding:
        # Max concurrent provider calls; extra callers fail fast and degrade to empty.
        max-concurrent-calls: ${PARKIO_GEOCODING_BULKHEAD_MAX_CONCURRENT:4}
        max-wait-duration: 0
  ratelimiter:
    instances:
      geocoding:
        # Outbound cap honoring Nominatim's ≤1 request/second policy. A short wait
        # smooths bursts; beyond it the call degrades rather than queueing threads.
        register-health-indicator: false
        limit-for-period: ${PARKIO_GEOCODING_RL_LIMIT_FOR_PERIOD:1}
        limit-refresh-period: ${PARKIO_GEOCODING_RL_REFRESH_PERIOD:1s}
        timeout-duration: ${PARKIO_GEOCODING_RL_TIMEOUT:500ms}
