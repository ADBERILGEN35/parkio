spring:
  application:
    name: ai-validation-service
  kafka:
    # Broker is externalized; local/dev default targets the docker-compose host listener.
    bootstrap-servers: ${PARKIO_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      ack-mode: manual
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${SPRING_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}
        request.timeout.ms: ${SPRING_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:10000}
        max.block.ms: ${SPRING_KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
        # Envelope is self-describing; consumers read it as JSON, so no type headers.
        spring.json.add.type.headers: false
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        request.timeout.ms: ${SPRING_KAFKA_CONSUMER_REQUEST_TIMEOUT_MS:10000}
        default.api.timeout.ms: ${SPRING_KAFKA_CONSUMER_DEFAULT_API_TIMEOUT_MS:10000}
        max.poll.records: ${SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS:1}
        max.poll.interval.ms: ${SPRING_KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:180000}
        session.timeout.ms: ${SPRING_KAFKA_CONSUMER_SESSION_TIMEOUT_MS:10000}
        heartbeat.interval.ms: ${SPRING_KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS:3000}
        spring.json.trusted.packages: "com.parkio.*"
        spring.json.use.type.headers: false
    admin:
      # Missing broker at startup must not fail the context.
      fail-fast: false
  jackson:
    # Event compatibility (event-contracts.md): tolerate unknown fields, ISO-8601 instants.
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parkio_aivalidation}
    username: ${SPRING_DATASOURCE_USERNAME:parkio_aivalidation}
    password: ${SPRING_DATASOURCE_PASSWORD:aivalidation_local_dev_pw}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:8}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:1000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8088}
  # Graceful shutdown: on SIGTERM stop accepting new requests and let in-flight
  # ones drain (spring.lifecycle.timeout-per-shutdown-phase, 30s) before the JVM exits.
  shutdown: graceful

logging:
  pattern:
    level: "%5p [${spring.application.name:-},traceId=%X{traceId:-},spanId=%X{spanId:-},correlationId=%X{correlationId:-},eventId=%X{eventId:-}]"

management:
  endpoints:
    web:
      exposure:
        # Probes + Prometheus scrape only â€” never sensitive endpoints (env, beans, ...).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # Tag every metric with the service name (kept in sync with the scrape label).
      application: ${spring.application.name}
  tracing:
    # 100% sampling for hosted-beta; tune down to 0.05-0.20 for production via env.
    enabled: ${PARKIO_TRACING_ENABLED:true}
    sampling:
      probability: ${PARKIO_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # OTLP/HTTP span export to Tempo. The localhost default is for IDE-only dev; the
      # docker-compose apps overlay sets this to http://tempo:4318/v1/traces.
      endpoint: ${PARKIO_TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}


springdoc:
  api-docs:
    enabled: ${parkio.openapi.enabled:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${parkio.openapi.enabled:true}
    path: /swagger-ui.html
  show-actuator: false

info:
  app:
    name: ai-validation-service
    description: Parkio ai-validation-service

parkio:
  openapi:
    enabled: ${PARKIO_OPENAPI_ENABLED:true}
  lifecycle:
    retention:
      outbox-enabled: ${PARKIO_OUTBOX_RETENTION_ENABLED:true}
      inbox-enabled: ${PARKIO_INBOX_RETENTION_ENABLED:true}
      outbox-retention: ${PARKIO_OUTBOX_RETENTION:P7D}
      inbox-retention: ${PARKIO_INBOX_RETENTION:P30D}
      fixed-delay-ms: ${PARKIO_RETENTION_FIXED_DELAY_MS:3600000}
      batch-size: ${PARKIO_RETENTION_BATCH_SIZE:1000}
  gateway:
    # Shared secret required on every inbound request (X-Gateway-Auth) so only
    # gateway-originated traffic is accepted. No default â†’ fail closed if unset.
    internal-secret: ${PARKIO_GATEWAY_INTERNAL_SECRET}
    # Optional comma-separated previous secrets also accepted during a rotation. The
    # gateway always sends `internal-secret`; downstream accepts that plus these so the
    # old and new secret overlap with no downtime. Empty when no rotation is in progress.
    internal-accepted-secrets: ${PARKIO_GATEWAY_INTERNAL_ACCEPTED_SECRETS:}
  ai:
    vision:
      # Which classifier backs the AI gate. `heuristic` is the fail-closed placeholder
      # (local dev/tests); `gemini` enables the real vision provider. Hosted-beta /
      # production must set `gemini` — provider failures still fail closed (UNCERTAIN
      # -> WARNING -> parking PENDING_REVIEW; never ACTIVE).
      provider: ${PARKIO_AI_VISION_PROVIDER:heuristic}
      # Final vision payload cap after downscale (default 1.5 MiB).
      max-image-bytes: ${PARKIO_AI_VISION_MAX_IMAGE_BYTES:1572864}
      # Encoded fetch cap from media-service before decode/downscale.
      max-fetch-bytes: ${PARKIO_AI_VISION_MAX_FETCH_BYTES:15728640}
      max-decoded-pixels: ${PARKIO_AI_VISION_MAX_DECODED_PIXELS:40000000}
      max-source-edge: ${PARKIO_AI_VISION_MAX_SOURCE_EDGE:8000}
      target-longest-edge: ${PARKIO_AI_VISION_TARGET_LONGEST_EDGE:1536}
      jpeg-quality: ${PARKIO_AI_VISION_JPEG_QUALITY:0.85}
      semantic-uncertain-reuse-ttl: ${PARKIO_AI_VISION_SEMANTIC_UNCERTAIN_REUSE_TTL:24h}
      accept-confidence: ${PARKIO_AI_VISION_ACCEPT_CONFIDENCE:0.70}
      reject-confidence: ${PARKIO_AI_VISION_REJECT_CONFIDENCE:0.70}
      revalidation:
        enabled: ${PARKIO_AI_VISION_REVALIDATION_ENABLED:true}
        fixed-delay-ms: ${PARKIO_AI_VISION_REVALIDATION_FIXED_DELAY_MS:300000}
        min-age: ${PARKIO_AI_VISION_REVALIDATION_MIN_AGE:5m}
        max-age: ${PARKIO_AI_VISION_REVALIDATION_MAX_AGE:7d}
        batch-size: ${PARKIO_AI_VISION_REVALIDATION_BATCH_SIZE:20}
      media-client:
        # Internal media-content endpoint (GET /internal/media/{id}/content). Bytes
        # stay on the private service network; no presigned/public URL is created.
        base-url: ${PARKIO_MEDIA_SERVICE_URI:http://localhost:8084}
        connect-timeout: ${PARKIO_AI_VISION_MEDIA_CONNECT_TIMEOUT:2s}
        read-timeout: ${PARKIO_AI_VISION_MEDIA_READ_TIMEOUT:5s}
      gemini:
        # Secret: environment-injected only. No default — startup fails when the
        # gemini provider is enabled without a key (fail closed at deploy time).
        api-key: ${PARKIO_AI_VISION_GEMINI_API_KEY:}
        # Vision-capable model id; check ai.google.dev/gemini-api/docs/models before
        # changing. Overridable per environment without a rebuild.
        model: ${PARKIO_AI_VISION_GEMINI_MODEL:gemini-2.5-flash-lite}
        base-url: ${PARKIO_AI_VISION_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
        connect-timeout: ${PARKIO_AI_VISION_GEMINI_CONNECT_TIMEOUT:3s}
        read-timeout: ${PARKIO_AI_VISION_GEMINI_READ_TIMEOUT:15s}
        # Bounded retries for 429/5xx/timeout only; Retry-After honoured up to the cap.
        max-retries: ${PARKIO_AI_VISION_GEMINI_MAX_RETRIES:1}
        max-retry-delay: ${PARKIO_AI_VISION_GEMINI_MAX_RETRY_DELAY:2s}
  kafka:
    # Topic provisioning via NewTopic beans (KafkaTopicsConfig). Replication factor is
    # configurable for production; 1 is the local/dev default (single-broker compose).
    provision-topics: true
    replication-factor: ${PARKIO_KAFKA_REPLICATION_FACTOR:1}
    consumer:
      # Vision listeners use a dedicated factory (AiValidationKafkaConsumerConfig).
      # Default batch=1 keeps worst-case Gemini latency under max.poll.interval.
      max-poll-records: ${SPRING_KAFKA_CONSUMER_MAX_POLL_RECORDS:1}
      max-poll-interval-ms: ${SPRING_KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:180000}
    relay:
      # Outbox relay: publishes advisory results to parkio.aivalidation.result. Poll
      # interval and batch size are configurable; send-timeout bounds the ack wait.
      enabled: true
      poll-interval-ms: 1000
      batch-size: 100
      send-timeout-ms: 10000

# Outbound Gemini circuit breaker. Health indicator off so an open breaker does not
# flip the service health DOWN while fail-closed validation continues.
resilience4j:
  circuitbreaker:
    instances:
      geminiVision:
        register-health-indicator: false
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
