spring:
  application:
    name: gateway-service
  data:
    # Reactive Redis backs the edge RequestRateLimiter token bucket. In docker-compose
    # this resolves to the `redis` service; locally it defaults to localhost:6379.
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5441/parkio_gateway}
    username: ${SPRING_DATASOURCE_USERNAME:parkio_gateway}
    password: ${SPRING_DATASOURCE_PASSWORD:gateway_local_dev_pw}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:4}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:1000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    gateway:
      # Global downstream HTTP client budgets for routed services. Per-route
      # user-status/session-epoch clients retain their own PT2S budgets under
      # parkio.gateway.*. Route-specific long operations remain BASELINING_REQUIRED
      # until measured (see docs/operations/gateway-timeout-governance.md).
      httpclient:
        connect-timeout: ${PARKIO_GATEWAY_DOWNSTREAM_CONNECT_TIMEOUT:2000}
        response-timeout: ${PARKIO_GATEWAY_DOWNSTREAM_RESPONSE_TIMEOUT:30s}
      # Downstream URIs are externalized; defaults target local dev ports. In a
      # container/orchestrated environment these resolve to service DNS names.
      #
      # Every route carries a RequestRateLimiter filter (Redis token bucket, keyed by
      # authenticated userId else client IP â€” see RateLimitConfig). Per-tier limits
      # are env-overridable; defaults are conservative (ai-context/07):
      #   auth login/register   strict   â€” credential-stuffing / enumeration defence
      #   media upload          stricter â€” expensive writes
      #   parking create/verify/claim  moderate
      #   general authenticated APIs   broader
      routes:
        # --- Anonymous public explore: exact GET-only paths, conservative IP limit ---
        - id: public-explore
          uri: ${PARKIO_PARKING_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/public/explore/facilities,/api/v1/public/explore/facilities/{facilityId}
            - Method=GET
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@publicExploreIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_PUBLIC_EXPLORE_REPLENISH:1}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_PUBLIC_EXPLORE_BURST:5}
        # --- Auth (mixed public/protected): strict limit -------------------------
        - id: auth-service
          uri: ${PARKIO_AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_AUTH_REPLENISH:5}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_AUTH_BURST:10}
        - id: account-erasure
          uri: ${PARKIO_AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/account/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_AUTH_REPLENISH:5}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_AUTH_BURST:10}
        # --- Administration API (auth-service; ADMIN/SUPER_ADMIN at edge) --------
        - id: auth-admin
          uri: ${PARKIO_AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_ADMIN_REPLENISH:20}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_ADMIN_BURST:40}
        # --- User profile: broad authenticated limit -----------------------------
        - id: user-service
          uri: ${PARKIO_USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_DEFAULT_REPLENISH:30}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_DEFAULT_BURST:60}
        # --- Saved places (user-service; WP-SPA-03) ------------------------------
        - id: places-service
          uri: ${PARKIO_USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/places/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_DEFAULT_REPLENISH:30}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_DEFAULT_BURST:40}
        # --- Parking (create/verify/claim): moderate limit -----------------------
        - id: parking-service
          uri: ${PARKIO_PARKING_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/parking/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_PARKING_REPLENISH:10}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_PARKING_BURST:20}
        # --- Geocoding (place text -> coordinates): typeahead-friendly limit ------
        # Implemented inside parking-service (ADR-014) but routed on its own path so it
        # carries a DEDICATED rate-limit tier, independent of the parking create/verify
        # budget. Authenticated like every non-auth route (not on the public allow-list).
        - id: geocoding-service
          uri: ${PARKIO_PARKING_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/geocoding/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_GEOCODING_REPLENISH:5}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_GEOCODING_BURST:10}
        # --- Media upload: stricter limit ----------------------------------------
        - id: media-service
          uri: ${PARKIO_MEDIA_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/media/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_MEDIA_REPLENISH:2}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_MEDIA_BURST:5}
        # --- General authenticated APIs: broad limit -----------------------------
        - id: gamification-service
          uri: ${PARKIO_GAMIFICATION_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/gamification/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_DEFAULT_REPLENISH:30}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_DEFAULT_BURST:60}
        - id: notification-service
          uri: ${PARKIO_NOTIFICATION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_DEFAULT_REPLENISH:30}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_DEFAULT_BURST:60}
        - id: moderation-service
          uri: ${PARKIO_MODERATION_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/moderation/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_DEFAULT_REPLENISH:30}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_DEFAULT_BURST:60}
        - id: ai-validation-service
          uri: ${PARKIO_AI_VALIDATION_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/ai-validations/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_DEFAULT_REPLENISH:30}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_DEFAULT_BURST:60}
        - id: analytics-service
          uri: ${PARKIO_ANALYTICS_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${PARKIO_RL_DEFAULT_REPLENISH:30}
                redis-rate-limiter.burstCapacity: ${PARKIO_RL_DEFAULT_BURST:60}

server:
  port: ${SERVER_PORT:8080}
  # Graceful shutdown: on SIGTERM stop accepting new requests and let in-flight
  # ones drain (spring.lifecycle.timeout-per-shutdown-phase, 30s) before the JVM exits.
  shutdown: graceful

logging:
  pattern:
    # Reactive edge: Micrometer propagates traceId/spanId through the Reactor context so
    # gateway log lines carry the same OTel trace ids the downstream services emit (the
    # correlation id stays the response/echo header, see CorrelationIdGlobalFilter).
    level: "%5p [${spring.application.name:-},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

management:
  endpoints:
    web:
      exposure:
        # Probes + Prometheus scrape only â€” never sensitive endpoints (env, beans, ...).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      # Surface the `info.*` properties below at /actuator/info. Scoped to the
      # `info.` prefix only — this does NOT expose the environment, and
      # /actuator/env stays unexposed (see the exposure include above).
      enabled: true
  metrics:
    tags:
      # Tag every metric with the service name (kept in sync with the scrape label).
      application: ${spring.application.name}
  tracing:
    # 100% sampling for hosted-beta; tune down to 0.05-0.20 for production via env.
    enabled: ${PARKIO_TRACING_ENABLED:true}
    sampling:
      probability: ${PARKIO_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # OTLP/HTTP span export to Tempo. The localhost default is for IDE-only dev; the
      # docker-compose apps overlay sets this to http://tempo:4318/v1/traces.
      endpoint: ${PARKIO_TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}


info:
  app:
    name: gateway-service
    description: Parkio gateway-service
  # Non-secret deployment identity. PROD-DEPLOY-01A dark acceptance reads this to
  # prove the process answering on the loopback dark endpoint really is THIS
  # invite-production deployment at the expected commit, rather than some other
  # Parkio environment. Both values are already-public build/deploy metadata; do
  # not add anything here that is not safe to serve unauthenticated.
  deployment:
    environment: ${PARKIO_ENVIRONMENT:local}
    gitSha: ${PARKIO_GIT_SHA:unknown}

parkio:
  security:
    jwt:
      issuer: ${PARKIO_JWT_ISSUER:parkio-auth}
      # Expected aud claim â€” must match auth-service's PARKIO_JWT_AUDIENCE. The default
      # is for local/dev; set it explicitly in production. Blank fails closed at startup.
      audience: ${PARKIO_JWT_AUDIENCE:parkio-api}
      # Tolerance (seconds) for exp/nbf checks to absorb clock drift between services.
      clock-skew-seconds: ${PARKIO_JWT_CLOCK_SKEW_SECONDS:30}
      jwks-uri: ${PARKIO_AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/.well-known/jwks.json}
      jwks-cache-ttl: ${PARKIO_AUTH_JWKS_CACHE_TTL:PT15M}
  gateway:
    public-surface:
      # When false, /actuator/info is off the public (non-loopback) surface.
      # Loopback peers remain readable for invite-production dark/staged smoke.
      actuator-info-enabled: ${PARKIO_GATEWAY_PUBLIC_ACTUATOR_INFO_ENABLED:true}
      # Independent anonymous allowlist gate. Missing is false.
      public-explore-enabled: ${PARKIO_PUBLIC_EXPLORE_ENABLED:false}
    # Shared secret stamped onto every routed request as X-Gateway-Auth so downstream
    # services can reject calls that did not come through this gateway. No default â†’
    # the gateway fails to start unless PARKIO_GATEWAY_INTERNAL_SECRET is provided
    # (fail closed, ai-context/07). Every downstream service must be configured with the
    # SAME secret. For local dev use the `dev` profile or export the env var.
    internal-secret: ${PARKIO_GATEWAY_INTERNAL_SECRET}
    # Proxy-aware anonymous rate limiting. CIDRs/IPs of reverse proxies whose
    # X-Forwarded-For may be trusted when deriving the client IP. EMPTY by default =
    # trust nothing (key on the socket peer), so direct-to-gateway deployments are
    # unaffected. NEVER include public ranges. Behind the hosted-beta Caddy proxy set
    # PARKIO_TRUSTED_PROXIES to the Docker/proxy ranges (see docker/.env.hosted-beta.example).
    trusted-proxies: ${PARKIO_TRUSTED_PROXIES:}
    cors:
      # Lock down to the real web/app origins in each environment. Empty by
      # default â†’ no cross-origin browser access is permitted (safe default).
      allowed-origins: ${PARKIO_CORS_ALLOWED_ORIGINS:}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      # Default ON because the SPA's only supported mode is credentialed CORS: it sends
      # withCredentials on /auth/** so the HttpOnly refresh cookie flows, and browsers
      # then require Access-Control-Allow-Credentials: true on EVERY response (including
      # 4xx/5xx) or they block it as a CORS error. This is safe by construction: origins
      # above are empty by default (deny-all) and are always an explicit allow-list, and
      # CorsConfig fails fast on the dangerous wildcard("*")+credentials combination. A
      # rare credential-less cross-origin consumer can still opt out with
      # PARKIO_CORS_ALLOW_CREDENTIALS=false. NOTE: this must hold on the DEFAULT profile —
      # the running gateway is not guaranteed to use the `dev` profile, so the default
      # itself (not a profile/env override) has to be correct.
      allow-credentials: ${PARKIO_CORS_ALLOW_CREDENTIALS:true}
      max-age: PT1H
    user-status:
      # Live account-status enforcement: after JWT validation the gateway checks the
      # caller's CURRENT status from user-service (a token alone proves identity, not
      # that the account is still active). Base URL matches the user-service route
      # target; results are cached briefly. If user-service is unavailable the gateway
      # fails closed (503 USER_STATUS_UNAVAILABLE) rather than letting requests through.
      base-url: ${PARKIO_USER_SERVICE_URI:http://localhost:8082}
      cache-ttl: ${PARKIO_USER_STATUS_CACHE_TTL:PT30S}
      request-timeout: ${PARKIO_USER_STATUS_TIMEOUT:PT2S}
    session-epoch:
      # Access-token revocation: after JWT validation the gateway compares the token's
      # session_epoch claim with the caller's CURRENT epoch from auth-service. A bumped
      # epoch (logout-all, refresh-token reuse detection, suspension) makes every
      # already-issued access token stale within the cache TTL instead of lingering to
      # its 15-minute expiry. Base URL matches the auth-service route target; results are
      # cached briefly (this TTL is the revocation lag). If auth-service is unavailable
      # the gateway fails closed (503 SESSION_EPOCH_UNAVAILABLE) rather than letting a
      # possibly-revoked token through.
      base-url: ${PARKIO_AUTH_SERVICE_URI:http://localhost:8081}
      cache-ttl: ${PARKIO_SESSION_EPOCH_CACHE_TTL:PT30S}
      request-timeout: ${PARKIO_SESSION_EPOCH_TIMEOUT:PT2S}
  waitlist:
    hash-secret: ${PARKIO_WAITLIST_HASH_SECRET:${PARKIO_GATEWAY_INTERNAL_SECRET:}}
    ip-rate-limit:
      max-attempts: ${PARKIO_WAITLIST_IP_RATE_LIMIT_MAX:10}
      window: ${PARKIO_WAITLIST_IP_RATE_LIMIT_WINDOW:PT1H}
    email-rate-limit:
      max-attempts: ${PARKIO_WAITLIST_EMAIL_RATE_LIMIT_MAX:3}
      window: ${PARKIO_WAITLIST_EMAIL_RATE_LIMIT_WINDOW:PT1H}
