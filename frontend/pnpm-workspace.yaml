packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 reads workspace settings here; preserve the former .npmrc layout.
nodeLinker: hoisted
virtualStoreDirMaxLength: 60
strictDepBuilds: true
# Keep dependency lifecycle scripts denied; unknown new scripts fail the install.
allowBuilds:
  esbuild: false
  msw: false
  unrs-resolver: false

# Existing security and compatibility pins moved from package.json.
overrides:
  'form-data': '4.0.6'
  # CVE-2026-101898 GHSA-3pq3-5fj3-cg6v, CVE-2026-101901 GHSA-542g-h47m-68v8,
  # CVE-2026-101903 GHSA-c29m-xwm3-cm6r, CVE-2026-101905 GHSA-m8m8-qj5v-23w3,
  # CVE-2026-101906 GHSA-mghh-pgcx-3jjj, CVE-2026-101907 GHSA-r4gj-5m52-g5wh,
  # CVE-2026-101909 GHSA-x97p-jq2g-jp4f. api-client still accepts ^1.7.9.
  'axios': '^1.20.0'
  'postcss': '^8.5.23'
  'js-yaml': '4.3.2'
  '@xmldom/xmldom@0.8': '0.8.15'
  '@xmldom/xmldom@0.9': '0.9.12'
  'nanoid': '^3.3.17'
  # CVE-2026-102276 (GHSA-6j4f-fj2g-mc7p) and CVE-2026-102278 (GHSA-qhr7-859c-m2p7).
  # minimatch 3.1.5 and 10.2.5 still accept the vulnerable releases.
  'brace-expansion@1': '^1.1.20'
  'brace-expansion@5': '^5.0.11'
  # GHSA-6h2x-m376-mqjq. cli-config and cli-types 20.2.0 accept ^17.2.1.
  'joi@17': '^17.13.7'
  'react': '19.2.3'
  'react-dom': '19.2.3'
  '@types/react': '19.2.17'
  '@types/react-dom': '19.2.3'
  # SDK 56.0.22 bundledNativeModules.json. The previous 56.0.16 pin contradicted
  # both apps/mobile (56.0.17) and the 56.0.16 ledger (~56.0.17). A split
  # 56.0.16/56.0.22 hoist leaves duplicate native modules; both apps stay on 56.
  '@expo/metro-runtime': '56.0.21'
  '@expo/dom-webview': '56.0.6'
  'browserslist': '^4.28.7'
  'vite@6.4.3>esbuild': '0.27.4'
  # Official image-size 2.0.4 is CJS+ESM and is past CVE-2025-71329/71330
  # (last affected 1.2.1 / 2.0.2). metro@0.84.4 still declares ^1.0.2.
  'image-size': '2.0.4'
