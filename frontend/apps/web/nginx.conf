# nginx template (CL-F39.4, owner decision B9). The image copies it to
# /etc/nginx/templates/default.conf.template; at start the nginx entrypoint sources
# docker/15-parkio-web-csp.envsh, then substitutes ${PARKIO_WEB_CSP_*} (NGINX_ENVSUBST_FILTER)
# and writes /etc/nginx/conf.d/default.conf. connect-src therefore carries the deployment's
# origins, the same ones as the Caddy SPA policy, instead of a static https: wildcard. img-src is
# derived from connect-src (CL-F39.2): 'self', data:, blob: and the same origins.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Preserve the server-wide security headers when a location adds Cache-Control.
    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src ${PARKIO_WEB_CSP_IMG_SRC}; font-src 'self' data:; connect-src ${PARKIO_WEB_CSP_CONNECT_SRC}; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;

    location = /privacy {
        return 302 https://parkio.dev/privacy/;
    }

    location = /terms {
        return 302 https://parkio.dev/terms/;
    }

    location = /explore {
        try_files /explore/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /explore/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
