<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Parkio | Bildirim listesi onayı</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="parkio-waitlist-api" content="https://api.parkio.dev/api/v1">
  <meta name="parkio-waitlist-mode" content="api">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip-link" href="#main">İçeriğe atla</a>
<header class="site-header"><div class="container nav"><a class="brand" href="/" aria-label="Parkio home"><span class="brand-mark"><img src="/assets/parkio-logo.png" alt="Parkio logo" width="44" height="44"></span><span class="brand-copy"><span class="brand-name">Parkio</span><span class="brand-tagline">Park zekâsı</span></span></a>
<div class="lang-switch" role="group" aria-label="Dil seçimi"><button type="button" class="lang-btn is-active" data-lang-option="tr" aria-pressed="true">TR</button><button type="button" class="lang-btn" data-lang-option="en" aria-pressed="false">EN</button></div>
<a class="btn btn-secondary btn-sm" href="/">Parkio</a></div></header>
<main id="main" class="legal">
  <div class="container legal-wrap">
    <div class="kicker">Kayıt bildirimi</div>
    <h1>E-posta onayını tamamlayın</h1>
    <p>Bağlantı önizlemeleri kaydı otomatik onaylamaz. Listede kalmak için aşağıdaki düğmeye basın.</p>
    <form id="waitlist-confirm-form" class="waitlist-panel" novalidate>
      <button class="btn btn-primary" type="submit">Onayla</button>
      <p class="waitlist-feedback" data-waitlist-feedback role="status" aria-live="polite" hidden></p>
      <p class="waitlist-isolated" data-waitlist-isolated-note hidden></p>
    </form>
    <p class="legal-note">GET istekleri onay oluşturmaz. Sorular için <a href="mailto:info@parkio.dev">info@parkio.dev</a>.</p>
  </div>
</main>
<script src="/i18n.js" defer></script>
<script src="/waitlist.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  function applyConfirmCopy(locale) {
    var tr = locale !== 'en';
    document.title = tr ? 'Parkio | Bildirim listesi onayı' : 'Parkio | Confirm notification list';
    document.querySelector('h1').textContent = tr ? 'E-posta onayını tamamlayın' : 'Complete email confirmation';
    document.querySelector('main p').textContent = tr
      ? 'Bağlantı önizlemeleri kaydı otomatik onaylamaz. Listede kalmak için aşağıdaki düğmeye basın.'
      : 'Link previews do not confirm your signup. Press the button below to stay on the list.';
    document.querySelector('#waitlist-confirm-form button').textContent = tr ? 'Onayla' : 'Confirm';
  }
  document.addEventListener('parkio:locale', function (e) { applyConfirmCopy(e.detail.locale); });
  applyConfirmCopy(window.ParkioI18n ? window.ParkioI18n.resolveLocale() : 'tr');
});
</script>
</body>
</html>
