# Parkio infrastructure release pins (N-17 / #378).
# Digests resolved 2026-10-15 via `docker buildx imagetools inspect` for the previously
# mutable tags in docker/docker-compose.yml and the hosted-beta Caddy default.
# Third-party images are digest-only (no Parkio signer attestation). Parkio MinIO/mc
# pins in the base compose file are already immutable; pull_policy is set here so a
# tag move cannot substitute after the provenance gate accepts them.
# Web stays under the stronger map guard (pull_policy: never binding) — do not weaken it.
name: parkio

x-infra-pin: &infra-pin
  pull_policy: never

