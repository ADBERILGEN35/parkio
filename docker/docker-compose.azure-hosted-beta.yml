# Parkio Azure hosted-beta overlay.
#
# Apply after the base, apps, images, and hosted-beta files (never alone).
# Canonical validate command:
#   PARKIO_DEPLOYMENT_PROFILE=azure-hosted-beta \
#     PARKIO_ENV_FILE=docker/.env.azure-hosted-beta.example \
#     ./scripts/validate-hosted-beta-compose.sh
# This profile is deliberately isolated from the normal hosted-beta deployment.
# The deploy scripts also target an explicit runtime service list, while the
# profiles below prevent excluded observability services from being started by
# a plain `up`.

name: parkio

services:
  web:
    platform: linux/amd64
    mem_limit: 64m
  caddy:
    platform: linux/amd64
    mem_limit: 96m

  gateway-service:
    platform: linux/amd64
    environment:
      PARKIO_TRACING_ENABLED: "false"
  auth-service:
    platform: linux/amd64
    environment:
      PARKIO_TRACING_ENABLED: "false"
  user-service:
    platform: linux/amd64
    environment:
      PARKIO_TRACING_ENABLED: "false"
  parking-service:
    platform: linux/amd64
    environment:
      PARKIO_TRACING_ENABLED: "false"
      # Municipal / OSM / İZUM (DATA-WP-02/02C). Defaults remain false; hosted-beta
      # operators set these in docker/.env.azure-hosted-beta. Without explicit Compose
      # mapping, env-file values never reach the container (Spring never sees them).
      PARKIO_MUNICIPAL_ENABLED: ${PARKIO_MUNICIPAL_ENABLED:-false}
      PARKIO_MUNICIPAL_MANUAL_SYNC_ENABLED: ${PARKIO_MUNICIPAL_MANUAL_SYNC_ENABLED:-false}
      # DATA-WP-12 nearby duplicate-presentation (query-time only; canonical/hosted-beta default on).
      PARKIO_MUNICIPAL_DISCOVERY_DUPLICATE_PRESENTATION_ENABLED: ${PARKIO_MUNICIPAL_DISCOVERY_DUPLICATE_PRESENTATION_ENABLED:-true}
      PARKIO_MUNICIPAL_REGISTRY_CANDIDATE_GENERATION_ENABLED: ${PARKIO_MUNICIPAL_REGISTRY_CANDIDATE_GENERATION_ENABLED:-false}
      PARKIO_MUNICIPAL_REGISTRY_REVIEW_API_ENABLED: ${PARKIO_MUNICIPAL_REGISTRY_REVIEW_API_ENABLED:-false}
      PARKIO_MUNICIPAL_REGISTRY_REVIEWED_LINKING_ENABLED: ${PARKIO_MUNICIPAL_REGISTRY_REVIEWED_LINKING_ENABLED:-false}
      PARKIO_MUNICIPAL_REGISTRY_AUTOMATIC_LINKING_ENABLED: "false"
      # DATA-WP-11: hosted-beta Compose default on (leave-on gate is DATA-WP-11A).
      PARKIO_MUNICIPAL_REGISTRY_PROVENANCE_PUBLICATION_ENABLED: ${PARKIO_MUNICIPAL_REGISTRY_PROVENANCE_PUBLICATION_ENABLED:-true}
      PARKIO_MUNICIPAL_REGISTRY_PROVENANCE_INGEST_WRITE_ENABLED: ${PARKIO_MUNICIPAL_REGISTRY_PROVENANCE_INGEST_WRITE_ENABLED:-true}
      PARKIO_MUNICIPAL_IZUM_ENABLED: ${PARKIO_MUNICIPAL_IZUM_ENABLED:-false}
      PARKIO_MUNICIPAL_IZUM_SCHEDULER_ENABLED: ${PARKIO_MUNICIPAL_IZUM_SCHEDULER_ENABLED:-false}
      PARKIO_MUNICIPAL_IZUM_FIXED_DELAY_MS: ${PARKIO_MUNICIPAL_IZUM_FIXED_DELAY_MS:-120000}
      PARKIO_MUNICIPAL_IZUM_CONNECT_TIMEOUT: ${PARKIO_MUNICIPAL_IZUM_CONNECT_TIMEOUT:-2s}
      PARKIO_MUNICIPAL_IZUM_READ_TIMEOUT: ${PARKIO_MUNICIPAL_IZUM_READ_TIMEOUT:-5s}
      PARKIO_MUNICIPAL_IZUM_MAX_RETRIES: ${PARKIO_MUNICIPAL_IZUM_MAX_RETRIES:-2}
      # PROVIDER-ISTANBUL-01: İstanbul / İSPARK. Defaults remain false; enable independently of İZUM.
      PARKIO_MUNICIPAL_ISPARK_ENABLED: ${PARKIO_MUNICIPAL_ISPARK_ENABLED:-false}
      PARKIO_MUNICIPAL_ISPARK_SCHEDULER_ENABLED: ${PARKIO_MUNICIPAL_ISPARK_SCHEDULER_ENABLED:-false}
      PARKIO_MUNICIPAL_ISPARK_FIXED_DELAY_MS: ${PARKIO_MUNICIPAL_ISPARK_FIXED_DELAY_MS:-120000}
      PARKIO_MUNICIPAL_ISPARK_CONNECT_TIMEOUT: ${PARKIO_MUNICIPAL_ISPARK_CONNECT_TIMEOUT:-2s}
      PARKIO_MUNICIPAL_ISPARK_READ_TIMEOUT: ${PARKIO_MUNICIPAL_ISPARK_READ_TIMEOUT:-10s}
      PARKIO_MUNICIPAL_ISPARK_MAX_RETRIES: ${PARKIO_MUNICIPAL_ISPARK_MAX_RETRIES:-1}
      PARKIO_MUNICIPAL_SLA_WARNING_CONSECUTIVE_FAILURES: ${PARKIO_MUNICIPAL_SLA_WARNING_CONSECUTIVE_FAILURES:-3}
      PARKIO_MUNICIPAL_SLA_CRITICAL_CONSECUTIVE_FAILURES: ${PARKIO_MUNICIPAL_SLA_CRITICAL_CONSECUTIVE_FAILURES:-5}
      PARKIO_MUNICIPAL_SLA_WARNING_SECONDS_SINCE_SUCCESS: ${PARKIO_MUNICIPAL_SLA_WARNING_SECONDS_SINCE_SUCCESS:-600}
      PARKIO_MUNICIPAL_SLA_CRITICAL_SECONDS_SINCE_SUCCESS: ${PARKIO_MUNICIPAL_SLA_CRITICAL_SECONDS_SINCE_SUCCESS:-1800}
      PARKIO_MUNICIPAL_SLA_STALE_RUNNING_AFTER_SECONDS: ${PARKIO_MUNICIPAL_SLA_STALE_RUNNING_AFTER_SECONDS:-600}
      PARKIO_MUNICIPAL_SLA_RECOVERING_WINDOW_SECONDS: ${PARKIO_MUNICIPAL_SLA_RECOVERING_WINDOW_SECONDS:-900}
      PARKIO_MUNICIPAL_SLA_FAILURE_WINDOW_SECONDS: ${PARKIO_MUNICIPAL_SLA_FAILURE_WINDOW_SECONDS:-86400}
      PARKIO_MUNICIPAL_OSM_IMPORT_ENABLED: ${PARKIO_MUNICIPAL_OSM_IMPORT_ENABLED:-false}
      PARKIO_MUNICIPAL_OSM_SCHEDULER_ENABLED: ${PARKIO_MUNICIPAL_OSM_SCHEDULER_ENABLED:-false}
      PARKIO_MUNICIPAL_OSM_CONFLATION_ENABLED: ${PARKIO_MUNICIPAL_OSM_CONFLATION_ENABLED:-false}
      PARKIO_MUNICIPAL_OSM_AUTO_MATCH_ENABLED: ${PARKIO_MUNICIPAL_OSM_AUTO_MATCH_ENABLED:-false}
      PARKIO_MUNICIPAL_OSM_PUBLICATION_ENABLED: ${PARKIO_MUNICIPAL_OSM_PUBLICATION_ENABLED:-false}
      PARKIO_MUNICIPAL_OSM_PUBLISH_RESTRICTED: ${PARKIO_MUNICIPAL_OSM_PUBLISH_RESTRICTED:-false}
      PARKIO_MUNICIPAL_OSM_LOCAL_INPUT_PATH: ${PARKIO_MUNICIPAL_OSM_LOCAL_INPUT_PATH:-}
      PARKIO_MUNICIPAL_OSM_ALLOWED_INPUT_DIR: ${PARKIO_MUNICIPAL_OSM_ALLOWED_INPUT_DIR:-}
      PARKIO_MUNICIPAL_OSM_MAX_INPUT_BYTES: ${PARKIO_MUNICIPAL_OSM_MAX_INPUT_BYTES:-52428800}
      PARKIO_MUNICIPAL_OSM_CLIP_VERSION: ${PARKIO_MUNICIPAL_OSM_CLIP_VERSION:-izmir-admin-izbb-2024-10-18-v1}
      PARKIO_MUNICIPAL_OSM_LABEL_POLICY: ${PARKIO_MUNICIPAL_OSM_LABEL_POLICY:-osm-label-v1}
      PARKIO_MUNICIPAL_OSM_BOUNDARY_DIR: ${PARKIO_MUNICIPAL_OSM_BOUNDARY_DIR:-}
      PARKIO_MUNICIPAL_OSM_BOUNDARY_GEOJSON_FILENAME: ${PARKIO_MUNICIPAL_OSM_BOUNDARY_GEOJSON_FILENAME:-izmir-admin-boundary.geojson}
      PARKIO_MUNICIPAL_OSM_BOUNDARY_POLY_FILENAME: ${PARKIO_MUNICIPAL_OSM_BOUNDARY_POLY_FILENAME:-izmir-admin-boundary.poly}
      PARKIO_MUNICIPAL_OSM_BOUNDARY_GEOJSON_SHA256: ${PARKIO_MUNICIPAL_OSM_BOUNDARY_GEOJSON_SHA256:-}
      PARKIO_MUNICIPAL_OSM_BOUNDARY_SOURCE_SHA256: ${PARKIO_MUNICIPAL_OSM_BOUNDARY_SOURCE_SHA256:-6f4f43e4ce8139ddca4606582d903f047cb7c73810f8b876541a1ec3994ffd89}
      PARKIO_MUNICIPAL_IZELMAN_ENABLED: ${PARKIO_MUNICIPAL_IZELMAN_ENABLED:-false}
      PARKIO_MUNICIPAL_IZELMAN_FACILITY_IMPORT_ENABLED: ${PARKIO_MUNICIPAL_IZELMAN_FACILITY_IMPORT_ENABLED:-false}
      PARKIO_MUNICIPAL_IZELMAN_ROADSIDE_IMPORT_ENABLED: ${PARKIO_MUNICIPAL_IZELMAN_ROADSIDE_IMPORT_ENABLED:-false}
      PARKIO_MUNICIPAL_IZELMAN_TARIFF_IMPORT_ENABLED: ${PARKIO_MUNICIPAL_IZELMAN_TARIFF_IMPORT_ENABLED:-false}
      PARKIO_MUNICIPAL_IZELMAN_FACILITY_PUBLICATION_ENABLED: ${PARKIO_MUNICIPAL_IZELMAN_FACILITY_PUBLICATION_ENABLED:-false}
      PARKIO_MUNICIPAL_IZELMAN_ROADSIDE_PUBLICATION_ENABLED: ${PARKIO_MUNICIPAL_IZELMAN_ROADSIDE_PUBLICATION_ENABLED:-false}
      PARKIO_MUNICIPAL_IZELMAN_TARIFF_PUBLICATION_ENABLED: ${PARKIO_MUNICIPAL_IZELMAN_TARIFF_PUBLICATION_ENABLED:-false}
      PARKIO_MUNICIPAL_IZELMAN_SCHEDULER_ENABLED: ${PARKIO_MUNICIPAL_IZELMAN_SCHEDULER_ENABLED:-false}
      PARKIO_MUNICIPAL_IZELMAN_CANDIDATE_GENERATION_ENABLED: ${PARKIO_MUNICIPAL_IZELMAN_CANDIDATE_GENERATION_ENABLED:-false}
      PARKIO_MUNICIPAL_IZELMAN_AUTO_MATCH_ENABLED: "false"
      PARKIO_MUNICIPAL_IZELMAN_ALLOWED_INPUT_DIR: ${PARKIO_MUNICIPAL_IZELMAN_ALLOWED_INPUT_DIR:-}
      PARKIO_MUNICIPAL_IZELMAN_MAX_INPUT_BYTES: ${PARKIO_MUNICIPAL_IZELMAN_MAX_INPUT_BYTES:-5242880}
      # DATA-WP-15: operator quality/coverage report API. Hosted-beta default off (leave-on gate is DATA-WP-15A).
      PARKIO_MUNICIPAL_OPS_QUALITY_REPORT_ENABLED: ${PARKIO_MUNICIPAL_OPS_QUALITY_REPORT_ENABLED:-false}
      PARKIO_MUNICIPAL_OPS_SOURCE_MODE_SLA_ENABLED: ${PARKIO_MUNICIPAL_OPS_SOURCE_MODE_SLA_ENABLED:-false}
      # DATA-WP-18: district coverage section. Hosted-beta default off (leave-on gate is DATA-WP-18A).
      PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_ENABLED: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_ENABLED:-false}
      PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_ASSET_PATH: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_ASSET_PATH:-}
      PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_EXPECTED_SHA256: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_EXPECTED_SHA256:-6f4f43e4ce8139ddca4606582d903f047cb7c73810f8b876541a1ec3994ffd89}
      # DATA-WP-19: topology policy + normalized asset. Default off until DATA-WP-19A.
      PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_TOPOLOGY_POLICY_ENABLED: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_TOPOLOGY_POLICY_ENABLED:-false}
      PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_TOPOLOGY_POLICY_VERSION: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_TOPOLOGY_POLICY_VERSION:-izmir-district-topology-v1}
      PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_NORMALIZED_ASSET_PATH: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_NORMALIZED_ASSET_PATH:-}
      PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_NORMALIZED_ASSET_SHA256: ${PARKIO_MUNICIPAL_OPS_DISTRICT_COVERAGE_NORMALIZED_ASSET_SHA256:-0c7457122d13fa02eba1258b6cda5cc28bfb7d64150e4e7db131f40611a655ec}
    volumes:
      # Read-only ops interchange for OSM GeoJSON (outside Git). Created by operators.
      - /opt/parkio/ops/data-wp-08/boundary:/opt/parkio/ops/data-wp-08/boundary:ro
      - /opt/parkio/ops/data-wp-19/district-topology:/opt/parkio/ops/data-wp-19/district-topology:ro
      - /opt/parkio/ops/data-wp-02b:/opt/parkio/ops/data-wp-02b:ro
  media-service:
    platform: linux/amd64
    environment:
      PARKIO_TRACING_ENABLED: "false"
  gamification-service:
    platform: linux/amd64
    environment:
      PARKIO_TRACING_ENABLED: "false"
  notification-service:
    platform: linux/amd64
    environment:
      PARKIO_TRACING_ENABLED: "false"
  moderation-service:
    platform: linux/amd64
    environment:
      PARKIO_TRACING_ENABLED: "false"
  ai-validation-service:
    platform: linux/amd64
    environment:
      PARKIO_TRACING_ENABLED: "false"
  analytics-service:
    platform: linux/amd64
    environment:
      PARKIO_TRACING_ENABLED: "false"

  postgres-auth:
    platform: linux/amd64
  postgres-gateway:
    platform: linux/amd64
  postgres-user:
    platform: linux/amd64
  postgres-parking:
    platform: linux/amd64
  postgres-media:
    platform: linux/amd64
  postgres-gamification:
    platform: linux/amd64
  postgres-notification:
    platform: linux/amd64
  postgres-moderation:
    platform: linux/amd64
  postgres-analytics:
    platform: linux/amd64
  postgres-ai-validation:
    platform: linux/amd64

  redis:
    platform: linux/amd64
  kafka:
    platform: linux/amd64
    mem_limit: 1024m
    environment:
      KAFKA_HEAP_OPTS: -Xms640m -Xmx640m
  kafka-exporter:
    platform: linux/amd64
  blackbox-exporter:
    platform: linux/amd64
  node-exporter:
    platform: linux/amd64
  minio:
    platform: linux/amd64
  minio-setup:
    platform: linux/amd64
    mem_limit: 64m
    cpus: "0.25"
    pids_limit: 128
  clamav:
    platform: linux/amd64

  prometheus:
    platform: linux/amd64
    mem_limit: 576m
    command: !override
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
  grafana:
    platform: linux/amd64
    mem_limit: 224m
    depends_on: !override
      prometheus:
        condition: service_healthy

  alertmanager:
    profiles: [azure-disabled-observability]
  loki:
    profiles: [azure-disabled-observability]
  promtail:
    profiles: [azure-disabled-observability]
  tempo:
    profiles: [azure-disabled-observability]
