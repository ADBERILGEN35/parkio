groups:
  - name: parkio-operational-readiness-baselining
    rules:
      - alert: GatewayAvailabilityBaselining
        expr: parkio:gateway:availability_ratio5m < 0.995
        for: 30m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: Gateway availability below PROPOSED 99.5% (baselining)
          runbook_url: docs/operations/runbooks/auth-outage.md
      - alert: ParkingAvailabilityBaselining
        expr: parkio:parking:availability_ratio5m < 0.99
        for: 30m
        labels:
          severity: warning
          owner: parking
        annotations:
          summary: Parking availability below PROPOSED 99% (baselining)
          runbook_url: docs/operations/runbooks/mutation-failure-rate.md