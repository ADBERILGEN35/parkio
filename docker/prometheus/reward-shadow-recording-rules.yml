groups:
  - name: reward-shadow-recording
    interval: 30s
    rules:
      - record: parkio:reward_shadow:success_rate5m
        expr: |
          sum(rate(parkio_parking_reward_evaluation_success_total[5m]))
          /
          clamp_min(
            sum(rate(parkio_parking_reward_outcome_received_total[5m])),
            1
          )

      - record: parkio:reward_shadow:duplicate_rate5m
        expr: |
          sum(rate(parkio_parking_reward_evaluation_duplicate_total[5m]))
          /
          clamp_min(
            sum(rate(parkio_parking_reward_outcome_received_total[5m])),
            1
          )

      - record: parkio:reward_shadow:failure_rate5m
        expr: |
          sum(rate(parkio_parking_reward_evaluation_failure_total[5m]))
          /
          clamp_min(
            sum(rate(parkio_parking_reward_outcome_received_total[5m])),
            1
          )

      - record: parkio:reward_shadow:eligible_ratio5m
        expr: |
          (
            sum(rate(parkio_parking_reward_contribution_produced_total{eligibility="ELIGIBLE"}[5m]))
            +
            sum(rate(parkio_parking_reward_contribution_produced_total{eligibility="DEFERRED_FINALITY"}[5m]))
          )
          /
          clamp_min(
            sum(rate(parkio_parking_reward_contribution_produced_total[5m])),
            1
          )
