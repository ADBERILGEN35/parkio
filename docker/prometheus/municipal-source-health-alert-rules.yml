groups:
  - name: parkio-municipal-source-health-alerts
    rules:
      # --- SCHEDULED source (İZUM): age + failure + stale RUNNING ---
      - alert: MunicipalSourceConsecutiveFailuresWarning
        expr: |
          parkio_municipal_source_consecutive_failures{source_key="izmir-izum-otoparklar",source_mode="SCHEDULED"} >= 3
          and on(source_key)
          parkio_municipal_source_operational_state{source_key="izmir-izum-otoparklar",state="DISABLED"} == 0
        for: 5m
        labels:
          severity: warning
          owner: parking
          source_key: izmir-izum-otoparklar
          source_mode: SCHEDULED
        annotations:
          summary: Municipal source consecutive failures reached warning threshold
          description: IZUM sync consecutive failures are elevated. Check operational SLA state and bounded error category via actuator health details.
          runbook_url: docs/operations/municipal-parking-source-runbook.md

      - alert: MunicipalSourceConsecutiveFailuresCritical
        expr: |
          parkio_municipal_source_consecutive_failures{source_key="izmir-izum-otoparklar",source_mode="SCHEDULED"} >= 5
          and on(source_key)
          parkio_municipal_source_operational_state{source_key="izmir-izum-otoparklar",state="DISABLED"} == 0
        for: 5m
        labels:
          severity: critical
          owner: parking
          source_key: izmir-izum-otoparklar
          source_mode: SCHEDULED
        annotations:
          summary: Municipal source consecutive failures reached critical threshold
          description: IZUM sync consecutive failures are critical. Distinguish upstream timeout from schema_contract using bounded error_category.
          runbook_url: docs/operations/municipal-parking-source-runbook.md

      - alert: MunicipalSourceSecondsSinceSuccessWarning
        expr: |
          parkio_municipal_source_seconds_since_success{source_key="izmir-izum-otoparklar",source_mode="SCHEDULED"} >= 600
          and on(source_key)
          parkio_municipal_source_operational_state{source_key="izmir-izum-otoparklar",state="DISABLED"} == 0
        for: 5m
        labels:
          severity: warning
          owner: parking
          source_key: izmir-izum-otoparklar
          source_mode: SCHEDULED
        annotations:
          summary: Municipal source seconds since last success reached warning threshold
          description: IZUM has not completed a successful sync within the warning SLA window. Age alerts apply only to SCHEDULED sources.
          runbook_url: docs/operations/municipal-parking-source-runbook.md

      - alert: MunicipalSourceSecondsSinceSuccessCritical
        expr: |
          parkio_municipal_source_seconds_since_success{source_key="izmir-izum-otoparklar",source_mode="SCHEDULED"} >= 1800
          and on(source_key)
          parkio_municipal_source_operational_state{source_key="izmir-izum-otoparklar",state="DISABLED"} == 0
        for: 5m
        labels:
          severity: critical
          owner: parking
          source_key: izmir-izum-otoparklar
          source_mode: SCHEDULED
        annotations:
          summary: Municipal source seconds since last success reached critical threshold
          description: IZUM has not completed a successful sync within the critical SLA window. Public occupancy may already be STALE/null. OPERATOR_IMPORTED sources are intentionally excluded from age-only alerts.
          runbook_url: docs/operations/municipal-parking-source-runbook.md

      - alert: MunicipalSourceStaleRunningOperation
        expr: |
          parkio_municipal_source_stale_running_operations{source_key="izmir-izum-otoparklar",source_mode="SCHEDULED"} > 0
          and on(source_key)
          parkio_municipal_source_operational_state{source_key="izmir-izum-otoparklar",state="DISABLED"} == 0
        for: 10m
        labels:
          severity: warning
          owner: parking
          source_key: izmir-izum-otoparklar
          source_mode: SCHEDULED
        annotations:
          summary: Municipal source has a stale RUNNING synchronization operation
          description: A municipal sync run remained RUNNING beyond the stale-running SLA threshold.
          runbook_url: docs/operations/municipal-parking-source-runbook.md

      - alert: MunicipalSourceRecovered
        expr: increase(parkio_municipal_source_recoveries_total{source_key="izmir-izum-otoparklar"}[15m]) > 0
        for: 0m
        labels:
          severity: info
          owner: parking
          source_key: izmir-izum-otoparklar
          source_mode: SCHEDULED
        annotations:
          summary: Municipal source recovered after consecutive failures
          description: IZUM completed a successful sync after a failure streak. Confirm occupancy freshness returned to LIVE or AGING.
          runbook_url: docs/operations/municipal-parking-source-runbook.md

      # --- OPERATOR_IMPORTED source (OSM): failures + stale RUNNING only (no age-only alerts) ---
      - alert: MunicipalOsmConsecutiveFailuresWarning
        expr: |
          parkio_municipal_source_consecutive_failures{source_key="osm-geofabrik-turkey",source_mode="OPERATOR_IMPORTED"} >= 3
          and on(source_key)
          parkio_municipal_source_operational_state{source_key="osm-geofabrik-turkey",state="DISABLED"} == 0
        for: 5m
        labels:
          severity: warning
          owner: parking
          source_key: osm-geofabrik-turkey
          source_mode: OPERATOR_IMPORTED
        annotations:
          summary: OSM operator import consecutive failures reached warning threshold
          description: OSM import failures are elevated. Seconds-since-success remains observational for OPERATOR_IMPORTED sources and does not page.
          runbook_url: docs/operations/municipal-parking-source-runbook.md

      - alert: MunicipalOsmConsecutiveFailuresCritical
        expr: |
          parkio_municipal_source_consecutive_failures{source_key="osm-geofabrik-turkey",source_mode="OPERATOR_IMPORTED"} >= 5
          and on(source_key)
          parkio_municipal_source_operational_state{source_key="osm-geofabrik-turkey",state="DISABLED"} == 0
        for: 5m
        labels:
          severity: critical
          owner: parking
          source_key: osm-geofabrik-turkey
          source_mode: OPERATOR_IMPORTED
        annotations:
          summary: OSM operator import consecutive failures reached critical threshold
          description: OSM import consecutive failures are critical. Age-only CRITICAL is not used for OPERATOR_IMPORTED sources.
          runbook_url: docs/operations/municipal-parking-source-runbook.md

      - alert: MunicipalOsmStaleRunningOperation
        expr: |
          parkio_municipal_source_stale_running_operations{source_key="osm-geofabrik-turkey",source_mode="OPERATOR_IMPORTED"} > 0
          and on(source_key)
          parkio_municipal_source_operational_state{source_key="osm-geofabrik-turkey",state="DISABLED"} == 0
        for: 10m
        labels:
          severity: warning
          owner: parking
          source_key: osm-geofabrik-turkey
          source_mode: OPERATOR_IMPORTED
        annotations:
          summary: OSM operator import has a stale RUNNING operation
          description: An OSM import run remained RUNNING beyond the stale-running SLA threshold.
          runbook_url: docs/operations/municipal-parking-source-runbook.md

      - alert: MunicipalOsmRecovered
        expr: increase(parkio_municipal_source_recoveries_total{source_key="osm-geofabrik-turkey"}[15m]) > 0
        for: 0m
        labels:
          severity: info
          owner: parking
          source_key: osm-geofabrik-turkey
          source_mode: OPERATOR_IMPORTED
        annotations:
          summary: OSM operator import recovered after consecutive failures
          description: OSM completed a successful import after a failure streak.
          runbook_url: docs/operations/municipal-parking-source-runbook.md
