# promtool unit tests for N-13 / #413 waitlist / Slack / budget-gate rules.
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  - name: healthy signals stay quiet
    interval: 1m
    input_series:
      - series: 'parkio_waitlist_ops_outbox_pending'
        values: "0x40"
      - series: 'parkio_waitlist_ops_outbox_oldest_pending_age_seconds'
        values: "0x40"
      - series: 'parkio_waitlist_ops_inbox_backlog'
        values: "0x40"
      - series: 'parkio_slack_biz_delivery_unknown'
        values: "0x40"
      - series: 'parkio_slack_biz_dlt_rows'
        values: "0x40"
      - series: 'parkio_slack_biz_textfile_last_success_unixtime'
        values: "0+60x40"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "1x40"
      - series: 'parkio_nr_budget_gate_probe_success'
        values: "1x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: WaitlistOpsOutboxPending
        exp_alerts: []
      - eval_time: 35m
        alertname: WaitlistOpsOutboxStale
        exp_alerts: []
      - eval_time: 35m
        alertname: WaitlistOpsInboxBacklog
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizDeliveryUnknown
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizDltGrowth
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizTextfileStale
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizTextfileAbsent
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizRelayStopped
        exp_alerts: []
      - eval_time: 35m
        alertname: NrBudgetGateExhausted
        exp_alerts: []

  - name: slack biz relay stopped fires after 15m and resolves when the relay runs again
    interval: 1m
    input_series:
      - series: 'parkio_slack_biz_relay_db_open'
        values: "0x30 1x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: SlackBizRelayStopped
        exp_alerts: []
      - eval_time: 20m
        alertname: SlackBizRelayStopped
        exp_alerts:
          - exp_labels:
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "No Slack biz relay process is running"
              description: "Neither Slack biz relay process has held the delivery DB open for 15m. Check parkio-slack-biz-worker and parkio-slack-biz-waitlist-consumer; queued events wait until they run."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizrelaystopped"
      - eval_time: 38m
        alertname: SlackBizRelayStopped
        exp_alerts: []

  - name: waitlist pending fires then resolves
    interval: 1m
    input_series:
      - series: 'parkio_waitlist_ops_outbox_pending'
        values: "3x35 0x10"
    alert_rule_test:
      - eval_time: 25m
        alertname: WaitlistOpsOutboxPending
        exp_alerts: []
      - eval_time: 35m
        alertname: WaitlistOpsOutboxPending
        exp_alerts:
          - exp_labels:
              alertname: WaitlistOpsOutboxPending
              severity: warning
              service: gateway-service
            exp_annotations:
              summary: "Waitlist ops outbox has pending exports"
              description: "3 waitlist ops notification(s) pending export for >30m. Check gateway WaitlistOpsNotificationExporter and the slack_biz waitlist inbox directory."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#waitlistopsoutboxpending"
      - eval_time: 50m
        alertname: WaitlistOpsOutboxPending
        exp_alerts: []

  - name: waitlist oldest age and inbox backlog fire
    interval: 1m
    input_series:
      - series: 'parkio_waitlist_ops_outbox_oldest_pending_age_seconds'
        values: "2000x20"
      - series: 'parkio_waitlist_ops_inbox_backlog'
        values: "80x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: WaitlistOpsOutboxStale
        exp_alerts:
          - exp_labels:
              alertname: WaitlistOpsOutboxStale
              severity: warning
              service: gateway-service
            exp_annotations:
              summary: "Oldest waitlist ops outbox row is stale"
              description: "Oldest PENDING waitlist ops outbox row is 2000s old. Export may be deferred (inbox backlog / disk) or the exporter stopped."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#waitlistopsoutboxstale"
      - eval_time: 15m
        alertname: WaitlistOpsInboxBacklog
        exp_alerts:
          - exp_labels:
              alertname: WaitlistOpsInboxBacklog
              severity: warning
              service: gateway-service
            exp_annotations:
              summary: "Waitlist ops slack_biz inbox backlog high"
              description: "Waitlist ops inbox backlog is 80 envelopes. Consume or clear the inbox before export resumes."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#waitlistopsinboxbacklog"

  - name: slack delivery_unknown and dlt growth fire
    interval: 1m
    input_series:
      - series: 'parkio_slack_biz_delivery_unknown'
        values: "2x20"
      - series: 'parkio_slack_biz_dlt_rows'
        values: "1x5 4x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: SlackBizDeliveryUnknown
        exp_alerts:
          - exp_labels:
              alertname: SlackBizDeliveryUnknown
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz has delivery_unknown events"
              description: "2 Slack biz delivery_unknown row(s). Resolve with worker --resolve-unknown or inspect --list-unknown; do not silently drop."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizdeliveryunknown"
      - eval_time: 20m
        alertname: SlackBizDltGrowth
        exp_alerts:
          - exp_labels:
              alertname: SlackBizDltGrowth
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz DLT table is growing"
              description: "Slack biz DLT table depth increased over the last hour. Inspect --list-dlt and redrive or archive deliberately."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizdltgrowth"

  - name: nr budget gate absent stays quiet
    interval: 1m
    input_series:
      # No parkio_nr_budget_gate_probe_success — pilot/gate not running.
      - series: 'parkio_slack_biz_textfile_last_success_unixtime'
        values: "0+60x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: NrBudgetGateExhausted
        exp_alerts: []

  - name: nr budget gate 507 probe failure fires then recovers
    interval: 1m
    input_series:
      - series: 'parkio_nr_budget_gate_probe_success'
        values: "0x10 1x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: NrBudgetGateExhausted
        exp_alerts: []
      - eval_time: 5m
        alertname: NrBudgetGateExhausted
        exp_alerts:
          - exp_labels:
              alertname: NrBudgetGateExhausted
              severity: warning
              service: nr-budget-gate
            exp_annotations:
              summary: "NR budget gate unhealthy or exhausted"
              description: "NR budget-gate /health probe reported failure for >2m (HTTP 507 exhaustion or probe error while the gate container is running). Check /stats; coordinate any budget_gate.py changes with #104."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#nrbudgetgateexhausted"
      - eval_time: 20m
        alertname: NrBudgetGateExhausted
        exp_alerts: []

  - name: slack textfile stale fires
    interval: 1m
    input_series:
      # Fixed stamp far in the past relative to eval_time wall clock.
      - series: 'parkio_slack_biz_textfile_last_success_unixtime'
        values: "0x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: SlackBizTextfileStale
        exp_alerts: []
      - eval_time: 20m
        alertname: SlackBizTextfileStale
        exp_alerts:
          - exp_labels:
              alertname: SlackBizTextfileStale
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz textfile metrics are stale"
              description: "parkio_slack_biz_textfile_last_success_unixtime is 1200s behind wall clock. Check parkio-slack-biz-textfile-export.timer and the node-exporter textfile mount."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbiztextfilestale"

  - name: slack textfile absent fires
    interval: 1m
    input_series:
      # No parkio_slack_biz_textfile_last_success_unixtime series at all.
      - series: 'parkio_slack_biz_delivery_unknown'
        values: "0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: SlackBizTextfileAbsent
        exp_alerts: []
      - eval_time: 20m
        alertname: SlackBizTextfileAbsent
        exp_alerts:
          - exp_labels:
              alertname: SlackBizTextfileAbsent
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz textfile metrics are absent"
              description: "No parkio_slack_biz_textfile_last_success_unixtime series for >15m. Install/enable parkio-slack-biz-textfile-export.timer or repair the textfile collector path."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbiztextfileabsent"
