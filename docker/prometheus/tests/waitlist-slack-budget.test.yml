# promtool unit tests for N-13 / #413 waitlist / Slack / budget-gate rules.
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  - name: healthy signals stay quiet
    interval: 1m
    input_series:
      - series: 'parkio_waitlist_ops_outbox_pending'
        values: "0x40"
      - series: 'parkio_waitlist_ops_outbox_oldest_pending_age_seconds'
        values: "0x40"
      - series: 'parkio_waitlist_ops_inbox_backlog'
        values: "0x40"
      - series: 'parkio_slack_biz_delivery_unknown'
        values: "0x40"
      - series: 'parkio_slack_biz_dlt_rows'
        values: "0x40"
      - series: 'parkio_slack_biz_textfile_last_success_unixtime'
        values: "0+60x40"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "1x40"
      - series: 'parkio_slack_biz_worker_heartbeat_age_seconds'
        values: "1x40"
      - series: 'parkio_slack_biz_oldest_queued_age_seconds'
        values: "0x40"
      - series: 'parkio_slack_biz_delivery_enabled'
        values: "1x40"
      - series: 'parkio_nr_budget_gate_probe_success'
        values: "1x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: WaitlistOpsOutboxPending
        exp_alerts: []
      - eval_time: 35m
        alertname: WaitlistOpsOutboxStale
        exp_alerts: []
      - eval_time: 35m
        alertname: WaitlistOpsInboxBacklog
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizDeliveryUnknown
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizDltGrowth
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizTextfileStale
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizTextfileAbsent
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizRelayStopped
        exp_alerts: []
      - eval_time: 35m
        alertname: NrBudgetGateExhausted
        exp_alerts: []

  # SlackBizRelayStopped (#544). Inf cannot take the expanding notation, so the groups that carry it
  # sample every 5m (within the 5m lookback, so every 1m evaluation sees a value).
  - name: slack biz relay crash with side files left behind fires and resolves after a restart
    interval: 1m
    input_series:
      # SIGKILL at 0m: the side files keep relay_db_open at 1 while the age grows from the last
      # heartbeat. A restarted worker heartbeats again from 26m.
      - series: 'parkio_slack_biz_worker_heartbeat_age_seconds'
        values: "0+60x25 1x15"
      - series: 'parkio_slack_biz_delivery_enabled'
        values: "1x40"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "1x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: SlackBizRelayStopped
        exp_alerts: []
      - eval_time: 25m
        alertname: SlackBizRelayStopped
        exp_alerts:
          - exp_labels:
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz delivery worker is down or stuck"
              description: "While delivery is enabled, the Slack biz delivery worker's lock heartbeat has been older than 5m for 15m (crashed, killed, stopped, hung, enabled without a webhook or without a worker restart), or the oldest queued or retry row has been older than 15m for 15m (a crash loop or a worker that takes no rows); or no relay process has held the delivery DB open for 15m. Check parkio-slack-biz-worker and parkio-slack-biz-waitlist-consumer; queued events wait until they run."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizrelaystopped"
      - eval_time: 30m
        alertname: SlackBizRelayStopped
        exp_alerts: []

  - name: slack biz worker stopped cleanly while the consumer keeps the DB open fires
    interval: 5m
    input_series:
      # The clean stop releases the lock (+Inf); the running consumer keeps relay_db_open at 1.
      - series: 'parkio_slack_biz_worker_heartbeat_age_seconds'
        values: "1 Inf Inf Inf Inf Inf"
      - series: 'parkio_slack_biz_delivery_enabled'
        values: "1x5"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "1x5"
    alert_rule_test:
      - eval_time: 15m
        alertname: SlackBizRelayStopped
        exp_alerts: []
      - eval_time: 25m
        alertname: SlackBizRelayStopped
        exp_alerts:
          - exp_labels:
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz delivery worker is down or stuck"
              description: "While delivery is enabled, the Slack biz delivery worker's lock heartbeat has been older than 5m for 15m (crashed, killed, stopped, hung, enabled without a webhook or without a worker restart), or the oldest queued or retry row has been older than 15m for 15m (a crash loop or a worker that takes no rows); or no relay process has held the delivery DB open for 15m. Check parkio-slack-biz-worker and parkio-slack-biz-waitlist-consumer; queued events wait until they run."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizrelaystopped"

  - name: slack biz relay fully closed while delivery is disabled fires and resolves when the relay runs again
    interval: 5m
    input_series:
      # Both units stopped cleanly: no side files and no lock. The heartbeat arm is off while delivery
      # is disabled; relay_db_open == 0 still fires. Both units run again from 30m.
      - series: 'parkio_slack_biz_worker_heartbeat_age_seconds'
        values: "Inf Inf Inf Inf Inf Inf 1 1 1"
      - series: 'parkio_slack_biz_delivery_enabled'
        values: "0x8"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "0x5 1x3"
    alert_rule_test:
      - eval_time: 10m
        alertname: SlackBizRelayStopped
        exp_alerts: []
      - eval_time: 20m
        alertname: SlackBizRelayStopped
        exp_alerts:
          - exp_labels:
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz delivery worker is down or stuck"
              description: "While delivery is enabled, the Slack biz delivery worker's lock heartbeat has been older than 5m for 15m (crashed, killed, stopped, hung, enabled without a webhook or without a worker restart), or the oldest queued or retry row has been older than 15m for 15m (a crash loop or a worker that takes no rows); or no relay process has held the delivery DB open for 15m. Check parkio-slack-biz-worker and parkio-slack-biz-waitlist-consumer; queued events wait until they run."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizrelaystopped"
      - eval_time: 38m
        alertname: SlackBizRelayStopped
        exp_alerts: []

  - name: slack biz relay stays quiet while delivery is disabled
    interval: 1m
    input_series:
      # A disabled worker takes the lock once and then never heartbeats, so its age only grows.
      - series: 'parkio_slack_biz_worker_heartbeat_age_seconds'
        values: "0+60x40"
      - series: 'parkio_slack_biz_delivery_enabled'
        values: "0x40"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "1x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: SlackBizRelayStopped
        exp_alerts: []

  # Mixed-version rollout (#599). An exporter from before #544 publishes relay_db_open but neither the
  # heartbeat nor the enabled series (nor the queue age). The other arms are then empty and the rule
  # reduces to relay_db_open == 0, so rule reload and script update are safe in either order.
  - name: slack biz relay with relay_db_open alone fires on 0 and stays quiet on 1
    interval: 1m
    input_series:
      - series: 'parkio_slack_biz_relay_db_open{instance="relay-stopped"}'
        values: "0x30"
      - series: 'parkio_slack_biz_relay_db_open{instance="relay-running"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: SlackBizRelayStopped
        exp_alerts: []
      - eval_time: 20m
        alertname: SlackBizRelayStopped
        exp_alerts:
          - exp_labels:
              instance: relay-stopped
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz delivery worker is down or stuck"
              description: "While delivery is enabled, the Slack biz delivery worker's lock heartbeat has been older than 5m for 15m (crashed, killed, stopped, hung, enabled without a webhook or without a worker restart), or the oldest queued or retry row has been older than 15m for 15m (a crash loop or a worker that takes no rows); or no relay process has held the delivery DB open for 15m. Check parkio-slack-biz-worker and parkio-slack-biz-waitlist-consumer; queued events wait until they run."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizrelaystopped"

  - name: slack biz relay with the heartbeat and relay_db_open arms both true gives exactly one alert
    interval: 5m
    input_series:
      # Delivery enabled, both units stopped cleanly, nothing queued: no lock (+Inf) and no side files.
      # Every arm comes from the same scrape with the same labels, so `or` keeps a single series.
      - series: 'parkio_slack_biz_worker_heartbeat_age_seconds'
        values: "Inf Inf Inf Inf Inf Inf"
      - series: 'parkio_slack_biz_oldest_queued_age_seconds'
        values: "0x5"
      - series: 'parkio_slack_biz_delivery_enabled'
        values: "1x5"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "0x5"
    alert_rule_test:
      - eval_time: 10m
        alertname: SlackBizRelayStopped
        exp_alerts: []
      - eval_time: 20m
        alertname: SlackBizRelayStopped
        exp_alerts:
          - exp_labels:
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz delivery worker is down or stuck"
              description: "While delivery is enabled, the Slack biz delivery worker's lock heartbeat has been older than 5m for 15m (crashed, killed, stopped, hung, enabled without a webhook or without a worker restart), or the oldest queued or retry row has been older than 15m for 15m (a crash loop or a worker that takes no rows); or no relay process has held the delivery DB open for 15m. Check parkio-slack-biz-worker and parkio-slack-biz-waitlist-consumer; queued events wait until they run."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizrelaystopped"

  - name: slack biz relay with every arm true gives exactly one alert
    interval: 5m
    input_series:
      # As above, with rows queued before the stop: the queue ages as well.
      - series: 'parkio_slack_biz_worker_heartbeat_age_seconds'
        values: "Inf Inf Inf Inf Inf Inf"
      - series: 'parkio_slack_biz_oldest_queued_age_seconds'
        values: "1800+300x5"
      - series: 'parkio_slack_biz_delivery_enabled'
        values: "1x5"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "0x5"
    alert_rule_test:
      - eval_time: 20m
        alertname: SlackBizRelayStopped
        exp_alerts:
          - exp_labels:
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz delivery worker is down or stuck"
              description: "While delivery is enabled, the Slack biz delivery worker's lock heartbeat has been older than 5m for 15m (crashed, killed, stopped, hung, enabled without a webhook or without a worker restart), or the oldest queued or retry row has been older than 15m for 15m (a crash loop or a worker that takes no rows); or no relay process has held the delivery DB open for 15m. Check parkio-slack-biz-worker and parkio-slack-biz-waitlist-consumer; queued events wait until they run."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizrelaystopped"

  # Oldest queued or retry row age (#599).
  - name: slack biz worker that takes no rows fires on the queue age and resolves once the row is delivered
    interval: 1m
    input_series:
      # A worker crash-looping after it takes the lock: every start refreshes the heartbeat and the side
      # files stay, but no row is taken, so the row admitted at 0m keeps aging. A fixed worker delivers
      # it at 41m.
      - series: 'parkio_slack_biz_worker_heartbeat_age_seconds'
        values: "1x50"
      - series: 'parkio_slack_biz_oldest_queued_age_seconds'
        values: "0+60x40 0x10"
      - series: 'parkio_slack_biz_delivery_enabled'
        values: "1x50"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "1x50"
    alert_rule_test:
      - eval_time: 30m
        alertname: SlackBizRelayStopped
        exp_alerts: []
      - eval_time: 35m
        alertname: SlackBizRelayStopped
        exp_alerts:
          - exp_labels:
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz delivery worker is down or stuck"
              description: "While delivery is enabled, the Slack biz delivery worker's lock heartbeat has been older than 5m for 15m (crashed, killed, stopped, hung, enabled without a webhook or without a worker restart), or the oldest queued or retry row has been older than 15m for 15m (a crash loop or a worker that takes no rows); or no relay process has held the delivery DB open for 15m. Check parkio-slack-biz-worker and parkio-slack-biz-waitlist-consumer; queued events wait until they run."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizrelaystopped"
      - eval_time: 45m
        alertname: SlackBizRelayStopped
        exp_alerts: []

  - name: slack biz queue age stays quiet while delivery is disabled
    interval: 1m
    input_series:
      # Rollout step 3: rows wait as queued and nothing is sent. The disabled worker took the lock once
      # and never heartbeats.
      - series: 'parkio_slack_biz_worker_heartbeat_age_seconds'
        values: "0+60x40"
      - series: 'parkio_slack_biz_oldest_queued_age_seconds'
        values: "0+60x40"
      - series: 'parkio_slack_biz_delivery_enabled'
        values: "0x40"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "1x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: SlackBizRelayStopped
        exp_alerts: []

  - name: slack biz backlog that drains within 15m of enabling delivery stays quiet
    interval: 1m
    input_series:
      # Rows queued while delivery was disabled are two hours old when delivery is enabled at 0m. The
      # worker delivers them oldest first; from 6m nothing waits.
      - series: 'parkio_slack_biz_worker_heartbeat_age_seconds'
        values: "1x30"
      - series: 'parkio_slack_biz_oldest_queued_age_seconds'
        values: "7200 6000 4800 3600 2400 1200 0x24"
      - series: 'parkio_slack_biz_delivery_enabled'
        values: "1x30"
      - series: 'parkio_slack_biz_relay_db_open'
        values: "1x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: SlackBizRelayStopped
        exp_alerts: []
      - eval_time: 25m
        alertname: SlackBizRelayStopped
        exp_alerts: []

  - name: waitlist pending fires then resolves
    interval: 1m
    input_series:
      - series: 'parkio_waitlist_ops_outbox_pending'
        values: "3x35 0x10"
    alert_rule_test:
      - eval_time: 25m
        alertname: WaitlistOpsOutboxPending
        exp_alerts: []
      - eval_time: 35m
        alertname: WaitlistOpsOutboxPending
        exp_alerts:
          - exp_labels:
              alertname: WaitlistOpsOutboxPending
              severity: warning
              service: gateway-service
            exp_annotations:
              summary: "Waitlist ops outbox has pending exports"
              description: "3 waitlist ops notification(s) pending export for >30m. Check gateway WaitlistOpsNotificationExporter and the slack_biz waitlist inbox directory."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#waitlistopsoutboxpending"
      - eval_time: 50m
        alertname: WaitlistOpsOutboxPending
        exp_alerts: []

  - name: waitlist oldest age and inbox backlog fire
    interval: 1m
    input_series:
      - series: 'parkio_waitlist_ops_outbox_oldest_pending_age_seconds'
        values: "2000x20"
      - series: 'parkio_waitlist_ops_inbox_backlog'
        values: "80x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: WaitlistOpsOutboxStale
        exp_alerts:
          - exp_labels:
              alertname: WaitlistOpsOutboxStale
              severity: warning
              service: gateway-service
            exp_annotations:
              summary: "Oldest waitlist ops outbox row is stale"
              description: "Oldest PENDING waitlist ops outbox row is 2000s old. Export may be deferred (inbox backlog / disk) or the exporter stopped."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#waitlistopsoutboxstale"
      - eval_time: 15m
        alertname: WaitlistOpsInboxBacklog
        exp_alerts:
          - exp_labels:
              alertname: WaitlistOpsInboxBacklog
              severity: warning
              service: gateway-service
            exp_annotations:
              summary: "Waitlist ops slack_biz inbox backlog high"
              description: "Waitlist ops inbox backlog is 80 envelopes. Consume or clear the inbox before export resumes."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#waitlistopsinboxbacklog"

  - name: slack delivery_unknown and dlt growth fire
    interval: 1m
    input_series:
      - series: 'parkio_slack_biz_delivery_unknown'
        values: "2x20"
      - series: 'parkio_slack_biz_dlt_rows'
        values: "1x5 4x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: SlackBizDeliveryUnknown
        exp_alerts:
          - exp_labels:
              alertname: SlackBizDeliveryUnknown
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz has delivery_unknown events"
              description: "2 Slack biz delivery_unknown row(s). Resolve with worker --resolve-unknown or inspect --list-unknown; do not silently drop."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizdeliveryunknown"
      - eval_time: 20m
        alertname: SlackBizDltGrowth
        exp_alerts:
          - exp_labels:
              alertname: SlackBizDltGrowth
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz DLT table is growing"
              description: "Slack biz DLT table depth increased over the last hour. Inspect --list-dlt and redrive or archive deliberately."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbizdltgrowth"

  - name: nr budget gate absent stays quiet
    interval: 1m
    input_series:
      # No parkio_nr_budget_gate_probe_success — pilot/gate not running.
      - series: 'parkio_slack_biz_textfile_last_success_unixtime'
        values: "0+60x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: NrBudgetGateExhausted
        exp_alerts: []

  - name: nr budget gate 507 probe failure fires then recovers
    interval: 1m
    input_series:
      - series: 'parkio_nr_budget_gate_probe_success'
        values: "0x10 1x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: NrBudgetGateExhausted
        exp_alerts: []
      - eval_time: 5m
        alertname: NrBudgetGateExhausted
        exp_alerts:
          - exp_labels:
              alertname: NrBudgetGateExhausted
              severity: warning
              service: nr-budget-gate
            exp_annotations:
              summary: "NR budget gate unhealthy or exhausted"
              description: "NR budget-gate /health probe reported failure for >2m (HTTP 507 exhaustion or probe error while the gate container is running). Check /stats; coordinate any budget_gate.py changes with #104."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#nrbudgetgateexhausted"
      - eval_time: 20m
        alertname: NrBudgetGateExhausted
        exp_alerts: []

  - name: slack textfile stale fires
    interval: 1m
    input_series:
      # Fixed stamp far in the past relative to eval_time wall clock.
      - series: 'parkio_slack_biz_textfile_last_success_unixtime'
        values: "0x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: SlackBizTextfileStale
        exp_alerts: []
      - eval_time: 20m
        alertname: SlackBizTextfileStale
        exp_alerts:
          - exp_labels:
              alertname: SlackBizTextfileStale
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz textfile metrics are stale"
              description: "parkio_slack_biz_textfile_last_success_unixtime is 1200s behind wall clock. Check parkio-slack-biz-textfile-export.timer and the node-exporter textfile mount."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbiztextfilestale"

  - name: slack textfile absent fires
    interval: 1m
    input_series:
      # No parkio_slack_biz_textfile_last_success_unixtime series at all.
      - series: 'parkio_slack_biz_delivery_unknown'
        values: "0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: SlackBizTextfileAbsent
        exp_alerts: []
      - eval_time: 20m
        alertname: SlackBizTextfileAbsent
        exp_alerts:
          - exp_labels:
              alertname: SlackBizTextfileAbsent
              severity: warning
              service: slack-biz
            exp_annotations:
              summary: "Slack biz textfile metrics are absent"
              description: "No parkio_slack_biz_textfile_last_success_unixtime series for >15m. Install/enable parkio-slack-biz-textfile-export.timer or repair the textfile collector path."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/operations/alert-response-runbook.md#slackbiztextfileabsent"
