# promtool unit tests for municipal IZUM + ISPARK SLA alert rules.
rule_files:
  - ../municipal-source-health-alert-rules.yml

evaluation_interval: 1m

tests:
  - name: ispark stale success age fires warning after for window
    interval: 1m
    input_series:
      - series: 'parkio_municipal_source_seconds_since_success{source_key="istanbul-ispark-parks",source_mode="SCHEDULED"}'
        values: "700 700 700 700 700 700"
      - series: 'parkio_municipal_source_operational_state{source_key="istanbul-ispark-parks",state="DISABLED"}'
        values: "0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 6m
        alertname: MunicipalIsparkSecondsSinceSuccessWarning
        exp_alerts:
          - exp_labels:
              alertname: MunicipalIsparkSecondsSinceSuccessWarning
              severity: warning
              owner: parking
              source_key: istanbul-ispark-parks
              source_mode: SCHEDULED
            exp_annotations:
              summary: ISPARK seconds since last success reached warning threshold
              description: ISPARK has not completed a successful sync within the warning SLA window (600s / ~5 missed 2-minute cycles).
              runbook_url: docs/operations/municipal-parking-source-runbook.md

  - name: ispark disabled suppresses age alert
    interval: 1m
    input_series:
      - series: 'parkio_municipal_source_seconds_since_success{source_key="istanbul-ispark-parks",source_mode="SCHEDULED"}'
        values: "900 900 900 900 900 900"
      - series: 'parkio_municipal_source_operational_state{source_key="istanbul-ispark-parks",state="DISABLED"}'
        values: "1 1 1 1 1 1"
    alert_rule_test:
      - eval_time: 6m
        alertname: MunicipalIsparkSecondsSinceSuccessWarning
        exp_alerts: []

  - name: izum consecutive failures warning still fires
    interval: 1m
    input_series:
      - series: 'parkio_municipal_source_consecutive_failures{source_key="izmir-izum-otoparklar",source_mode="SCHEDULED"}'
        values: "3 3 3 3 3 3"
      - series: 'parkio_municipal_source_operational_state{source_key="izmir-izum-otoparklar",state="DISABLED"}'
        values: "0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 6m
        alertname: MunicipalSourceConsecutiveFailuresWarning
        exp_alerts:
          - exp_labels:
              alertname: MunicipalSourceConsecutiveFailuresWarning
              severity: warning
              owner: parking
              source_key: izmir-izum-otoparklar
              source_mode: SCHEDULED
            exp_annotations:
              summary: Municipal source consecutive failures reached warning threshold
              description: IZUM sync consecutive failures are elevated. Check operational SLA state and bounded error category via actuator health details.
              runbook_url: docs/operations/municipal-parking-source-runbook.md

  - name: occupancy retention failure alert fires
    interval: 1m
    input_series:
      - series: 'parkio_municipal_occupancy_retention_failures_total'
        values: "0 1 1 1 1 1"
    alert_rule_test:
      - eval_time: 2m
        alertname: MunicipalOccupancyRetentionFailures
        exp_alerts:
          - exp_labels:
              alertname: MunicipalOccupancyRetentionFailures
              severity: warning
              owner: parking
            exp_annotations:
              summary: Municipal occupancy retention reported a failure
              description: Retention cleanup threw an error. Ingestion and Public Explore should continue; investigate parking-service logs.
              runbook_url: docs/operations/municipal-parking-source-runbook.md
