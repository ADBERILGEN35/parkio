# promtool unit tests for the alert-delivery rules in docker/prometheus/alerts.yml (U06, CL-F04).
rule_files:
  - ../alerts.yml

evaluation_interval: 15s

tests:
  - name: healthy delivery stays silent
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="slack",reason="serverError"}'
        values: "0+0x30"
      - series: 'alertmanager_notifications_failed_total{integration="webhook",reason="other"}'
        values: "0+0x30"
      - series: 'alertmanager_notifications_total{integration="slack"}'
        values: "0+2x30"
      - series: 'prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts"}'
        values: "0+0x30"
      - series: 'prometheus_notifications_sent_total{alertmanager="http://alertmanager:9093/api/v2/alerts"}'
        values: "0+3x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 5m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []

  - name: one failed notification is retried at the next flush and does not fire
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="slack",reason="serverError"}'
        values: "0 0 1 1x27"
    alert_rule_test:
      - eval_time: 5m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  - name: an Alertmanager restart resets the counters without firing
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="slack",reason="serverError"}'
        values: "5 5 5 0 0 0 0 0 0 0"
      - series: 'prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts"}'
        values: "7 7 7 0 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 8m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []

  - name: notifications cancelled by an Alertmanager shutdown are not receiver failures
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="slack",reason="contextCanceled"}'
        values: "0 0 3 3x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  - name: a receiver that keeps failing fires, per integration, and resolves when it recovers
    interval: 1m
    input_series:
      # One more given-up notification every 2m (reasons are summed), then the receiver recovers.
      - series: 'alertmanager_notifications_failed_total{integration="slack",reason="serverError"}'
        values: "0 0 1 1 2 2 3 3 3x25"
      - series: 'alertmanager_notifications_failed_total{integration="slack",reason="clientError"}'
        values: "0+0x33"
      - series: 'alertmanager_notifications_failed_total{integration="webhook",reason="serverError"}'
        values: "0+0x33"
    alert_rule_test:
      - eval_time: 3m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 6m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              alertname: AlertmanagerNotificationsFailing
              integration: slack
              severity: critical
              service: alertmanager
            exp_annotations:
              summary: "Alertmanager cannot deliver notifications via slack"
              description: "Alertmanager gave up on notifications via slack at least twice in 15m, after retrying. Alerts are not reaching the operator channel. Check the Alertmanager logs for the receiver error, then the receiver (webhook URL, Slack app, credentials)."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/architecture/observability-metrics.md#runbook--alertmanagernotificationsfailing"
      - eval_time: 30m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  - name: a short Alertmanager outage does not fire, even with several rule groups
    interval: 1m
    input_series:
      # About one failed batch per rule group with active alerts: four groups fail at once (0-1 min),
      # then a three-minute outage fails four batches every minute.
      - series: 'prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts"}'
        values: "0 0 4 4x12"
      - series: 'prometheus_notifications_errors_total{alertmanager="http://alertmanager-2:9093/api/v2/alerts"}'
        values: "0 0 4 8 12 12x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []
      - eval_time: 6m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []

  - name: a sustained Alertmanager outage fires after five minutes and resolves soon after recovery
    interval: 1m
    input_series:
      # Four failed batches every minute for ten minutes, then sends succeed again.
      - series: 'prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts"}'
        values: "0 4 8 12 16 20 24 28 32 36 40 40x6"
    alert_rule_test:
      - eval_time: 4m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: PrometheusNotificationsFailing
        exp_alerts:
          - exp_labels:
              alertname: PrometheusNotificationsFailing
              alertmanager: "http://alertmanager:9093/api/v2/alerts"
              severity: critical
              service: prometheus
            exp_annotations:
              summary: "Prometheus cannot send alerts to Alertmanager"
              description: "Prometheus has been failing to send alerts to http://alertmanager:9093/api/v2/alerts for about five minutes. Alerts are not reaching Alertmanager or the operator channel. Check that Alertmanager is running and reachable from Prometheus."
              runbook_url: "https://github.com/ADBERILGEN35/parkio/blob/api/docs/architecture/observability-metrics.md#runbook--prometheusnotificationsfailing"
      - eval_time: 14m
        alertname: PrometheusNotificationsFailing
        exp_alerts: []
