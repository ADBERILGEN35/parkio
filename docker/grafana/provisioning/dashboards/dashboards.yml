apiVersion: 1

# Drop Grafana dashboard JSON files into ./grafana/provisioning/dashboards/ and
# they will be loaded automatically. Bundled dashboards:
#   parkio-hosted-beta.json, parkio-api-health.json, parkio-jvm.json,
#   parkio-kafka.json, parkio-postgresql.json, parkio-outbox-dlq.json,
#   parkio-client-errors.json
providers:
  - name: parkio
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
