# Collector-only production overlay. Apply only after the supported host helper
# has resolved the three approved services and populated its bounded spool.
# This file defines no application service and therefore starts/stops independently.

services:
  nr-budget-gate:
    restart: "no"
    environment:
      PARKIO_NR_UPSTREAM_BASE_URI: ${PARKIO_NR_UPSTREAM_BASE_URI:?set the EU Log API endpoint}
      PARKIO_NR_LOG_API_KEY: ${PARKIO_NR_LOG_API_KEY:?supply a New Relic ingest license key out of band}
      PARKIO_NR_BUDGET_BYTES: ${PARKIO_NR_BUDGET_BYTES:?set the approved whole-pilot serialized-byte budget}
      PARKIO_NR_UPSTREAM_TLS_VERIFY: "on"
      PARKIO_NR_GATE_TEST_CONTROL: "off"
    volumes: !override
      - ../scripts/newrelic_log_pilot/budget_gate.py:/opt/parkio/scripts/newrelic_log_pilot/budget_gate.py:ro
      - ${PARKIO_NR_BUDGET_STATE_ROOT:?set the persistent budget-state directory}:/var/lib/parkio-nr-budget
    ports: !override []

  fluent-bit-nr-pilot:
    # A one-hour pilot must remain stopped after an operator stop, Docker daemon
    # restart or host restart. A later durable service needs a separate decision.
    restart: "no"
    environment:
      PARKIO_ENVIRONMENT: ${PARKIO_ENVIRONMENT:?set the exact production environment label}
      PARKIO_RELEASE_ID: ${PARKIO_RELEASE_ID:?set the deployed application source or release identity}
      PARKIO_COLLECTOR_SOURCE_SHA: ${PARKIO_COLLECTOR_SOURCE_SHA:?set the reviewed collector source SHA}
      PARKIO_NR_PILOT_MARKER: ${PARKIO_NR_PILOT_MARKER:?set a unique non-secret activation marker}
    volumes: !override
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parkio/parsers.conf:ro
      - ./fluent-bit/parkio_filters.lua:/fluent-bit/etc/parkio/parkio_filters.lua:ro
      - ${PARKIO_NR_COLLECTOR_STATE_ROOT:?set the collector-state directory}:/var/fluent-bit/state
      # This is the helper-owned spool, not Docker's private json-file storage.
      - ${PARKIO_NR_SOURCE_ROOT:?set the reviewed helper spool path}:/var/log/parkio-pilot:ro
    ports: !override []
