# Parkio New Relic log pilot — Fluent Bit (ops.log.v1)
#
# Opt-in only. Parsing/redaction identical for mock HTTP and New Relic Log API.
# Destination differs only via PARKIO_NR_LOG_* environment variables.
#
# Default input: file tails under /var/log/parkio-pilot/<service>/*.log
# (isolated validation + optional app log bind-mounts). Docker socket is NOT
# required for this path. See fluent-bit.docker.conf for the optional
# docker.sock collector profile (same filters/output).

[SERVICE]
    Flush           1
    Daemon          Off
    Log_Level       ${PARKIO_NR_LOG_FLUENT_LOG_LEVEL}
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    Health_Check    On
    HC_Errors_Count 5
    HC_Retry_Failure_Count 5
    HC_Period       30
    storage.path    /var/fluent-bit/state
    storage.sync    normal
    storage.checksum off
    storage.backlog.mem_limit 10M
    Mem_Buf_Limit   10MB
    Parsers_File    /fluent-bit/etc/parkio/parsers.conf

[INPUT]
    Name                tail
    Tag                 parkio.pilot
    Path                /var/log/parkio-pilot/*/*.log
    Path_Key            pilot_path
    DB                  /var/fluent-bit/state/pilot-tail.db
    Mem_Buf_Limit       5MB
    Skip_Long_Lines     On
    Skip_Empty_Lines    On
    Refresh_Interval    1
    Rotate_Wait         5
    Read_from_Head      On
    multiline.parser    java

[FILTER]
    Name                lua
    Match               parkio.pilot
    script              /fluent-bit/etc/parkio/parkio_filters.lua
    call                process_record

[FILTER]
    Name                grep
    Match               parkio.pilot
    Regex               export_decision export

[FILTER]
    Name                record_modifier
    Match               parkio.pilot
    Record              environment ${PARKIO_ENVIRONMENT}
    Record              release_id ${PARKIO_GIT_SHA}
    Record              pipeline nr-log-pilot
    Record              schema_version ops.log.v1
    Record              collector fluent-bit-3.2.10

[OUTPUT]
    Name                http
    Match               parkio.pilot
    Host                ${PARKIO_NR_LOG_HOST}
    Port                ${PARKIO_NR_LOG_PORT}
    URI                 ${PARKIO_NR_LOG_URI}
    Format              json
    Json_date_key       timestamp
    Json_date_format    iso8601
    Header              Api-Key ${PARKIO_NR_LOG_API_KEY}
    Header              Content-Type application/json
    Retry_Limit         5
    workers             1
    tls                 ${PARKIO_NR_LOG_TLS}
    tls.verify          ${PARKIO_NR_LOG_TLS_VERIFY}
    storage.total_limit_size 50M

# Dropped / excluded records are counted via parse_status in process_record;
# optionally land on disk for operator inspection (bounded by volume size).
[OUTPUT]
    Name                null
    Match               parkio.pilot.drop
