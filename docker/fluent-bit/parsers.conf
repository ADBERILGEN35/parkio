[PARSER]
    Name        docker_json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

# Custom multiline for Spring Boot text logs (header line + Java stack frames).
# Loaded via Parsers_File; referenced as multiline.parser spring_java on Tail.
[MULTILINE_PARSER]
    name          spring_java
    type          regex
    flush_timeout 2000
    key_content   log
    rule          "start_state"  "/^[0-9]{4}-[0-9]{2}-[0-9]{2}.*/"   "cont"
    rule          "cont"         "/^[\t ]+(at |\.\.\. [0-9]+ more|Caused by:).*/"  "cont"
