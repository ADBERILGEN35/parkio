[PARSER]
    Name        parkio_docker_json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

# Parse Docker's json-file envelope first, then join Spring Boot exception lines.
# A new timestamped Spring line ends the preceding stack. Exception class,
# Caused by, Suppressed, frame and elided-frame lines remain in one message.
[MULTILINE_PARSER]
    name          parkio_docker_spring
    type          regex
    flush_timeout 2000
    parser        parkio_docker_json
    key_content   log
    rule          "start_state"  "/^[0-9]{4}-[0-9]{2}-[0-9]{2}[T ].*/"  "cont"
    rule          "cont"         "/^[[:space:]]+at[[:space:]].*/"         "cont"
    rule          "cont"         "/^[[:space:]]*Caused by:.*/"           "cont"
    rule          "cont"         "/^[[:space:]]*Suppressed:.*/"          "cont"
    rule          "cont"         "/^[[:space:]]*\\.\\.\\. [0-9]+ more.*/" "cont"
    rule          "cont"         "/^[[:space:]]*[A-Za-z_$][A-Za-z0-9_.$]*(Exception|Error)(:.*)?$/" "cont"
