# Optional docker.sock collector profile (NOT default).
#
# Justification: Promtail already uses docker.sock for Loki. This profile
# mirrors that permission model for the NR pilot only when operators opt in
# via compose profile `nr-log-pilot-docker`. Prefer file-input mode when
# possible. Socket is mounted read-only.
#
# Same parsers/filters/output contract as fluent-bit.conf.

[SERVICE]
    Flush           1
    Daemon          Off
    Log_Level       ${PARKIO_NR_LOG_FLUENT_LOG_LEVEL}
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    Health_Check    On
    storage.path    /var/fluent-bit/state
    storage.backlog.mem_limit 10M
    Mem_Buf_Limit   10MB
    Parsers_File    /fluent-bit/etc/parkio/parsers.conf

[INPUT]
    Name                forward
    Listen              0.0.0.0
    Port                24224
    Mem_Buf_Limit       5MB

# Operators typically pair this with docker logging driver fluentd pointing at
# this forward port for gateway/auth/parking only — never enable fluentd driver
# repository-wide. Prefer file mode from the main config for the pilot.

[FILTER]
    Name                lua
    Match               *
    script              /fluent-bit/etc/parkio/parkio_filters_docker.lua
    call                process_docker_record

[FILTER]
    Name                grep
    Match               *
    Regex               export_decision export

[FILTER]
    Name                record_modifier
    Match               *
    Record              environment ${PARKIO_ENVIRONMENT}
    Record              release_id ${PARKIO_GIT_SHA}
    Record              pipeline nr-log-pilot
    Record              schema_version ops.log.v1
    Record              collector fluent-bit-3.2.10

[OUTPUT]
    Name                http
    Match               *
    Host                ${PARKIO_NR_LOG_HOST}
    Port                ${PARKIO_NR_LOG_PORT}
    URI                 ${PARKIO_NR_LOG_URI}
    Format              json
    Json_date_key       timestamp
    Json_date_format    iso8601
    Header              Api-Key ${PARKIO_NR_LOG_API_KEY}
    Header              Content-Type application/json
    Retry_Limit         5
    tls                 ${PARKIO_NR_LOG_TLS}
    tls.verify          ${PARKIO_NR_LOG_TLS_VERIFY}
    storage.total_limit_size 50M
