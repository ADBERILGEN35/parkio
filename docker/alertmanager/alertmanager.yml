global:
  resolve_timeout: 5m

route:
  receiver: "null"
  group_by: ["alertname", "service", "severity", "component"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: "null"
      group_wait: 15s
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: "null"
      repeat_interval: 4h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service", "component"]
  - source_matchers:
      - alertname="GatewayDown"
    target_matchers:
      - alertname=~"ServiceDown|GatewayHigh5xxRate|Gateway5xxElevated|GatewayHighLatencyP95|GatewayLatencyP95High"
    equal: ["service"]
  - source_matchers:
      - alertname="CoreServiceDown"
    target_matchers:
      - alertname="ServiceDown"
    equal: ["service"]
  - source_matchers:
      - alertname="PostgresDown"
    target_matchers:
      - alertname="DatabaseConnectionPoolExhausted"
  - source_matchers:
      - alertname="KafkaBrokerUnavailable"
    target_matchers:
      - alertname=~"KafkaConsumerLagHigh|KafkaConsumerLagSustained|KafkaDltMessagesPresent|KafkaDltGrowing"
  - source_matchers:
      - alertname="HostDiskSpaceCritical"
    target_matchers:
      - alertname=~"HostDiskSpaceLow|HostDiskWillFillSoon"
    equal: ["instance", "mountpoint"]
  - source_matchers:
      - alertname="BackupFailed"
    target_matchers:
      - alertname="BackupStale"
    equal: ["scope"]
  - source_matchers:
      - alertname="BackupOffsiteFailed"
    target_matchers:
      - alertname="BackupOffsiteStale"
    equal: ["scope"]

receivers:
  - name: "null"
