# Parkio — immutable image tags for hosted-beta deploy / rollback.
#
# Always use WITH the base + apps overlays (and hosted-beta when on a VPS):
#
#   export PARKIO_IMAGE_TAG=sha-$(git rev-parse HEAD)
#   export PARKIO_GIT_SHA=$(git rev-parse HEAD)
#   export PARKIO_IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
#   docker compose -f docker/docker-compose.yml \
#     -f docker/docker-compose.apps.yml \
#     -f docker/docker-compose.images.yml \
#     -f docker/docker-compose.hosted-beta.yml \
#     --env-file docker/.env \
#     up -d --build
#
# Deploy builds and tags images as parkio/<service>:${PARKIO_IMAGE_TAG}.
# Rollback sets PARKIO_IMAGE_TAG to a previous sha and runs `up -d` WITHOUT --build
# so Compose uses the already-built local (or pulled) images.
#
# OCI labels (revision/version/created) are baked by each service Dockerfile via
# IMAGE_* build-args (see services/*/Dockerfile).

name: parkio

x-image-build-args: &image-build-args
  IMAGE_VERSION: ${PARKIO_IMAGE_VERSION:-0.0.1-SNAPSHOT}
  IMAGE_REVISION: ${PARKIO_GIT_SHA:-unknown}
  IMAGE_CREATED: ${PARKIO_IMAGE_CREATED:-}

services:
  gateway-service:
    image: parkio/gateway-service:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args: *image-build-args

  auth-service:
    image: parkio/auth-service:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args: *image-build-args

  user-service:
    image: parkio/user-service:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args: *image-build-args

  parking-service:
    image: parkio/parking-service:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args: *image-build-args

  media-service:
    image: parkio/media-service:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args: *image-build-args

  gamification-service:
    image: parkio/gamification-service:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args: *image-build-args

  notification-service:
    image: parkio/notification-service:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args: *image-build-args

  moderation-service:
    image: parkio/moderation-service:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args: *image-build-args

  ai-validation-service:
    image: parkio/ai-validation-service:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args: *image-build-args

  analytics-service:
    image: parkio/analytics-service:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args: *image-build-args

  web:
    image: parkio/web:${PARKIO_IMAGE_TAG:?PARKIO_IMAGE_TAG is required}
    build:
      args:
        IMAGE_VERSION: ${PARKIO_IMAGE_VERSION:-0.0.1-SNAPSHOT}
        IMAGE_REVISION: ${PARKIO_GIT_SHA:-unknown}
        IMAGE_CREATED: ${PARKIO_IMAGE_CREATED:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
        VITE_APP_ENV: ${VITE_APP_ENV:-hosted-beta}
        VITE_SMART_RETURN_ENABLED: ${VITE_SMART_RETURN_ENABLED:-true}
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
        VITE_MAPTILER_STYLE: ${VITE_MAPTILER_STYLE:-streets-v2}
        VITE_FRONTEND_ERROR_REPORTING: ${VITE_FRONTEND_ERROR_REPORTING:-disabled}
        VITE_WAITLIST_INTAKE_MODE: ${VITE_WAITLIST_INTAKE_MODE:-api}
        VITE_WEB_MUNICIPAL_DISCOVERY_ENABLED: ${VITE_WEB_MUNICIPAL_DISCOVERY_ENABLED:-false}
