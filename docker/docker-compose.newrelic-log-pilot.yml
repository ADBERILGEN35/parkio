# Opt-in New Relic log pilot (ops.log.v1) — NEVER included by default.
#
# File-input mode (default validation / local pilot):
#   docker compose -f docker/docker-compose.newrelic-log-pilot.yml \
#     --profile nr-log-pilot up -d
#
# Real New Relic (non-prod only; requires securely supplied license key):
#   export PARKIO_NR_LOG_HOST=log-api.newrelic.com   # or log-api.eu.newrelic.com
#   export PARKIO_NR_LOG_PORT=443
#   export PARKIO_NR_LOG_TLS=on
#   export PARKIO_NR_LOG_URI=/log/v1
#   export PARKIO_NR_LOG_API_KEY="***"   # license key — never commit
#   export PARKIO_ENVIRONMENT=nonprod-pilot
#   export PARKIO_GIT_SHA=$(git rev-parse --short HEAD)
#
# Production activation: NOT enabled by this overlay. Hosted/invite compose
# files do not include this profile.
#
# Promtail/Loki remain unchanged. This pilot is a separate NR ingestion path
# (pipeline=nr-log-pilot). Do not also enable NR infra-agent log forwarding.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mock-nr-receiver:
    profiles: ["nr-log-pilot"]
    image: ${PARKIO_NR_MOCK_RECEIVER_IMAGE:-python:3.12-alpine}
    container_name: parkio-mock-nr-receiver
    restart: unless-stopped
    logging: *default-logging
    working_dir: /opt/parkio
    command: ["python", "/opt/parkio/scripts/newrelic_log_pilot/mock_receiver.py"]
    environment:
      PARKIO_MOCK_NR_PORT: "8089"
      PARKIO_MOCK_NR_STORE: /var/parkio-mock-nr/received.jsonl
    volumes:
      - ../scripts/newrelic_log_pilot/mock_receiver.py:/opt/parkio/scripts/newrelic_log_pilot/mock_receiver.py:ro
      - nr-mock-received:/var/parkio-mock-nr
    ports:
      - "127.0.0.1:${PARKIO_MOCK_NR_HOST_PORT:-18089}:8089"
    networks: [parkio-nr-pilot]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  fluent-bit-nr-pilot:
    profiles: ["nr-log-pilot"]
    image: ${FLUENT_BIT_IMAGE:-fluent/fluent-bit:3.2.10}
    # Pinned digest (linux/amd64) verified 2026-09-20:
    # sha256:d6dec000c4929a439562525728c708f6e99800d7ddc82efd6aa4f45f3a20b562
    container_name: parkio-fluent-bit-nr-pilot
    restart: unless-stopped
    logging: *default-logging
    user: "0:0"
    # No docker.sock in default file mode. Read-only config + bounded state.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parkio/parsers.conf:ro
      - ./fluent-bit/parkio_filters.lua:/fluent-bit/etc/parkio/parkio_filters.lua:ro
      - ./fluent-bit/parkio_filters_docker.lua:/fluent-bit/etc/parkio/parkio_filters_docker.lua:ro
      - nr-pilot-logs:/var/log/parkio-pilot:ro
      - nr-pilot-state:/var/fluent-bit/state
    environment:
      PARKIO_ENVIRONMENT: ${PARKIO_ENVIRONMENT:-local-nr-pilot}
      PARKIO_GIT_SHA: ${PARKIO_GIT_SHA:-unknown}
      PARKIO_NR_LOG_FLUENT_LOG_LEVEL: ${PARKIO_NR_LOG_FLUENT_LOG_LEVEL:-info}
      # Default destination = in-compose mock (identical JSON path to NR Log API).
      PARKIO_NR_LOG_HOST: ${PARKIO_NR_LOG_HOST:-mock-nr-receiver}
      PARKIO_NR_LOG_PORT: ${PARKIO_NR_LOG_PORT:-8089}
      PARKIO_NR_LOG_URI: ${PARKIO_NR_LOG_URI:-/log/v1}
      PARKIO_NR_LOG_API_KEY: ${PARKIO_NR_LOG_API_KEY:-mock-not-a-real-license}
      PARKIO_NR_LOG_TLS: ${PARKIO_NR_LOG_TLS:-off}
      PARKIO_NR_LOG_TLS_VERIFY: ${PARKIO_NR_LOG_TLS_VERIFY:-off}
    depends_on:
      mock-nr-receiver:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PARKIO_NR_FLUENT_HTTP_PORT:-2020}:2020"
    networks: [parkio-nr-pilot]
    healthcheck:
      test: ["CMD", "/fluent-bit/bin/fluent-bit", "-V"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    cpus: 0.50

networks:
  parkio-nr-pilot:
    name: parkio-nr-pilot
    driver: bridge

volumes:
  nr-pilot-logs:
  nr-pilot-state:
  nr-mock-received:
